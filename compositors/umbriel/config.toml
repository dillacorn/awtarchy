"XF86AudioRaiseVolume" = "spawn wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute" = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86AudioMicMute" = "spawn wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"
"XF86MonBrightnessUp" = "spawn brightnessctl -e4 -n2 set 5%+"
"XF86MonBrightnessDown" = "spawn brightnessctl -e4 -n2 set 5%-"
"XF86AudioPlay" = "spawn playerctl play-pause"
"XF86AudioNext" = "spawn playerctl next"
"XF86AudioPrev" = "spawn playerctl previous"

[[window_rule]]
match.app_id = "^(btop)$"
default_floating = true
default_floating_size = { width = 0.80, height = 0.85 }
default_position = { x = 0, y = 0, anchor = "center" }

[[window_rule]]
match.app_id = "^(maccel)$"
default_floating = true
default_floating_size = { width = 0.90, height = 0.96 }
default_position = { x = 0, y = 0, anchor = "center" }

[[window_rule]]
match.app_id = "^(Wiremix)$"
default_floating = true
default_floating_size = { width = 0.65, height = 0.70 }
default_position = { x = 0, y = 0, anchor = "center" }

[[window_rule]]
match.app_id = "^(wallpicker)$"
default_floating = true
default_floating_size = { width = 0.85, height = 0.90 }
default_position = { x = 0, y = 0, anchor = "center" }

[[window_rule]]
match.app_id = "^(smtty|smtty-O)$"
default_floating = true
default_floating_size = { width = 0.50, height = 0.65 }
default_position = { x = 0, y = 0, anchor = "center" }

[[window_rule]]
match.app_id = "^(awtarchy-default-apps)$"
default_floating = true
default_floating_size = { width = 0.68, height = 0.70 }
default_position = { x = 0, y = 0, anchor = "center" }

[[window_rule]]
match.app_id = "^(awtarchy-tips-tui)$"
default_floating = true
default_floating_size = { width = 0.50, height = 0.50 }
default_position = { x = 0, y = 0, anchor = "center" }

[[window_rule]]
match.app_id = "^(awtarchy-qalc)$"
default_floating = true
default_floating_size = { width = 0.45, height = 0.50 }
default_position = { x = 0, y = 0, anchor = "center" }

# A fullscreen game can request asynchronous presentation only on an output
# explicitly configured for tearing in the machine-specific migrated include.
[[window_rule]]
match.app_id = "^(gamescope|steam_app_.*|lutris_game_class|minigalaxy|playnite_game_class|.*[.]exe)$"
tearing = true

