# Awtarchy Umbriel experimental profile, included only if the user has no
# pre-existing ~/.config/umbriel/config.toml. Never change other compositors.
# Outputs (mode, position, VRR, HDR, tearing) remain at upstream defaults until
# tested on this exact GPU/display combination.
[general]
autostart = ["bash ~/.config/umbriel/awtarchy-trial/session.sh"]
show_cheatsheet = false

[layout]
mode = "dwindle"
gap = 6

# Match Awtarchy Hyprland's square, thin window borders.
[appearance]
border_width = 1
outer_border_width = 0
corner_radius = 0
drag_opacity = 1.0

[appearance.shadow]
enabled = false

# Umbriel supports different timing primitives from Hyprland. These are a
# conservative translation of Awtarchy's fast pop-in, fade and window motion
# profile; no heavy animation effects or forced workspace slide.
[animation]
enabled = true
duration_ms = 160
curve = "0.23,1.0,0.32,1.0"

[animation.windows_in]
enabled = true
style = "popin"
scale = 0.87
duration_ms = 125

[animation.windows_out]
enabled = true
style = "popin"
scale = 0.87
duration_ms = 95
curve = "linear"

[animation.windows_move]
enabled = true
duration_ms = 165

[animation.windows_resize]
enabled = true
duration_ms = 145

[animation.windows_opacity]
enabled = true
duration_ms = 125
curve = "0.2,0.5,0.3,1.0"

[animation.border]
enabled = true
duration_ms = 130

[animation.workspaces]
enabled = false

[animation.layers]
enabled = true
duration_ms = 130
curve = "0.4,0.1,0.2,1.0"

[input.keyboard]
numlock_toggle = true

[keybinds]
"Mod+Return" = "spawn foot"
"Alt+Return" = "spawn foot"
"Mod+D" = "spawn bash ~/.config/umbriel/awtarchy-trial/ipc.sh launcher toggle"
"Alt+P" = "spawn bash ~/.config/umbriel/awtarchy-trial/ipc.sh launcher toggle"
"Mod+P" = "spawn bash ~/.config/umbriel/awtarchy-trial/ipc.sh powermenu begin"
"Mod+N" = "spawn bash ~/.config/umbriel/awtarchy-trial/ipc.sh notifications toggle"
"Mod+C" = "spawn bash ~/.config/umbriel/awtarchy-trial/ipc.sh clipboard toggle"
"Mod+Alt+BackSpace" = "spawn bash ~/.config/umbriel/awtarchy-trial/ipc.sh quicksettings toggle"
"Mod+Shift+Space" = "spawn fuzzel"
"Mod+Ctrl+M" = "spawn wdisplays"
"Mod+Q" = "window-close"
"Alt+F4" = "window-close"
"Mod+Escape" = "session-quit"
"Alt+Tab" = "window-focus-next"
"Alt+Shift+Tab" = "window-focus-previous"
"Mod+F" = "window-toggle-fullscreen"
"Mod+Ctrl+F" = "window-toggle-maximize"
"Alt+F" = "window-toggle-floating"
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+Shift+Left" = "window-move-left"
"Mod+Shift+Right" = "window-move-right"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Down" = "window-move-down"
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+0" = "workspace-switch 10"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"
"Mod+Shift+0" = "window-move-to-workspace 10"
"XF86AudioRaiseVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute" = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
