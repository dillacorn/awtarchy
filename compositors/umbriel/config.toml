# Awtarchy Umbriel experimental profile, included only if the user has no
# pre-existing ~/.config/umbriel/config.toml. Never change other compositors.
# Outputs (mode, position, VRR, HDR, tearing) remain at upstream defaults until
# tested on this exact GPU/display combination.
[general]
autostart = ["bash ~/.config/umbriel/awtarchy-trial/session.sh"]
show_cheatsheet = false
# Umbriel has a single native modifier for mouse-move and mouse-resize.
# Use Alt for both drags; bind desktop keyboard actions explicitly to Super.
mod_key = "Alt"

[layout]
mode = "dwindle"
gap = 6

# Match Awtarchy Hyprland's square, thin window borders.
[appearance]
border_width = 1
outer_border_width = 0
corner_radius = 0
drag_opacity = 1.0

# Native Umbriel decorations follow client requests; never load hyprbars here.
[appearance.title_bar]
mode = "negotiated"
height = 28
buttons = ["minimize", "maximize", "close"]

[appearance.shadow]
enabled = false

# Umbriel supports different timing primitives from Hyprland. These are a
# conservative translation of Awtarchy's fast pop-in, fade and window motion
# profile; no heavy animation effects or forced workspace slide.
[animation]
enabled = true
duration_ms = 160
curve = "0.23,1.0,0.32,1.0"

[animation.windows_in]
enabled = true
style = "popin"
scale = 0.87
duration_ms = 125

[animation.windows_out]
enabled = true
style = "popin"
scale = 0.87
duration_ms = 95
curve = "linear"

[animation.windows_move]
enabled = true
duration_ms = 165

[animation.windows_resize]
enabled = true
duration_ms = 145

[animation.windows_opacity]
enabled = true
duration_ms = 125
curve = "0.2,0.5,0.3,1.0"

[animation.border]
enabled = true
duration_ms = 130

[animation.workspaces]
enabled = false

[animation.layers]
enabled = true
duration_ms = 130
curve = "0.4,0.1,0.2,1.0"

[input.mouse]
# Match Awtarchy Hyprland/Sway: no libinput acceleration or speed offset.
accel_profile = "flat"
sensitivity = 0.0

[input.keyboard]
numlock_toggle = true

[keybinds]
"Super+Return" = "spawn foot"
"Alt+Shift+Return" = "spawn foot"
