# Awtarchy Sway idle policy. Loaded by: swayidle -w -C this-file
# Sway's Wayland-native idle inhibitors handle fullscreen games/video when
# applicable; the Sway action guard also respects manual Keep Awake and OBS.
timeout 180 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/sway/awtarchy-trial/idle-action.sh" lock'
timeout 240 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/sway/awtarchy-trial/idle-action.sh" dpms-off' resume 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/sway/awtarchy-trial/idle-action.sh" dpms-on'
timeout 540 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/sway/awtarchy-trial/idle-action.sh" suspend'
before-sleep 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/sway/awtarchy-trial/idle-action.sh" pre-sleep'
after-resume 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/sway/awtarchy-trial/idle-action.sh" resume'
