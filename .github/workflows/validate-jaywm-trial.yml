name: Validate JayWM Trial
on:
  push:
    branches: [JayWM_Migration_Trial_Investigation]
    paths:
      - 'trials/jay/**'
      - 'tests/test-jay-trial.sh'
      - 'tests/test-jay-monitor-profile.py'
      - 'tests/test-jay-monitor-import.py'
      - 'tests/test-jay-quickshell-port.py'
      - 'tests/test-jay-manager-port.py'
      - 'tests/test-jay-installer-choice.py'
      - 'tests/test-jay-setup-preflight.py'
      - 'tests/test-jay-quicksettings.py'
      - 'tests/test-jay-diagnose.py'
      - 'local/share/awtarchy/awtarchy-runtime.sh'
      - '.github/workflows/validate-jaywm-trial.yml'
  pull_request:
    paths:
      - 'trials/jay/**'
      - 'tests/test-jay-trial.sh'
      - 'tests/test-jay-installer-choice.py'
      - 'local/share/awtarchy/awtarchy-runtime.sh'
      - '.github/workflows/validate-jaywm-trial.yml'
  workflow_dispatch:
jobs:
  static-trial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check shell and TOML
        run: |
          bash tests/test-jay-trial.sh
          python3 tests/test-jay-monitor-profile.py
          python3 tests/test-jay-monitor-import.py
          python3 tests/test-jay-quickshell-port.py
          python3 tests/test-jay-manager-port.py
          python3 tests/test-jay-installer-choice.py
          python3 tests/test-jay-setup-preflight.py
          python3 tests/test-jay-quicksettings.py
          python3 tests/test-jay-diagnose.py
          bash -n local/share/awtarchy/awtarchy-runtime.sh
