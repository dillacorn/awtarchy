name: Validate JayWM Trial
on:
  push:
    branches: [JayWM_Migration_Trial_Investigation]
    paths:
      - 'trials/jay/**'
      - 'config/quickshell/awtarchy/**'
      - 'tests/test-jay-trial.sh'
      - 'tests/test-jay-monitor-profile.py'
      - 'tests/test-jay-monitor-import.py'
      - 'tests/test-jay-quickshell-port.py'
      - 'tests/test-jay-manager-port.py'
      - 'tests/test-jay-installer-choice.py'
      - 'tests/test-jay-setup-preflight.py'
      - 'tests/test-jay-quicksettings.py'
      - 'tests/test-jay-diagnose.py'
      - 'tests/test-jay-compositor-management.py'
      - 'tests/test-jay-compositor-update-apply.py'
      - 'tests/test-jay-stage-hyprland.py'
      - 'tests/test-jay-sync.py'
      - 'awtarchy-install.sh'
      - 'local/bin/awtarchy'
      - 'local/share/awtarchy/awtarchy-runtime.sh'
      - '.github/workflows/validate-jaywm-trial.yml'
  pull_request:
    paths:
      - 'trials/jay/**'
      - 'tests/test-jay-trial.sh'
      - 'tests/test-jay-installer-choice.py'
      - 'local/share/awtarchy/awtarchy-runtime.sh'
      - '.github/workflows/validate-jaywm-trial.yml'
  workflow_dispatch:
jobs:
  static-trial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check shell and TOML
        run: |
          bash tests/test-jay-trial.sh
          python3 tests/test-jay-monitor-profile.py
          python3 tests/test-jay-monitor-import.py
          python3 tests/test-jay-quickshell-port.py
          python3 tests/test-jay-manager-port.py
          python3 tests/test-jay-installer-choice.py
          python3 tests/test-jay-setup-preflight.py
          python3 tests/test-jay-quicksettings.py
          python3 tests/test-jay-diagnose.py
          python3 tests/test-jay-compositor-management.py
          python3 tests/test-jay-compositor-update-apply.py
          python3 tests/test-jay-stage-hyprland.py
          python3 tests/test-jay-sync.py
          bash -n awtarchy-install.sh local/bin/awtarchy
          bash -n local/share/awtarchy/awtarchy-runtime.sh

  qml-parse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 QML syntax parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-declarative-dev-tools
          test -x /usr/lib/qt6/bin/qmlformat
      - name: Generate isolated Jay shell and parse every QML component
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/awtarchy-jay"
          python3 trials/jay/render-quickshell.py \
            --source config/quickshell/awtarchy \
            --dest "$output" --bridge-dir trials/jay
          count=0
          fail=0
          while IFS= read -r -d '' file; do
            if ! /usr/lib/qt6/bin/qmlformat --ignore-settings "$file" >/dev/null; then
              printf 'ERROR: Qt6 could not parse %s\n' "$file" >&2
              /usr/lib/qt6/bin/qmlformat --ignore-settings "$file" 2>&1 | tail -n 16 >&2 || true
              fail=1
            fi
            count=$((count + 1))
          done < <(find "$output" -maxdepth 1 -type f -name '*.qml' -print0)
          (( count >= 50 ))
          (( fail == 0 ))
          printf 'PASS: Qt6 parsed %s Jay Quickshell QML components\n' "$count"
