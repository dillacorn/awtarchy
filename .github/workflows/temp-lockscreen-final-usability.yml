name: Temporary Lockscreen Final Usability

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 181 && github.event.pull_request.head.ref == 'feature/lockscreen-interactive-effects'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Apply bounded editor usability fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          editor_path = Path('config/quickshell/awtarchy/LockscreenEditor.qml')
          surface_path = Path('config/quickshell/awtarchy-lock/LockSurface.qml')
          editor = editor_path.read_text()
          surface = surface_path.read_text()

          old_select = '''    function selectElement(name, additive) {
                  if (!elementExists(name))
                      return;
                  if (!additive) {'''
          new_select = '''    function selectElement(name, additive) {
                  if (!elementExists(name))
                      return;
                  activeDrawer = "element";
                  if (!additive) {'''
          if editor.count(old_select) != 1:
              raise SystemExit('selectElement anchor mismatch')
          editor = editor.replace(old_select, new_select, 1)

          old_pointer = 'const additive = !!(mouse.modifiers & (Qt.ShiftModifier | Qt.ControlModifier)); if (additive) root.selectElement(parent.elementName, true); else if (!root.selectedContains(parent.elementName)) root.selectElement(parent.elementName, false); if (!root.selectedContains(parent.elementName)) return;'
          new_pointer = 'const additive = !!(mouse.modifiers & (Qt.ShiftModifier | Qt.ControlModifier)); if (additive) root.selectElement(parent.elementName, true); else if (!root.selectedContains(parent.elementName)) root.selectElement(parent.elementName, false); else root.activeDrawer = "element"; if (!root.selectedContains(parent.elementName)) return;'
          if editor.count(old_pointer) != 1:
              raise SystemExit('preview pointer selection anchor mismatch')
          editor = editor.replace(old_pointer, new_pointer, 1)

          selector_anchor = 'LockscreenCompactSelector {'
          if editor.count(selector_anchor) != 5:
              raise SystemExit(f'unexpected compact selector count: {editor.count(selector_anchor)}')
          editor = editor.replace(selector_anchor, 'LockscreenCompactSelector {\n                            popupBoundary: editorFocus')

          settings_anchor = '''                id: settingsBar; anchors.left: parent.left; anchors.right: parent.right; anchors.bottom: parent.bottom; anchors.bottomMargin: root.settingsBarOffsetY; height: editorDockContent.implicitHeight + 18; color: Theme.popupBackground; border.width: 1; border.color: Theme.muted; z: 300
                  ColumnLayout {'''
          settings_replacement = '''                id: settingsBar; anchors.left: parent.left; anchors.right: parent.right; anchors.bottom: parent.bottom; anchors.bottomMargin: root.settingsBarOffsetY; height: editorDockContent.implicitHeight + 18; color: Theme.popupBackground; border.width: 1; border.color: Theme.muted; z: 300
                  MouseArea {
                      id: settingsBarDragArea
                      anchors.fill: parent
                      acceptedButtons: Qt.LeftButton
                      hoverEnabled: true
                      cursorShape: Qt.SizeVerCursor
                      preventStealing: true
                      property real pressSceneY: 0
                      property real pressOffsetY: 0
                      onPressed: mouse => {
                          const point = settingsBar.mapToItem(editorFocus, mouse.x, mouse.y);
                          pressSceneY = point.y;
                          pressOffsetY = root.settingsBarOffsetY;
                      }
                      onPositionChanged: mouse => {
                          if (!pressed)
                              return;
                          const point = settingsBar.mapToItem(editorFocus, mouse.x, mouse.y);
                          const limit = Math.max(0, editorFocus.height - settingsBar.height);
                          root.settingsBarOffsetY = Math.max(0, Math.min(limit,
                              pressOffsetY - (point.y - pressSceneY)));
                      }
                  }
                  ColumnLayout {'''
          if editor.count(settings_anchor) != 1:
              raise SystemExit('settings bar anchor mismatch')
          editor = editor.replace(settings_anchor, settings_replacement, 1)

          old_alt_drag = '''
                  DragHandler {
                      id: settingsBarAltDrag; target: null; acceptedButtons: Qt.LeftButton; acceptedModifiers: Qt.AltModifier; grabPermissions: PointerHandler.CanTakeOverFromAnything; dragThreshold: 0; xAxis.enabled: false; yAxis.enabled: true
                      yAxis.onActiveValueChanged: (delta) => { const limit = Math.max(0, editorFocus.height - settingsBar.height); root.settingsBarOffsetY = Math.max(0, Math.min(limit, root.settingsBarOffsetY - delta)); }
                  }
          '''
          if editor.count(old_alt_drag) != 1:
              raise SystemExit('legacy Alt drag anchor mismatch')
          editor = editor.replace(old_alt_drag, '\n', 1)

          old_cursor = '''            cursorVisible: false
                      font.family: root.theme.fontFamily'''
          new_cursor = '''            cursorDelegate: Item {
                          width: 0
                          height: 0
                          visible: false
                      }
                      font.family: root.theme.fontFamily'''
          if surface.count(old_cursor) != 1:
              raise SystemExit('password cursor anchor mismatch')
          surface = surface.replace(old_cursor, new_cursor, 1)

          editor_path.write_text(editor)
          surface_path.write_text(surface)
          PY

          HISTORY='local/share/awtarchy/quickshell-managed-history.sha256'
          for entry in \
            'config/quickshell/awtarchy/LockscreenEditor.qml:.config/quickshell/awtarchy/LockscreenEditor.qml' \
            'config/quickshell/awtarchy-lock/LockSurface.qml:.config/quickshell/awtarchy-lock/LockSurface.qml'; do
            src="${entry%%:*}"
            dst="${entry#*:}"
            digest="$(sha256sum "$src" | awk '{print $1}')"
            line="${digest}"$'\t'"${dst}"
            grep -Fqx -- "$line" "$HISTORY" || printf '%s\n' "$line" >> "$HISTORY"
          done

          bash tests/test-quickshell-lockscreen-selector-flyout.sh
          bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

      - name: Commit clean result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-lockscreen-final-usability.yml
          git add \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy-lock/LockSurface.qml \
            local/share/awtarchy/quickshell-managed-history.sha256 \
            .github/workflows/temp-lockscreen-final-usability.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(lockscreen): finish editor usability polish'
          git push origin HEAD:feature/lockscreen-interactive-effects
