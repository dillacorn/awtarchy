name: TEMP Align lockscreen editor regressions

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/tmp-align-lockscreen-editor-regressions.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Align superseded editor assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test-quickshell-lockscreen-editor.sh')
          text = path.read_text()
          replacements = [
              (
                  '''require_text "$LOCK_SCENE" 'fillMode: Image.PreserveAspectCrop' \\
              'LockScene wallpaper is not aspect-filled'\n''',
                  '''require_text "$LOCK_SCENE" 'function wallpaperGeometry()' \\
              'LockScene wallpaper has no Cover/Contain geometry path'\nrequire_text "$LOCK_SCENE" 'root.wallpaperFit === "contain"' \\
              'LockScene wallpaper does not preserve explicit Contain behavior'\n'''
              ),
              (
                  '''require_text "$DESKTOP_WEATHER" 'refreshProcess.exec([root.weatherHelper, "refresh", location])' \\
              'unlocked weather refresh does not pass blank location through for automatic mode'\n''',
                  '''require_text "$DESKTOP_WEATHER" 'refreshProcess.exec([root.weatherHelper, "refresh", location, units])' \\
              'unlocked weather refresh does not pass location and units through to the helper'\n'''
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one stale assertion, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          bash -n tests/test-quickshell-lockscreen-editor.sh
          shellcheck tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-background-composition.sh
          bash tests/test-quickshell-lockscreen-weather.sh
          bash tests/test-quickshell-lockscreen-weather-units.sh
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test-quickshell-lockscreen-editor.sh
          git diff --cached --quiet && exit 0
          git commit -m 'test: align lockscreen editor composition contracts'
          git push origin HEAD:feature/lockscreen-interactive-effects
