name: Validate Quickshell Lockscreen Foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  apply-opacity-preset-completion:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/lockscreen-interactive-effects' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck lua5.4
      - name: Complete Quick Settings opacity controls
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('config/quickshell/awtarchy/QuickSettings.qml')
          text = path.read_text(encoding='utf-8')
          old = '''                                        RowLayout {
                                              spacing: 5
                                              SettingsButton { label: "100%"; active: BarState.lockscreenBackgroundOpacity() === 100; textSize: root.scaledText(9); onClicked: root.queueStateCommand(["set-lockscreen-background-opacity", "100"]) }
                                              SettingsButton { label: "50%"; active: BarState.lockscreenBackgroundOpacity() === 50; textSize: root.scaledText(9); onClicked: root.queueStateCommand(["set-lockscreen-background-opacity", "50"]) }
                                              SettingsButton { label: "0%"; active: BarState.lockscreenBackgroundOpacity() === 0; textSize: root.scaledText(9); onClicked: root.queueStateCommand(["set-lockscreen-background-opacity", "0"]) }
                                          }
'''
          new = '''                                        RowLayout {
                                              spacing: 5
                                              SettingsButton { label: "100%"; active: BarState.lockscreenBackgroundOpacity() === 100; textSize: root.scaledText(9); onClicked: root.queueStateCommand(["set-lockscreen-background-opacity", "100"]) }
                                              SettingsButton { label: "75%"; active: BarState.lockscreenBackgroundOpacity() === 75; textSize: root.scaledText(9); onClicked: root.queueStateCommand(["set-lockscreen-background-opacity", "75"]) }
                                              SettingsButton { label: "50%"; active: BarState.lockscreenBackgroundOpacity() === 50; textSize: root.scaledText(9); onClicked: root.queueStateCommand(["set-lockscreen-background-opacity", "50"]) }
                                              SettingsButton { label: "25%"; active: BarState.lockscreenBackgroundOpacity() === 25; textSize: root.scaledText(9); onClicked: root.queueStateCommand(["set-lockscreen-background-opacity", "25"]) }
                                              SettingsButton { label: "0%"; active: BarState.lockscreenBackgroundOpacity() === 0; textSize: root.scaledText(9); onClicked: root.queueStateCommand(["set-lockscreen-background-opacity", "0"]) }
                                          }
                                          Text {
                                              Layout.fillWidth: true
                                              visible: BarState.lockscreenBackgroundOpacity() < 100
                                              text: "Transparency can reveal content from the unlocked desktop beneath the secure lockscreen."
                                              color: Theme.muted
                                              font.family: Theme.fontFamily
                                              font.pixelSize: root.scaledText(8)
                                              wrapMode: Text.Wrap
                                          }
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one background opacity preset block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Restore permanent interactive-effects workflow and remove one-use helper
        run: |
          set -euo pipefail
          git show c4b15c9f02de2735d6176dce4e51a02d2890d9a8:.github/workflows/validate-quickshell-lockscreen-interactive-effects.yml \
            > .github/workflows/validate-quickshell-lockscreen-interactive-effects.yml
          rm -f -- .github/workflows/dev-lockscreen-opacity-presets.yml
      - name: Refresh Quick Settings managed history
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          path='config/quickshell/awtarchy/QuickSettings.qml'
          rel=".${path}"
          entry="$(sha256sum "$path" | awk '{print $1}')"$'\t'"$rel"
          grep -Fqx -- "$entry" "$history" || printf '%s\n' "$entry" >>"$history"
      - name: Validate focused contracts
        run: |
          set -euo pipefail
          bash -n tests/test-quickshell-lockscreen-visualizer-transparency.sh
          shellcheck tests/test-quickshell-lockscreen-visualizer-transparency.sh
          bash tests/test-quickshell-lockscreen-visualizer-transparency.sh
          bash tests/test-quickshell-lockscreen-entry-transitions.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-interaction-polish.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          bash tests/test-quickshell-capture-privacy.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          git diff --exit-code origin/main -- config/quickshell/awtarchy-lock/LockAuth.qml
          git diff --check
      - name: Validate updater migration
        run: |
          set -euo pipefail
          aur_scan_fixture_installed=0
          cleanup_aur_scan_fixture() {
            if (( aur_scan_fixture_installed == 1 )); then
              sudo rm -f -- /usr/bin/aur-scan
            fi
          }
          trap cleanup_aur_scan_fixture EXIT
          if [[ ! -x /usr/bin/aur-scan ]]; then
            sudo install -m 0755 tests/fixtures/aur-scan-version-only.sh /usr/bin/aur-scan
            aur_scan_fixture_installed=1
          fi
          bash tests/test-quickshell-updater-migration.sh
          bash tests/test-quickshell-updater-bootstrap.sh
      - name: Commit verified production completion
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/dev-lockscreen-opacity-presets.yml \
            .github/workflows/validate-quickshell-lockscreen-interactive-effects.yml \
            config/quickshell/awtarchy/QuickSettings.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/dev-lockscreen-opacity-presets.yml \
            .github/workflows/validate-quickshell-lockscreen-interactive-effects.yml \
            config/quickshell/awtarchy/QuickSettings.qml \
            local/share/awtarchy/quickshell-managed-history.sha256 | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]]
          git commit -m 'Complete lockscreen background opacity controls'
          git push origin HEAD:feature/lockscreen-interactive-effects

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax validation
        run: |
          python3 -m py_compile local/share/awtarchy/awtarchy-lockscreen-hyprland-migrate.py
          bash -n config/hypr/scripts/awtarchy_lock.sh
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n local/share/awtarchy/awtarchy-package-reconcile.sh
          bash -n tests/test-quickshell-lockscreen-foundation.sh
          bash -n tests/test-quickshell-lockscreen-runtime-regressions.sh
          bash -n tests/test-quickshell-lockscreen-animation-preference.sh
          bash -n tests/test-quickshell-lockscreen-theme-update.sh
          bash -n tests/test-quickshell-lockscreen-cursor.sh
          bash -n tests/test-quickshell-power-menu-action-handoff.sh
          bash -n tests/test-workspace-animation-disabled.sh
          bash -n tests/test-quickshell-lockscreen-manager-mode.sh
          bash -n tests/test-quickshell-lockscreen-git-deployment.sh
          bash -n tests/test-quickshell-lockscreen-no-reload.sh
          bash -n tests/test-quickshell-lockscreen-migration.sh
          bash -n tests/test-quickshell-lockscreen-migration-failclosed.sh
          bash -n tests/test-quickshell-lockscreen-cutover.sh
          bash -n tests/test-quickshell-lockscreen-live-hyprland-migration.sh
          bash -n tests/test-quickshell-lockscreen-power-safety.sh
          bash -n tests/test-quickshell-lockscreen-user-cutover.sh
      - name: ShellCheck
        run: |
          shellcheck config/hypr/scripts/awtarchy_lock.sh
          shellcheck tests/test-quickshell-lockscreen-foundation.sh
          shellcheck tests/test-quickshell-lockscreen-runtime-regressions.sh
          shellcheck tests/test-quickshell-lockscreen-animation-preference.sh
          shellcheck tests/test-quickshell-lockscreen-theme-update.sh
          shellcheck tests/test-quickshell-lockscreen-cursor.sh
          shellcheck tests/test-quickshell-power-menu-action-handoff.sh
          shellcheck tests/test-workspace-animation-disabled.sh
          shellcheck tests/test-quickshell-lockscreen-manager-mode.sh
          shellcheck tests/test-quickshell-lockscreen-git-deployment.sh
          shellcheck tests/test-quickshell-lockscreen-no-reload.sh
          shellcheck tests/test-quickshell-lockscreen-migration.sh
          shellcheck tests/test-quickshell-lockscreen-migration-failclosed.sh
          shellcheck tests/test-quickshell-lockscreen-cutover.sh
          shellcheck tests/test-quickshell-lockscreen-live-hyprland-migration.sh
          shellcheck tests/test-quickshell-lockscreen-power-safety.sh
          shellcheck tests/test-quickshell-lockscreen-user-cutover.sh
      - name: Foundation contracts
        run: |
          bash tests/test-quickshell-lockscreen-foundation.sh
          bash tests/test-quickshell-lockscreen-runtime-regressions.sh
          bash tests/test-quickshell-lockscreen-animation-preference.sh
          bash tests/test-quickshell-lockscreen-cursor.sh
          bash tests/test-quickshell-lockscreen-theme-update.sh
          bash tests/test-quickshell-power-menu-action-handoff.sh
          bash tests/test-workspace-animation-disabled.sh
          bash tests/test-quickshell-lockscreen-manager-mode.sh
          bash tests/test-quickshell-lockscreen-git-deployment.sh
          bash tests/test-quickshell-lockscreen-no-reload.sh
      - name: Migration contracts
        run: |
          bash tests/test-quickshell-lockscreen-migration.sh
          bash tests/test-quickshell-lockscreen-migration-failclosed.sh
          bash tests/test-quickshell-lockscreen-cutover.sh
          bash tests/test-quickshell-lockscreen-live-hyprland-migration.sh
          bash tests/test-quickshell-lockscreen-user-cutover.sh
      - name: Secure power-transition contract
        run: bash tests/test-quickshell-lockscreen-power-safety.sh
