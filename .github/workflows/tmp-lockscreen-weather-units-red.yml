name: TEMP Prove lockscreen weather units RED

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/tmp-lockscreen-weather-units-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
      - name: Prove failing contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/test-quickshell-lockscreen-weather-units.sh
          shellcheck tests/test-quickshell-lockscreen-weather-units.sh
          bash tests/test-quickshell-lockscreen-background-save-dispatch.sh
          bash tests/test-quickshell-lockscreen-weather-units.sh
