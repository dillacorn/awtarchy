name: TEMP Finalize lockscreen metadata

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/tmp-finalize-lockscreen-metadata.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Apply metadata fixes
        shell: bash
        run: |
          set -euo pipefail

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          append_hash() {
            local hash="$1"
            local path="$2"
            local line
            line="${hash}"$'\t'"${path}"
            if ! grep -Fqx -- "$line" "$history"; then
              printf '%s\t%s\n' "$hash" "$path" >> "$history"
            fi
          }

          append_hash '3c5eccd96ca48c1dace4783239322517ab7642dadd67517793ca154edef1213d' '.config/quickshell/awtarchy/QuickSettings.qml'
          append_hash '955059bc785392bd3e5a37adc976f2e7daaea7403334ea1835174bc7806ba247' '.config/hypr/scripts/quickshell_application_state.sh'
          append_hash '14cd7490ec21c1e71370f7a6a2095f08a70598072c115a89cc47aaace450957e' '.config/quickshell/awtarchy/BarState.qml'
          append_hash '83611c424e3ec42392d35f8ce6377189bcc700f974ac513cd09599c19cadfb2d' '.config/quickshell/awtarchy/QuickSettings.qml'

          chmod +x config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh

          git diff --check
          git diff -- local/share/awtarchy/quickshell-managed-history.sha256 config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/share/awtarchy/quickshell-managed-history.sha256 config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh
          git diff --cached --quiet && {
            echo 'No metadata changes required.'
            exit 0
          }
          git commit -m 'fix: finalize lockscreen managed metadata'
          git push origin HEAD:feature/lockscreen-interactive-effects
