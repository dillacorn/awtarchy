name: Lockscreen Pre-map Patcher Fixer

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 181 && github.event.pull_request.head.ref == 'feature/lockscreen-interactive-effects'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Remove redundant Lua runner dependency
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/lua -e.*loadfile.*config\/hypr\/hyprland.lua/d' .github/workflows/lockscreen-premap-key-patcher.yml
          rm -f .github/workflows/lockscreen-premap-patcher-fixer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/lockscreen-premap-key-patcher.yml .github/workflows/lockscreen-premap-patcher-fixer.yml
          git commit -m 'ci(lockscreen): repair pre-map patch validation'
          git push origin HEAD:feature/lockscreen-interactive-effects