name: Apply Lockscreen Visualizer Editing

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - .github/workflows/apply-lockscreen-visualizer-editing.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Implement direct visualizer width and wide bend editing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} anchors, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          app = 'config/hypr/scripts/quickshell_application_state.sh'
          replace_once(app,
              'and ($bend | type) == "number" and ($bend | floor) == $bend and $bend >= -100 and $bend <= 100',
              'and ($bend | type) == "number" and ($bend | floor) == $bend and $bend >= -360 and $bend <= 360')

          bar = 'config/quickshell/awtarchy/BarState.qml'
          replace_all(bar, 'bend < -100 || bend > 100', 'bend < -360 || bend > 360')

          shell = 'config/quickshell/awtarchy-lock/shell.qml'
          replace_once(shell, 'bend < -100 || bend > 100', 'bend < -360 || bend > 360')

          scene = 'config/quickshell/awtarchy-lock/LockScene.qml'
          replace_once(scene,
              'return Math.round(visualizerNumber("bend", 45, -100, 100));',
              'return Math.round(visualizerNumber("bend", 45, -360, 360));')

          editor = 'config/quickshell/awtarchy/LockscreenEditor.qml'
          replace_once(editor,
              '    property real resizeCenterY: 0\n'
              '    property string rotationElementName: ""',
              '    property real resizeCenterY: 0\n'
              '    property bool visualizerWidthResizeActive: false\n'
              '    property real visualizerWidthStartStretch: 1\n'
              '    property real visualizerWidthStartDistance: 1\n'
              '    property real visualizerWidthCenterX: 0\n'
              '    property string rotationElementName: ""')
          replace_once(editor,
              'bend: Number.isInteger(bend) ? Math.max(-100, Math.min(100, bend)) : defaults.bend,',
              'bend: Number.isInteger(bend) ? Math.max(-360, Math.min(360, bend)) : defaults.bend,')
          replace_once(editor,
              'bend: ({ min: -100, max: 100 })',
              'bend: ({ min: -360, max: 360 })')

          width_functions = (
              '    function setDraftVisualizerWidth(percentValue) {\n'
              '        const numeric = Number(percentValue);\n'
              '        if (!Number.isFinite(numeric) || numeric < 25 || numeric > 400) {\n'
              '            statusMessage = "Visualizer width must be 25% to 400%";\n'
              '            return;\n'
              '        }\n'
              '        recordUndoBeforeChange();\n'
              '        const next = cloneVisualizer(draftVisualizer);\n'
              '        next.stretch_x = Math.max(0.25, Math.min(4.00, numeric / 100));\n'
              '        draftVisualizer = next;\n'
              '        selectElement("visualizer", false);\n'
              '        statusMessage = "Visualizer width updated";\n'
              '    }\n\n'
              '    function beginVisualizerWidthResize(sceneX) {\n'
              '        if (editorFocus.width <= 0)\n'
              '            return;\n'
              '        selectElement("visualizer", false);\n'
              '        const point = elementPoint("visualizer");\n'
              '        visualizerWidthCenterX = Number(point.x) * editorFocus.width;\n'
              '        visualizerWidthStartDistance = Math.max(8, Math.abs(Number(sceneX) - visualizerWidthCenterX));\n'
              '        visualizerWidthStartStretch = elementStretchX("visualizer");\n'
              '        visualizerWidthResizeActive = true;\n'
              '        beginHistoryTransaction();\n'
              '    }\n\n'
              '    function updateVisualizerWidthResize(sceneX) {\n'
              '        if (!visualizerWidthResizeActive)\n'
              '            return;\n'
              '        const distance = Math.max(1, Math.abs(Number(sceneX) - visualizerWidthCenterX));\n'
              '        const next = cloneVisualizer(draftVisualizer);\n'
              '        next.stretch_x = Math.max(0.25, Math.min(4.00,\n'
              '            visualizerWidthStartStretch * distance / visualizerWidthStartDistance));\n'
              '        draftVisualizer = next;\n'
              '    }\n\n'
              '    function endVisualizerWidthResize() {\n'
              '        if (!visualizerWidthResizeActive)\n'
              '            return;\n'
              '        visualizerWidthResizeActive = false;\n'
              '        commitHistoryTransaction();\n'
              '        scheduleContrastRefresh();\n'
              '    }\n\n')
          replace_once(editor,
              '    function pointBounds(name) {',
              width_functions + '    function pointBounds(name) {')

          width_handles = (
              '                    Rectangle {\n'
              '                        id: visualizerWidthLeftHandle\n'
              '                        visible: root.selectedElement === parent.elementName\n'
              '                            && parent.elementName === "visualizer"\n'
              '                        width: 14\n'
              '                        height: 24\n'
              '                        radius: 3\n'
              '                        x: -width / 2\n'
              '                        y: parent.height / 2 - height / 2\n'
              '                        color: Theme.focus\n'
              '                        border.width: 1\n'
              '                        border.color: Theme.foreground\n'
              '                        z: 30\n'
              '                        MouseArea {\n'
              '                            anchors.fill: parent\n'
              '                            cursorShape: Qt.SizeHorCursor\n'
              '                            preventStealing: true\n'
              '                            onPressed: mouse => {\n'
              '                                const point = parent.mapToItem(editorFocus, mouse.x, mouse.y);\n'
              '                                root.beginVisualizerWidthResize(point.x);\n'
              '                                mouse.accepted = true;\n'
              '                            }\n'
              '                            onPositionChanged: mouse => {\n'
              '                                if (!pressed) return;\n'
              '                                const point = parent.mapToItem(editorFocus, mouse.x, mouse.y);\n'
              '                                root.updateVisualizerWidthResize(point.x);\n'
              '                            }\n'
              '                            onReleased: root.endVisualizerWidthResize()\n'
              '                            onCanceled: root.endVisualizerWidthResize()\n'
              '                        }\n'
              '                    }\n\n'
              '                    Rectangle {\n'
              '                        id: visualizerWidthRightHandle\n'
              '                        visible: root.selectedElement === parent.elementName\n'
              '                            && parent.elementName === "visualizer"\n'
              '                        width: 14\n'
              '                        height: 24\n'
              '                        radius: 3\n'
              '                        x: parent.width - width / 2\n'
              '                        y: parent.height / 2 - height / 2\n'
              '                        color: Theme.focus\n'
              '                        border.width: 1\n'
              '                        border.color: Theme.foreground\n'
              '                        z: 30\n'
              '                        MouseArea {\n'
              '                            anchors.fill: parent\n'
              '                            cursorShape: Qt.SizeHorCursor\n'
              '                            preventStealing: true\n'
              '                            onPressed: mouse => {\n'
              '                                const point = parent.mapToItem(editorFocus, mouse.x, mouse.y);\n'
              '                                root.beginVisualizerWidthResize(point.x);\n'
              '                                mouse.accepted = true;\n'
              '                            }\n'
              '                            onPositionChanged: mouse => {\n'
              '                                if (!pressed) return;\n'
              '                                const point = parent.mapToItem(editorFocus, mouse.x, mouse.y);\n'
              '                                root.updateVisualizerWidthResize(point.x);\n'
              '                            }\n'
              '                            onReleased: root.endVisualizerWidthResize()\n'
              '                            onCanceled: root.endVisualizerWidthResize()\n'
              '                        }\n'
              '                    }\n\n')
          replace_once(editor,
              '                    Timer {\n                        id: inertiaTimer',
              width_handles + '                    Timer {\n                        id: inertiaTimer')

          replace_once(editor,
              '                        Text { text: "Height"; color: Theme.muted; font.family: Theme.fontFamily; font.pixelSize: 9 }',
              '                        Text { text: "Width"; color: Theme.muted; font.family: Theme.fontFamily; font.pixelSize: 9 }\n'
              '                        TextField {\n'
              '                            Layout.preferredWidth: 58\n'
              '                            text: (Number(root.draftVisualizer.stretch_x || 1) * 100).toFixed(1)\n'
              '                            validator: DoubleValidator { bottom: 25; top: 400; decimals: 1 }\n'
              '                            selectByMouse: true\n'
              '                            font.pixelSize: 9\n'
              '                            onEditingFinished: root.setDraftVisualizerWidth(text)\n'
              '                        }\n\n'
              '                        Text { text: "Height"; color: Theme.muted; font.family: Theme.fontFamily; font.pixelSize: 9 }')

          old_bend_ui = (
              '                        Text { text: "Bend"; visible: root.draftVisualizer.shape === "arc"; color: Theme.muted; font.family: Theme.fontFamily; font.pixelSize: 9 }\n'
              '                        Slider {\n'
              '                            Layout.preferredWidth: 100\n'
              '                            visible: root.draftVisualizer.shape === "arc"\n'
              '                            from: -100; to: 100; stepSize: 1\n'
              '                            value: root.draftVisualizer.bend\n'
              '                            onPressedChanged: { if (pressed) root.beginHistoryTransaction(); else root.commitHistoryTransaction(); }\n'
              '                            onMoved: root.setDraftVisualizerSetting("bend", value)\n'
              '                        }\n'
              '                        Text { text: String(root.draftVisualizer.bend); visible: root.draftVisualizer.shape === "arc"; color: Theme.foreground; font.family: Theme.fontFamily; font.pixelSize: 9; Layout.preferredWidth: 28 }')
          new_bend_ui = (
              '                        Text { text: "Arc Bend"; visible: root.draftVisualizer.shape === "arc"; color: Theme.muted; font.family: Theme.fontFamily; font.pixelSize: 9 }\n'
              '                        TextField {\n'
              '                            Layout.preferredWidth: 58\n'
              '                            visible: root.draftVisualizer.shape === "arc"\n'
              '                            text: String(Math.round(Number(root.draftVisualizer.bend || 0)))\n'
              '                            validator: DoubleValidator { bottom: -360; top: 360; decimals: 0 }\n'
              '                            selectByMouse: true\n'
              '                            font.pixelSize: 9\n'
              '                            onEditingFinished: root.setDraftVisualizerSetting("bend", text)\n'
              '                        }')
          replace_once(editor, old_bend_ui, new_bend_ui)

          transparency = 'tests/test-quickshell-lockscreen-visualizer-transparency.sh'
          replace_once(transparency,
              'bad_bend="${visualizer/\\"bend\\":-55/\\"bend\\":101}"',
              'bad_bend="${visualizer/\\"bend\\":-55/\\"bend\\":361}"')
          replace_once(transparency,
              "fail 'visualizer bend outside -100..100 was accepted'",
              "fail 'visualizer bend outside -360..360 was accepted'")

          Path('config/quickshell/awtarchy/LockPreviewScene.qml').write_text(Path(scene).read_text())
          PY

          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash tests/test-quickshell-lockscreen-visualizer-editing.sh
          bash tests/test-quickshell-lockscreen-visualizer-transparency.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-rotation-reset.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          git diff --check

      - name: Refresh managed stock hashes
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          printf '\n# 2026-09-12 direct visualizer width and wide signed arc bend editing.\n' >> "$history"
          while IFS='|' read -r source installed; do
            digest="$(sha256sum "$source" | awk '{print $1}')"
            entry="${digest}"$'\t'"${installed}"
            if ! grep -Fqx -- "$entry" "$history"; then
              printf '%s\n' "$entry" >> "$history"
            fi
          done <<'EOF'
          config/hypr/scripts/quickshell_application_state.sh|.config/hypr/scripts/quickshell_application_state.sh
          config/quickshell/awtarchy/BarState.qml|.config/quickshell/awtarchy/BarState.qml
          config/quickshell/awtarchy/LockscreenEditor.qml|.config/quickshell/awtarchy/LockscreenEditor.qml
          config/quickshell/awtarchy/LockPreviewScene.qml|.config/quickshell/awtarchy/LockPreviewScene.qml
          config/quickshell/awtarchy-lock/shell.qml|.config/quickshell/awtarchy-lock/shell.qml
          config/quickshell/awtarchy-lock/LockScene.qml|.config/quickshell/awtarchy-lock/LockScene.qml
          EOF
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            config/hypr/scripts/quickshell_application_state.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy-lock/shell.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            tests/test-quickshell-lockscreen-visualizer-transparency.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m "Improve lockscreen visualizer editing"
          git push origin HEAD:feature/lockscreen-interactive-effects
