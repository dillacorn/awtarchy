name: Validate Quickshell Lockscreen Interactive Effects

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Apply parser fix and managed hash
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("config/quickshell/awtarchy/LockscreenEditor.qml")
          text = path.read_text(encoding="utf-8")
          needle = "}; selectByMouse: true;"
          count = text.count(needle)
          if count != 9:
              raise SystemExit(f"expected 9 invalid inline validator terminators, found {count}")
          text = text.replace(needle, "}\n                        selectByMouse: true;")
          path.write_text(text, encoding="utf-8")
          PY

          hash="$(sha256sum config/quickshell/awtarchy/LockscreenEditor.qml | awk '{print $1}')"
          entry="${hash}"$'\t'".config/quickshell/awtarchy/LockscreenEditor.qml"
          if ! grep -Fqx -- "$entry" local/share/awtarchy/quickshell-managed-history.sha256; then
            printf '%s\n' "$entry" >> local/share/awtarchy/quickshell-managed-history.sha256
          fi

          git diff --check
          bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/quickshell/awtarchy/LockscreenEditor.qml local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --check
          git commit -m "fix: make lockscreen numeric validators valid QML"
          git push origin HEAD:feature/lockscreen-interactive-effects
