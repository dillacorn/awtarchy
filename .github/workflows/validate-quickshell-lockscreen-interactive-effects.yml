name: Validate Quickshell Lockscreen Interactive Effects

on:
  pull_request:

permissions:
  contents: read

jobs:
  align-transparency-privacy-contract:
    if: github.event.pull_request.number == 181 && github.event.pull_request.head.ref == 'feature/lockscreen-interactive-effects'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
      - name: Align and validate privacy warning contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test-quickshell-lockscreen-visualizer-transparency.sh')
          text = path.read_text()
          old = "require_text \"$EDITOR\" 'Transparency can reveal content' \\\n    'editor has no transparency privacy warning'\n"
          new = "require_text \"$EDITOR\" 'Transparency uses the secure frozen pre-lock capture; live unlocked compositor content is never exposed.' \\\n    'editor has no secure frozen-capture transparency privacy warning'\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale privacy warning assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          bash -n tests/test-quickshell-lockscreen-visualizer-transparency.sh
          shellcheck tests/test-quickshell-lockscreen-visualizer-transparency.sh
          bash tests/test-quickshell-lockscreen-visualizer-transparency.sh
          bash tests/test-quickshell-lockscreen-visualizer-editing.sh
          bash tests/test-quickshell-lockscreen-fifth-runtime-pass.sh
          git diff --check
      - name: Commit test contract correction
        run: |
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add tests/test-quickshell-lockscreen-visualizer-transparency.sh
          git diff --cached --check
          git commit -m 'test: assert secure transparency warning'
          git push origin HEAD:feature/lockscreen-interactive-effects
