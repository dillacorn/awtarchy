name: Validate Quickshell Lockscreen Interactive Effects

on:
  pull_request:

permissions:
  contents: read

jobs:
  fix-custom-image-spawn-validator:
    if: github.event.pull_request.number == 181 && github.event.pull_request.head.ref == 'feature/lockscreen-interactive-effects'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
      - name: Fix and validate custom image spawn persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('config/hypr/scripts/quickshell_application_state.sh')
          text = path.read_text()
          old = '                and ($spawns | index(.spawn_animation // "none") != null)\n'
          new = '                and ((.spawn_animation // "none") as $spawn | ($spawns | index($spawn) != null))\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one spawn validator expression, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          bash -n config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-fifth-runtime-pass.sh
          git diff --check
      - name: Commit production fix
        run: |
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add config/hypr/scripts/quickshell_application_state.sh
          git diff --cached --check
          git commit -m 'fix: validate custom image spawn modes correctly'
          git push origin HEAD:feature/lockscreen-interactive-effects
