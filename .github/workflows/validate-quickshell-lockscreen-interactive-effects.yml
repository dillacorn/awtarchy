name: Validate Quickshell Lockscreen Interactive Effects

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Apply save arity fix and restore workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("config/hypr/scripts/quickshell_application_state.sh")
          text = path.read_text(encoding="utf-8")
          old = "6|12|13|14|16|17|18) ;;"
          new = "6|12|13|14|16|17|18|19) ;;"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one stale save-lockscreen-editor arity guard, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          hash="$(sha256sum config/hypr/scripts/quickshell_application_state.sh | awk '{print $1}')"
          entry="${hash}"$'\t'".config/hypr/scripts/quickshell_application_state.sh"
          if ! grep -Fqx -- "$entry" local/share/awtarchy/quickshell-managed-history.sha256; then
            printf '%s\n' "$entry" >> local/share/awtarchy/quickshell-managed-history.sha256
          fi

          bash -n config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

          git show HEAD^:.github/workflows/validate-quickshell-lockscreen-interactive-effects.yml > .github/workflows/validate-quickshell-lockscreen-interactive-effects.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/hypr/scripts/quickshell_application_state.sh local/share/awtarchy/quickshell-managed-history.sha256 .github/workflows/validate-quickshell-lockscreen-interactive-effects.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "fix: accept current lockscreen editor save payload"
          git push origin HEAD:feature/lockscreen-interactive-effects
