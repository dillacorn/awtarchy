name: Validate Quickshell Lockscreen Interactive Effects

on:
  pull_request:

permissions:
  contents: read

jobs:
  apply-fifth-runtime-production:
    if: github.event.pull_request.number == 181 && github.event.pull_request.head.ref == 'feature/lockscreen-interactive-effects'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 3
      - name: Reuse and harden the reviewed production transform
        run: |
          git show HEAD^^:.github/workflows/validate-quickshell-lockscreen-interactive-effects.yml > /tmp/full-lockscreen-writer.yml
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('/tmp/full-lockscreen-writer.yml').read_text()
          lines = workflow.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n'

          pattern = re.compile(
              r"text = one\(text,\n"
              r"'''\s+property real formationProgress:\n"
              r"\s+root\.animationPreference === \"off\" \? 1 : 0\n"
              r"\s*''',\n"
              r"'''\s+property real formationProgress:\n"
              r"\s+root\.animationPreference === \"off\"\n"
              r"\s+\|\| \(root\.previewMode && root\.presentationReplayToken === 0\) \? 1 : 0\n"
              r"\s*''', 'quiet editor logo formation'\)"
          )
          replacement = '''text = one_re(text,
              r'(^\\s+property real formationProgress:\\n)(\\s+)root\\.animationPreference === "off" \\? 1 : 0\\n',
              r'\\1\\2root.animationPreference === "off"\\n\\2    || (root.previewMode && root.presentationReplayToken === 0) ? 1 : 0\\n',
              'quiet editor logo formation')'''
          source, count = pattern.subn(lambda _: replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'writer hardening: expected one logo-formation matcher, found {count}')

          Path('/tmp/apply-fifth-runtime.py').write_text(source)
          PY
          python3 /tmp/apply-fifth-runtime.py
          bash -n config/hypr/scripts/awtarchy_lock.sh
          bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-fifth-runtime-pass.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          cmp -s config/quickshell/awtarchy-lock/LockTransitionLayer.qml config/quickshell/awtarchy/LockPreviewTransitionLayer.qml
          git diff --check
      - name: Commit production changes
        run: |
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/QuickSettings.qml
          git diff --cached --check
          git commit -m 'feat: complete lockscreen fifth runtime pass'
          git push origin HEAD:feature/lockscreen-interactive-effects
