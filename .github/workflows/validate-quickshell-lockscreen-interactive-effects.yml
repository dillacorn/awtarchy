name: Temporary Apply Approved Lockscreen Optimizations

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 181 && github.head_ref == 'feature/lockscreen-interactive-effects'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Apply narrowly scoped production changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          scene_path = "config/quickshell/awtarchy-lock/LockScene.qml"
          replace_once(
              scene_path,
              '    readonly property real securePasswordEntryOpacity: root.unlocking\n        ? 0 : root.entered ? 1 : 0\n',
              '    readonly property real securePasswordEntryOpacity: root.unlocking\n        ? 0 : root.entered && !root.effectiveEntryTransitionRunning ? 1 : 0\n'
          )
          replace_once(
              scene_path,
              '    function logoHoverTarget(row, column) {\n        if (!logoHoverActive)\n            return ({ x: 0, y: 0 });\n        const local = wordmarkItem.mapFromItem(root, lastPointerX, lastPointerY);\n',
              '    function logoHoverTarget(row, column, localPointer) {\n        if (!logoHoverActive)\n            return ({ x: 0, y: 0 });\n        const local = localPointer;\n'
          )
          replace_once(
              scene_path,
              '        const next = ({});\n        let maxMotion = 0;\n        for (let row = 0; row < wordmarkRows.length; ++row) {\n',
              '        const next = ({});\n        let maxMotion = 0;\n        const hoverLocal = logoHoverActive\n            ? wordmarkItem.mapFromItem(root, lastPointerX, lastPointerY)\n            : Qt.point(0, 0);\n        for (let row = 0; row < wordmarkRows.length; ++row) {\n'
          )
          replace_once(
              scene_path,
              '                const hoverTarget = logoHoverTarget(row, column);\n',
              '                const hoverTarget = logoHoverTarget(row, column, hoverLocal);\n'
          )
          Path("config/quickshell/awtarchy/LockPreviewScene.qml").write_text(Path(scene_path).read_text())

          surface_path = "config/quickshell/awtarchy-lock/LockSurface.qml"
          replace_once(
              surface_path,
              '    function focusPasswordWhenReady() {\n        Qt.callLater(() => password.forceActiveFocus());\n    }\n',
              '    function focusPasswordWhenReady() {\n        if (!root.transitionComplete || root.unlocking)\n            return;\n        Qt.callLater(() => {\n            if (root.transitionComplete && !root.unlocking)\n                password.forceActiveFocus();\n        });\n    }\n'
          )

          analyzer_path = "config/quickshell/awtarchy-lock/LockAudioAnalyzer.qml"
          analyzer = Path(analyzer_path).read_text()
          old = '''    function normalizedSpectrum(values) {\n        const result = [];\n        for (let i = 0; i < maximumBands; ++i) {\n            const value = i < values.length ? values[i] : 0;\n            result.push(threshold(value));\n        }\n        return result;\n    }\n\n    function parseFrame(data) {\n        const fields = String(data || "").trim().split(";");\n        const values = [];\n        for (let i = 0; i < fields.length && values.length < maximumBands; ++i) {\n            if (fields[i].length === 0)\n                continue;\n            values.push(clampUnit(Number(fields[i]) / 1000));\n        }\n        if (values.length === 0)\n            return;\n        bands = normalizedSpectrum(values);\n    }\n'''
          new = '''    function parseFrame(data) {\n        const fields = String(data || "").trim().split(";");\n        const result = [];\n        for (let i = 0; i < fields.length && result.length < maximumBands; ++i) {\n            if (fields[i].length === 0)\n                continue;\n            result.push(threshold(Number(fields[i]) / 1000));\n        }\n        if (result.length === 0)\n            return;\n        while (result.length < maximumBands)\n            result.push(0);\n        bands = result;\n    }\n'''
          if analyzer.count(old) != 1:
              raise SystemExit("LockAudioAnalyzer.qml: parser block mismatch")
          analyzer = analyzer.replace(old, new, 1)
          Path(analyzer_path).write_text(analyzer)
          Path("config/quickshell/awtarchy/LockPreviewAudioAnalyzer.qml").write_text(analyzer)

          acceptance = "tests/test-quickshell-lockscreen-runtime-acceptance-187.sh"
          replace_once(
              acceptance,
              "has \"$SCENE\" 'function logoHoverTarget(row, column)' 'coherent logo hover field is missing'\n",
              "has \"$SCENE\" 'function logoHoverTarget(row, column, localPointer)' 'coherent logo hover field is missing'\n"
          )
          replace_once(
              acceptance,
              "has \"$ANALYZER\" 'bands = normalizedSpectrum(values);' 'analyzer does not publish parsed frames directly'\n",
              "has \"$ANALYZER\" 'bands = result;' 'analyzer does not publish parsed frames directly'\n"
          )
          PY

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          tmp_entries="$(mktemp)"
          for pair in \
            'config/quickshell/awtarchy-lock/LockScene.qml|.config/quickshell/awtarchy-lock/LockScene.qml' \
            'config/quickshell/awtarchy/LockPreviewScene.qml|.config/quickshell/awtarchy/LockPreviewScene.qml' \
            'config/quickshell/awtarchy-lock/LockSurface.qml|.config/quickshell/awtarchy-lock/LockSurface.qml' \
            'config/quickshell/awtarchy-lock/LockAudioAnalyzer.qml|.config/quickshell/awtarchy-lock/LockAudioAnalyzer.qml' \
            'config/quickshell/awtarchy/LockPreviewAudioAnalyzer.qml|.config/quickshell/awtarchy/LockPreviewAudioAnalyzer.qml'; do
            src="${pair%%|*}"
            dst="${pair#*|}"
            hash="$(sha256sum "$src" | awk '{print $1}')"
            printf '%s\t%s\n' "$hash" "$dst" >>"$tmp_entries"
          done
          if while IFS= read -r line; do grep -Fqx -- "$line" "$history" || exit 1; done <"$tmp_entries"; then
            :
          else
            {
              printf '\n# 2026-09-13 pre-runtime optimization pass stock hashes.\n'
              cat "$tmp_entries"
            } >>"$history"
          fi
          rm -f -- "$tmp_entries"

      - name: Verify GREEN before commit
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/test-quickshell-lockscreen-pretest-optimizations.sh
          bash -n tests/test-quickshell-lockscreen-interaction-polish.sh
          bash -n tests/test-quickshell-lockscreen-runtime-acceptance-187.sh
          shellcheck tests/test-quickshell-lockscreen-pretest-optimizations.sh
          shellcheck tests/test-quickshell-lockscreen-interaction-polish.sh
          shellcheck tests/test-quickshell-lockscreen-runtime-acceptance-187.sh
          bash tests/test-quickshell-lockscreen-pretest-optimizations.sh
          bash tests/test-quickshell-lockscreen-interaction-polish.sh
          bash tests/test-quickshell-lockscreen-runtime-acceptance-187.sh
          bash tests/test-quickshell-lockscreen-fifth-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          cmp -s config/quickshell/awtarchy-lock/LockAudioAnalyzer.qml config/quickshell/awtarchy/LockPreviewAudioAnalyzer.qml
          git diff --check

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy-lock/LockSurface.qml \
            config/quickshell/awtarchy-lock/LockAudioAnalyzer.qml \
            config/quickshell/awtarchy/LockPreviewAudioAnalyzer.qml \
            tests/test-quickshell-lockscreen-runtime-acceptance-187.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --quiet && { printf '%s\n' 'no production changes to commit'; return 0; }
          git commit -m 'perf: tighten lockscreen runtime paths'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
