name: Validate Quickshell Lockscreen Interactive Effects

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Diff whitespace validation
        run: |
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff --check HEAD^
          fi
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Syntax validation
        run: |
          bash -n tests/test-quickshell-lockscreen-interactive-effects.sh
          bash -n tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash -n tests/test-quickshell-lockscreen-logo-cohesion.sh
          bash -n tests/test-quickshell-lockscreen-runtime-polish.sh
          bash -n tests/test-quickshell-lockscreen-runtime-polish-ui.sh
          bash -n tests/test-quickshell-lockscreen-runtime-acceptance-187.sh
          bash -n tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash -n tests/test-quickshell-lockscreen-fifth-runtime-pass.sh
          bash -n tests/test-quickshell-lockscreen-picker-targeting.sh
          bash -n tests/test-quickshell-lockscreen-capture.sh
          bash -n tests/test-quickshell-lockscreen-transition-layer.sh
          bash -n tests/test-quickshell-lockscreen-blur-iris-editor-controls.sh
          bash -n tests/test-quickshell-lockscreen-composition-blur-rendering.sh
          bash -n tests/test-quickshell-lockscreen-editor-preview-runtime.sh
          bash -n tests/test-quickshell-lockscreen-interactive-managed-history.sh
          bash -n tests/test-quickshell-lockscreen-editor.sh
          bash -n tests/test-quickshell-lockscreen-editor-config-boundary.sh
          bash -n tests/test-quickshell-lockscreen-live-editor.sh
          bash -n tests/test-quickshell-lockscreen-editor-flick.sh
          bash -n tests/test-quickshell-lockscreen-editor-tooling.sh
          bash -n tests/test-quickshell-lockscreen-editor-presets.sh
          bash -n tests/test-quickshell-lockscreen-element-system.sh
          bash -n tests/test-quickshell-lockscreen-rotation-reset.sh
          bash -n tests/test-quickshell-lockscreen-visualizer-transparency.sh
          bash -n tests/test-quickshell-lockscreen-visualizer-editing.sh
          bash -n tests/test-quickshell-lockscreen-entry-transitions.sh
          bash -n tests/test-quickshell-lockscreen-background-composition.sh
          bash -n tests/test-quickshell-lockscreen-background-save-dispatch.sh
          bash -n tests/test-quickshell-lockscreen-weather.sh
          bash -n tests/test-quickshell-lockscreen-weather-units.sh
          bash -n tests/test-quickshell-lockscreen-runtime-services.sh
          bash -n tests/test-quickshell-lockscreen-interaction-polish.sh
          if [[ -f config/hypr/scripts/quickshell_lockscreen_audio.sh ]]; then bash -n config/hypr/scripts/quickshell_lockscreen_audio.sh; fi
          if [[ -f config/hypr/scripts/quickshell_lockscreen_weather.sh ]]; then bash -n config/hypr/scripts/quickshell_lockscreen_weather.sh; fi
          if [[ -f config/hypr/scripts/quickshell_lockscreen_contrast.sh ]]; then bash -n config/hypr/scripts/quickshell_lockscreen_contrast.sh; fi
          if [[ -f config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh ]]; then bash -n config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh; fi
          if [[ -f config/hypr/scripts/quickshell_lockscreen_capture.sh ]]; then bash -n config/hypr/scripts/quickshell_lockscreen_capture.sh; fi
          if [[ -f config/hypr/scripts/quickshell_lockscreen_preview_capture.sh ]]; then bash -n config/hypr/scripts/quickshell_lockscreen_preview_capture.sh; fi
      - name: ShellCheck
        run: |
          shellcheck tests/test-quickshell-lockscreen-interactive-effects.sh
          shellcheck tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          shellcheck tests/test-quickshell-lockscreen-logo-cohesion.sh
          shellcheck tests/test-quickshell-lockscreen-runtime-polish.sh
          shellcheck tests/test-quickshell-lockscreen-runtime-polish-ui.sh
          shellcheck tests/test-quickshell-lockscreen-runtime-acceptance-187.sh
          shellcheck tests/test-quickshell-lockscreen-third-runtime-pass.sh
          shellcheck tests/test-quickshell-lockscreen-fifth-runtime-pass.sh
          shellcheck tests/test-quickshell-lockscreen-picker-targeting.sh
          shellcheck tests/test-quickshell-lockscreen-capture.sh
          shellcheck tests/test-quickshell-lockscreen-transition-layer.sh
          shellcheck tests/test-quickshell-lockscreen-blur-iris-editor-controls.sh
          shellcheck tests/test-quickshell-lockscreen-composition-blur-rendering.sh
          shellcheck tests/test-quickshell-lockscreen-editor-preview-runtime.sh
          shellcheck tests/test-quickshell-lockscreen-interactive-managed-history.sh
          shellcheck tests/test-quickshell-lockscreen-editor.sh
          shellcheck tests/test-quickshell-lockscreen-editor-config-boundary.sh
          shellcheck tests/test-quickshell-lockscreen-live-editor.sh
          shellcheck tests/test-quickshell-lockscreen-editor-flick.sh
          shellcheck tests/test-quickshell-lockscreen-editor-tooling.sh
          shellcheck tests/test-quickshell-lockscreen-editor-presets.sh
          shellcheck tests/test-quickshell-lockscreen-element-system.sh
          shellcheck tests/test-quickshell-lockscreen-rotation-reset.sh
          shellcheck tests/test-quickshell-lockscreen-visualizer-transparency.sh
          shellcheck tests/test-quickshell-lockscreen-visualizer-editing.sh
          shellcheck tests/test-quickshell-lockscreen-entry-transitions.sh
          shellcheck tests/test-quickshell-lockscreen-background-composition.sh
          shellcheck tests/test-quickshell-lockscreen-background-save-dispatch.sh
          shellcheck tests/test-quickshell-lockscreen-weather.sh
          shellcheck tests/test-quickshell-lockscreen-weather-units.sh
          shellcheck tests/test-quickshell-lockscreen-runtime-services.sh
          shellcheck tests/test-quickshell-lockscreen-interaction-polish.sh
          if [[ -f config/hypr/scripts/quickshell_lockscreen_audio.sh ]]; then shellcheck config/hypr/scripts/quickshell_lockscreen_audio.sh; fi
          if [[ -f config/hypr/scripts/quickshell_lockscreen_weather.sh ]]; then shellcheck config/hypr/scripts/quickshell_lockscreen_weather.sh; fi
          if [[ -f config/hypr/scripts/quickshell_lockscreen_contrast.sh ]]; then shellcheck config/hypr/scripts/quickshell_lockscreen_contrast.sh; fi
          if [[ -f config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh ]]; then shellcheck config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh; fi
          if [[ -f config/hypr/scripts/quickshell_lockscreen_capture.sh ]]; then shellcheck config/hypr/scripts/quickshell_lockscreen_capture.sh; fi
          if [[ -f config/hypr/scripts/quickshell_lockscreen_preview_capture.sh ]]; then shellcheck config/hypr/scripts/quickshell_lockscreen_preview_capture.sh; fi
      - name: Runtime helper mode
        run: |
          test -x config/hypr/scripts/quickshell_lockscreen_audio.sh
          test -x config/hypr/scripts/quickshell_lockscreen_weather.sh
          test -x config/hypr/scripts/quickshell_lockscreen_contrast.sh
          if [[ -f config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh ]]; then test -x config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh; fi
      - name: Logo cohesion contracts
        run: bash tests/test-quickshell-lockscreen-logo-cohesion.sh
      - name: Runtime polish contracts
        run: |
          bash tests/test-quickshell-lockscreen-runtime-polish.sh
          bash tests/test-quickshell-lockscreen-runtime-polish-ui.sh
          bash tests/test-quickshell-lockscreen-runtime-acceptance-187.sh
          bash tests/test-quickshell-lockscreen-picker-targeting.sh
      - name: Third and fifth Hyprland runtime pass contracts
        run: |
          bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-fifth-runtime-pass.sh
      - name: Secure transition capture contract
        run: bash tests/test-quickshell-lockscreen-capture.sh
      - name: Desktop transition layer contract
        run: bash tests/test-quickshell-lockscreen-transition-layer.sh
      - name: Background composition contracts
        run: |
          bash tests/test-quickshell-lockscreen-background-composition.sh
          bash tests/test-quickshell-lockscreen-background-save-dispatch.sh
          bash tests/test-quickshell-lockscreen-blur-iris-editor-controls.sh
          bash tests/test-quickshell-lockscreen-composition-blur-rendering.sh
          bash tests/test-quickshell-lockscreen-editor-preview-runtime.sh
      - name: Weather refresh contracts
        run: |
          bash tests/test-quickshell-lockscreen-weather.sh
          bash tests/test-quickshell-lockscreen-weather-units.sh
      - name: Runtime service contracts
        run: bash tests/test-quickshell-lockscreen-runtime-services.sh
      - name: Interactive effects contracts
        run: |
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash tests/test-quickshell-lockscreen-interaction-polish.sh
      - name: Entry transition contracts
        run: bash tests/test-quickshell-lockscreen-entry-transitions.sh
      - name: Customization editor contracts
        run: |
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-editor-config-boundary.sh
          bash tests/test-quickshell-lockscreen-live-editor.sh
          bash tests/test-quickshell-lockscreen-editor-flick.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-editor-presets.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-rotation-reset.sh
          bash tests/test-quickshell-lockscreen-visualizer-transparency.sh
          bash tests/test-quickshell-lockscreen-visualizer-editing.sh
      - name: Managed history contracts
        run: bash tests/test-quickshell-lockscreen-interactive-managed-history.sh

  apply-fifth-runtime-production:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 181 && github.event.pull_request.head.ref == 'feature/lockscreen-interactive-effects'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 2
      - name: Apply remaining fifth runtime production changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          scene_path = Path('config/quickshell/awtarchy-lock/LockScene.qml')
          text = scene_path.read_text()

          text = replace_once(text,
          '''    property bool externallyManagedEntryTransition: false
              property bool externalEntryTransitionRunning: false
              readonly property bool effectiveEntryTransitionRunning:
                  externallyManagedEntryTransition ? externalEntryTransitionRunning : entryTransitionRunning
          ''',
          '''    property bool externallyManagedEntryTransition: false
              property bool externalEntryTransitionRunning: false
              property real externalEntryTransitionProgress: 1
              property int presentationReplayToken: 0
              property int customImageSpawnEpoch: 0
              readonly property bool effectiveEntryTransitionRunning:
                  externallyManagedEntryTransition ? externalEntryTransitionRunning : entryTransitionRunning
              readonly property real effectiveEntryTransitionProgress:
                  externallyManagedEntryTransition ? externalEntryTransitionProgress : entryTransitionProgress
          
              onEffectiveEntryTransitionRunningChanged: {
                  if (!effectiveEntryTransitionRunning && entered
                          && (!previewMode || presentationReplayToken > 0))
                      customImageSpawnEpoch++;
              }
          ''', 'scene transition presentation state')

          text = replace_once(text,
              '    readonly property bool logoSimulationActive: logoExplosionActive || logoHoverDirty\n',
              '    readonly property bool logoSimulationActive: logoExplosionActive || logoHoverDirty || logoReturnPending\n',
              'logo simulation ownership')
          text = replace_once(text,
              '    property bool logoHoverDirty: false\n',
              '    property bool logoHoverDirty: false\n    property bool logoReturnPending: false\n',
              'logo return state')
          text = replace_once(text,
              '    onLogoHoverActiveChanged: logoHoverDirty = true\n',
          '''    onLogoHoverActiveChanged: {
                  logoHoverDirty = true;
                  if (logoHoverActive)
                      logoReturnPending = false;
                  else if (!logoExplosionActive)
                      logoReturnPending = true;
              }
          ''', 'logo hover state change')
          text = replace_once(text,
              '        return ["fade", "pixel", "iris", "edges", "wipe"].indexOf(key) >= 0\n',
              '        return ["fade", "pixel", "edges", "wipe"].indexOf(key) >= 0\n',
              'scene Iris mode removal')

          image_lookup = '''    function customImageForName(name) {
                  if (!Array.isArray(root.customImages))
                      return null;
                  const key = String(name || "");
                  for (let i = 0; i < root.customImages.length; ++i) {
                      const image = root.customImages[i];
                      if (image && typeof image === "object" && String(image.id || "") === key)
                          return image;
                  }
                  return null;
              }
          '''
          image_lookup_new = image_lookup + '''
              function customImageSpawnMode(image) {
                  const value = String(image && image.spawn_animation !== undefined
                      ? image.spawn_animation : "none");
                  return ["none", "pixel-warp", "closest-edge", "top", "bottom", "left", "right"].indexOf(value) >= 0
                      ? value : "none";
              }
          
              function customImageSpawnOffset(image, itemWidth, itemHeight) {
                  let mode = customImageSpawnMode(image);
                  if (mode === "none" || mode === "pixel-warp")
                      return Qt.point(0, 0);
                  const x = Math.max(0, Math.min(1, Number(image && image.x !== undefined ? image.x : 0.5)));
                  const y = Math.max(0, Math.min(1, Number(image && image.y !== undefined ? image.y : 0.5)));
                  if (mode === "closest-edge") {
                      let distance = x;
                      mode = "left";
                      if (1 - x < distance) { distance = 1 - x; mode = "right"; }
                      if (y < distance) { distance = y; mode = "top"; }
                      if (1 - y < distance) { mode = "bottom"; }
                  }
                  const centerX = x * root.width;
                  const centerY = y * root.height;
                  const margin = Math.max(24, 32 * root.uiScale);
                  if (mode === "left")
                      return Qt.point(-(centerX + itemWidth / 2 + margin), 0);
                  if (mode === "right")
                      return Qt.point(root.width - centerX + itemWidth / 2 + margin, 0);
                  if (mode === "top")
                      return Qt.point(0, -(centerY + itemHeight / 2 + margin));
                  return Qt.point(0, root.height - centerY + itemHeight / 2 + margin);
              }
          '''
          text = replace_once(text, image_lookup, image_lookup_new, 'custom image spawn helpers')

          motion_old = '''        lastPointerX = x;
                  lastPointerY = y;
                  lastPointerSampleTime = now;
                  logoHoverDirty = wasLogoHovering || logoContainsPoint(x, y);
              }
          '''
          motion_new = '''        lastPointerX = x;
                  lastPointerY = y;
                  lastPointerSampleTime = now;
                  const isLogoHovering = logoContainsPoint(x, y);
                  logoHoverDirty = wasLogoHovering || isLogoHovering;
                  if (isLogoHovering && !logoExplosionActive)
                      logoReturnPending = false;
                  else if (wasLogoHovering && !logoExplosionActive)
                      logoReturnPending = true;
              }
          
              function handlePointerExit() {
                  if (!mouseInteractive)
                      return;
                  pointerActive = false;
                  lastPointerSampleTime = 0;
                  if (!logoExplosionActive) {
                      logoReturnPending = true;
                      logoHoverDirty = true;
                  }
              }
          '''
          text = replace_once(text, motion_old, motion_new, 'pointer exit return path')

          settle_old = '''        if (returning && maxMotion < 1.2) {
                  logoHoverDirty = false;
                  if (!logoHoverActive)
                      logoParticles = ({});
              }
          '''
          settle_new = '''        if (returning && maxMotion < 1.2) {
                  logoHoverDirty = false;
                  if (!logoHoverActive && !logoExplosionActive) {
                      logoReturnPending = false;
                      logoParticles = ({});
                  }
              }
          '''
          text = replace_once(text, settle_old, settle_new, 'logo return convergence')

          text = replace_once(text,
          '''            model: entryTransitionCover.visible
                          && (root.entryTransitionMode() === "pixel"
                              || root.entryTransitionMode() === "iris")
                          ? root.entryTileColumns * root.entryTileRows : 0
          ''',
          '''            model: entryTransitionCover.visible
                          && root.entryTransitionMode() === "pixel"
                          ? root.entryTileColumns * root.entryTileRows : 0
          ''', 'scene Iris tile model')

          iris_geometry = '''                readonly property real centerX: (tileColumn + 0.5) / root.entryTileColumns
                          readonly property real centerY: (tileRow + 0.5) / root.entryTileRows
                          readonly property real distanceFromCenter: Math.min(1,
                              Math.sqrt(Math.pow((centerX - 0.5) * 2, 2)
                                  + Math.pow((centerY - 0.5) * 2, 2)) / Math.sqrt(2))
          '''
          text = replace_once(text, iris_geometry, '', 'scene Iris geometry')
          text = replace_once(text,
          '''                readonly property real irisThreshold: 0.10
                          + (1 - distanceFromCenter) * 0.82
          
          ''', '', 'scene Iris threshold')
          text = replace_once(text,
          '''                visible: root.entryTransitionMode() === "pixel"
                          ? root.entryTransitionProgress < pixelThreshold
                          : root.entryTransitionProgress < irisThreshold
          ''',
          '''                visible: root.entryTransitionProgress < pixelThreshold
          ''', 'scene Iris visibility')

          image_block = '''            Image {
                          required property var modelData
                          readonly property string elementName: String(modelData.id || "")
          
                          visible: modelData.visible !== false || root.editorMode
                          source: String(modelData.path || "").startsWith("/")
                              ? "file://" + String(modelData.path) : ""
                          asynchronous: true
                          cache: true
                          fillMode: Image.PreserveAspectFit
                          width: Math.round(180 * root.uiScale)
                          height: Math.round(180 * root.uiScale)
                          x: root.normalizedX(elementName, 0.50) * parent.width - width / 2
                          y: root.normalizedY(elementName, 0.50) * parent.height - height / 2
                          scale: root.elementScale(elementName)
                          rotation: root.elementRotation(elementName)
                          transformOrigin: Item.Center
                          transform: Scale {
                              origin.x: width / 2
                              origin.y: height / 2
                              xScale: root.elementStretchX(elementName)
                              yScale: root.elementStretchY(elementName)
                          }
                          opacity: root.elementOpacity(elementName)
                              * (modelData.visible !== false ? 1.0 : root.editorMode ? 0.30 : 0.0)
                          z: 4
                      }
          '''
          image_block_new = '''            Item {
                          id: customImageDelegate
                          required property var modelData
                          readonly property string elementName: String(modelData.id || "")
                          readonly property string spawnMode: root.customImageSpawnMode(modelData)
                          readonly property real finalX: root.normalizedX(elementName, 0.50) * parent.width - width / 2
                          readonly property real finalY: root.normalizedY(elementName, 0.50) * parent.height - height / 2
                          readonly property point spawnOffset: root.customImageSpawnOffset(modelData, width, height)
                          property real spawnProgress: 1
          
                          visible: modelData.visible !== false || root.editorMode
                          width: Math.round(180 * root.uiScale)
                          height: Math.round(180 * root.uiScale)
                          x: finalX + spawnOffset.x * (1 - spawnProgress)
                          y: finalY + spawnOffset.y * (1 - spawnProgress)
                          scale: root.elementScale(elementName)
                              * (spawnMode === "pixel-warp" ? 0.82 + 0.18 * spawnProgress : 1)
                          rotation: root.elementRotation(elementName)
                          transformOrigin: Item.Center
                          transform: Scale {
                              origin.x: width / 2
                              origin.y: height / 2
                              xScale: root.elementStretchX(elementName)
                              yScale: root.elementStretchY(elementName)
                          }
                          opacity: root.elementOpacity(elementName)
                              * (modelData.visible !== false ? 1.0 : root.editorMode ? 0.30 : 0.0)
                              * (spawnMode === "pixel-warp" ? spawnProgress : 1)
                          z: 4
          
                          function restartSpawnAnimation() {
                              spawnAnimation.stop();
                              if (spawnMode === "none") {
                                  spawnProgress = 1;
                                  return;
                              }
                              spawnProgress = 0;
                              spawnAnimation.restart();
                          }
          
                          Image {
                              id: customImageSource
                              anchors.fill: parent
                              source: String(customImageDelegate.modelData.path || "").startsWith("/")
                                  ? "file://" + String(customImageDelegate.modelData.path) : ""
                              asynchronous: true
                              cache: true
                              fillMode: Image.PreserveAspectFit
                              smooth: customImageDelegate.spawnMode !== "pixel-warp"
                                  || customImageDelegate.spawnProgress >= 0.999
                          }
          
                          ShaderEffectSource {
                              id: pixelWarpSource
                              anchors.fill: parent
                              sourceItem: customImageSource
                              hideSource: visible
                              live: true
                              recursive: false
                              smooth: false
                              readonly property real pixelFactor: 1 + 31 * Math.pow(
                                  Math.max(0, 1 - customImageDelegate.spawnProgress), 1.25)
                              textureSize: Qt.size(
                                  Math.max(1, Math.round(width / pixelFactor)),
                                  Math.max(1, Math.round(height / pixelFactor)))
                              visible: customImageDelegate.spawnMode === "pixel-warp"
                                  && customImageDelegate.spawnProgress < 0.999
                          }
          
                          NumberAnimation {
                              id: spawnAnimation
                              target: customImageDelegate
                              property: "spawnProgress"
                              from: 0
                              to: 1
                              duration: customImageDelegate.spawnMode === "pixel-warp" ? 620 : 520
                              easing.type: Easing.OutCubic
                          }
          
                          Connections {
                              target: root
                              function onCustomImageSpawnEpochChanged() {
                                  customImageDelegate.restartSpawnAnimation();
                              }
                          }
                      }
          '''
          text = replace_once(text, image_block, image_block_new, 'custom image spawn renderer')

          text = replace_once(text,
          '''                            property real formationProgress:
                                      root.animationPreference === "off" ? 1 : 0
          ''',
          '''                            property real formationProgress:
                                      root.animationPreference === "off"
                                      || (root.previewMode && root.presentationReplayToken === 0) ? 1 : 0
          ''', 'quiet editor logo formation')

          if '"iris"' in text or 'irisThreshold' in text or 'distanceFromCenter' in text:
              raise SystemExit('Iris-specific scene logic remains after patch')
          scene_path.write_text(text)
          Path('config/quickshell/awtarchy/LockPreviewScene.qml').write_text(text)

          editor_path = Path('config/quickshell/awtarchy/LockscreenEditor.qml')
          editor = editor_path.read_text()
          old_transition = 'duration: root.draftEntryTransitionDuration; replayToken: root.entryTransitionReplayToken }'
          if editor.count(old_transition) != 2:
              raise SystemExit(f'editor transition auto-start patch expected 2 matches, found {editor.count(old_transition)}')
          editor = editor.replace(old_transition,
              'duration: root.draftEntryTransitionDuration; replayToken: root.entryTransitionReplayToken; autoStart: false }')
          editor_path.write_text(editor)

          quick_path = Path('config/quickshell/awtarchy/QuickSettings.qml')
          quick = quick_path.read_text()
          mouse_button = '                                        SettingsButton { label: BarState.lockscreenMouseInteractiveEnabled() ? "On" : "Off"; active: BarState.lockscreenMouseInteractiveEnabled(); textSize: root.scaledText(9); onClicked: root.queueStateCommand(["set-lockscreen-mouse-interactive", BarState.lockscreenMouseInteractiveEnabled() ? "false" : "true"]) }\n'
          if quick.count(mouse_button) != 1:
              raise SystemExit(f'Quick Settings mouse-interaction anchor expected once, found {quick.count(mouse_button)}')
          capture_rows = mouse_button + '                                        Text { Layout.fillWidth: true; text: "Hide Quick Settings Before Lock Capture"; color: Theme.foreground; font.family: Theme.fontFamily; font.pixelSize: root.scaledText(9) }\n' + '                                        SettingsButton { label: BarState.lockscreenHideQuickshellBeforeCapture() ? "On" : "Off"; active: BarState.lockscreenHideQuickshellBeforeCapture(); textSize: root.scaledText(9); onClicked: root.queueStateCommand(["set-lockscreen-hide-quickshell-before-capture", BarState.lockscreenHideQuickshellBeforeCapture() ? "false" : "true"]) }\n'
          quick = quick.replace(mouse_button, capture_rows, 1)
          quick_path.write_text(quick)
          PY
          bash -n config/hypr/scripts/awtarchy_lock.sh
          bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-fifth-runtime-pass.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          cmp -s config/quickshell/awtarchy-lock/LockTransitionLayer.qml config/quickshell/awtarchy/LockPreviewTransitionLayer.qml
          git diff --check
      - name: Commit production changes
        run: |
