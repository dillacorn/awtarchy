name: Validate Quickshell Lockscreen Interactive Effects

on:
  pull_request:

permissions:
  contents: read

jobs:
  apply-fifth-runtime-production:
    if: github.event.pull_request.number == 181 && github.event.pull_request.head.ref == 'feature/lockscreen-interactive-effects'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 2
      - name: Apply remaining fifth runtime production changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          def one_re(text, pattern, repl, label, flags=0):
              updated, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return updated

          scene_path = Path('config/quickshell/awtarchy-lock/LockScene.qml')
          text = scene_path.read_text()

          text = one(text,
          '''    property bool externallyManagedEntryTransition: false
              property bool externalEntryTransitionRunning: false
              readonly property bool effectiveEntryTransitionRunning:
                  externallyManagedEntryTransition ? externalEntryTransitionRunning : entryTransitionRunning
          ''',
          '''    property bool externallyManagedEntryTransition: false
              property bool externalEntryTransitionRunning: false
              property real externalEntryTransitionProgress: 1
              property int presentationReplayToken: 0
              property int customImageSpawnEpoch: 0
              readonly property bool effectiveEntryTransitionRunning:
                  externallyManagedEntryTransition ? externalEntryTransitionRunning : entryTransitionRunning
              readonly property real effectiveEntryTransitionProgress:
                  externallyManagedEntryTransition ? externalEntryTransitionProgress : entryTransitionProgress
          
              onEffectiveEntryTransitionRunningChanged: {
                  if (!effectiveEntryTransitionRunning && entered
                          && (!previewMode || presentationReplayToken > 0))
                      customImageSpawnEpoch++;
              }
          ''', 'scene transition presentation state')
          text = one(text,
              '    readonly property bool logoSimulationActive: logoExplosionActive || logoHoverDirty\n',
              '    readonly property bool logoSimulationActive: logoExplosionActive || logoHoverDirty || logoReturnPending\n',
              'logo simulation ownership')
          text = one(text,
              '    property bool logoHoverDirty: false\n',
              '    property bool logoHoverDirty: false\n    property bool logoReturnPending: false\n',
              'logo return state')
          text = one(text,
              '    onLogoHoverActiveChanged: logoHoverDirty = true\n',
          '''    onLogoHoverActiveChanged: {
                  logoHoverDirty = true;
                  if (logoHoverActive)
                      logoReturnPending = false;
                  else if (!logoExplosionActive)
                      logoReturnPending = true;
              }
          ''', 'logo hover state change')
          text = one(text,
              '        return ["fade", "pixel", "iris", "edges", "wipe"].indexOf(key) >= 0\n',
              '        return ["fade", "pixel", "edges", "wipe"].indexOf(key) >= 0\n',
              'scene Iris mode removal')

          image_lookup = '''    function customImageForName(name) {
                  if (!Array.isArray(root.customImages))
                      return null;
                  const key = String(name || "");
                  for (let i = 0; i < root.customImages.length; ++i) {
                      const image = root.customImages[i];
                      if (image && typeof image === "object" && String(image.id || "") === key)
                          return image;
                  }
                  return null;
              }
          '''
          text = one(text, image_lookup, image_lookup + '''
              function customImageSpawnMode(image) {
                  const value = String(image && image.spawn_animation !== undefined
                      ? image.spawn_animation : "none");
                  return ["none", "pixel-warp", "closest-edge", "top", "bottom", "left", "right"].indexOf(value) >= 0
                      ? value : "none";
              }
          
              function customImageSpawnOffset(image, itemWidth, itemHeight) {
                  let mode = customImageSpawnMode(image);
                  if (mode === "none" || mode === "pixel-warp")
                      return Qt.point(0, 0);
                  const x = Math.max(0, Math.min(1, Number(image && image.x !== undefined ? image.x : 0.5)));
                  const y = Math.max(0, Math.min(1, Number(image && image.y !== undefined ? image.y : 0.5)));
                  if (mode === "closest-edge") {
                      let distance = x;
                      mode = "left";
                      if (1 - x < distance) { distance = 1 - x; mode = "right"; }
                      if (y < distance) { distance = y; mode = "top"; }
                      if (1 - y < distance) { mode = "bottom"; }
                  }
                  const centerX = x * root.width;
                  const centerY = y * root.height;
                  const margin = Math.max(24, 32 * root.uiScale);
                  if (mode === "left") return Qt.point(-(centerX + itemWidth / 2 + margin), 0);
                  if (mode === "right") return Qt.point(root.width - centerX + itemWidth / 2 + margin, 0);
                  if (mode === "top") return Qt.point(0, -(centerY + itemHeight / 2 + margin));
                  return Qt.point(0, root.height - centerY + itemHeight / 2 + margin);
              }
          ''', 'custom image spawn helpers')

          text = one(text,
          '''        lastPointerX = x;
                  lastPointerY = y;
                  lastPointerSampleTime = now;
                  logoHoverDirty = wasLogoHovering || logoContainsPoint(x, y);
              }
          ''',
          '''        lastPointerX = x;
                  lastPointerY = y;
                  lastPointerSampleTime = now;
                  const isLogoHovering = logoContainsPoint(x, y);
                  logoHoverDirty = wasLogoHovering || isLogoHovering;
                  if (isLogoHovering && !logoExplosionActive)
                      logoReturnPending = false;
                  else if (wasLogoHovering && !logoExplosionActive)
                      logoReturnPending = true;
              }
          
              function handlePointerExit() {
                  if (!mouseInteractive)
                      return;
                  pointerActive = false;
                  lastPointerSampleTime = 0;
                  if (!logoExplosionActive) {
                      logoReturnPending = true;
                      logoHoverDirty = true;
                  }
              }
          ''', 'pointer exit return path')

          text = one_re(text,
              r'(?ms)^        if \(returning && maxMotion < 1\.2\) \{\n            logoHoverDirty = false;\n            if \(!logoHoverActive\)\n                logoParticles = \(\{\}\);\n        \}$',
              '''        if (returning && maxMotion < 1.2) {
                  logoHoverDirty = false;
                  if (!logoHoverActive && !logoExplosionActive) {
                      logoReturnPending = false;
                      logoParticles = ({});
                  }
              }''', 'logo return convergence')

          text = one(text,
          '''            model: entryTransitionCover.visible
                          && (root.entryTransitionMode() === "pixel"
                              || root.entryTransitionMode() === "iris")
                          ? root.entryTileColumns * root.entryTileRows : 0
          ''',
          '''            model: entryTransitionCover.visible
                          && root.entryTransitionMode() === "pixel"
                          ? root.entryTileColumns * root.entryTileRows : 0
          ''', 'scene Iris tile model')
          text = one_re(text,
              r'(?ms)^                readonly property real centerX:.*?^                readonly property real irisThreshold:.*?^\s*$\n',
              '', 'scene Iris geometry')
          text = one(text,
          '''                visible: root.entryTransitionMode() === "pixel"
                          ? root.entryTransitionProgress < pixelThreshold
                          : root.entryTransitionProgress < irisThreshold
          ''',
          '''                visible: root.entryTransitionProgress < pixelThreshold
          ''', 'scene Iris visibility')

          image_block = '''            Image {
                          required property var modelData
                          readonly property string elementName: String(modelData.id || "")
          
                          visible: modelData.visible !== false || root.editorMode
                          source: String(modelData.path || "").startsWith("/")
                              ? "file://" + String(modelData.path) : ""
                          asynchronous: true
                          cache: true
                          fillMode: Image.PreserveAspectFit
                          width: Math.round(180 * root.uiScale)
                          height: Math.round(180 * root.uiScale)
                          x: root.normalizedX(elementName, 0.50) * parent.width - width / 2
                          y: root.normalizedY(elementName, 0.50) * parent.height - height / 2
                          scale: root.elementScale(elementName)
                          rotation: root.elementRotation(elementName)
                          transformOrigin: Item.Center
                          transform: Scale {
                              origin.x: width / 2
                              origin.y: height / 2
                              xScale: root.elementStretchX(elementName)
                              yScale: root.elementStretchY(elementName)
                          }
                          opacity: root.elementOpacity(elementName)
                              * (modelData.visible !== false ? 1.0 : root.editorMode ? 0.30 : 0.0)
                          z: 4
                      }
          '''
          image_new = '''            Item {
                          id: customImageDelegate
                          required property var modelData
                          readonly property string elementName: String(modelData.id || "")
                          readonly property string spawnMode: root.customImageSpawnMode(modelData)
                          readonly property real finalX: root.normalizedX(elementName, 0.50) * parent.width - width / 2
                          readonly property real finalY: root.normalizedY(elementName, 0.50) * parent.height - height / 2
                          readonly property point spawnOffset: root.customImageSpawnOffset(modelData, width, height)
                          property real spawnProgress: 1
          
                          visible: modelData.visible !== false || root.editorMode
                          width: Math.round(180 * root.uiScale)
                          height: Math.round(180 * root.uiScale)
                          x: finalX + spawnOffset.x * (1 - spawnProgress)
                          y: finalY + spawnOffset.y * (1 - spawnProgress)
                          scale: root.elementScale(elementName) * (spawnMode === "pixel-warp" ? 0.82 + 0.18 * spawnProgress : 1)
                          rotation: root.elementRotation(elementName)
                          transformOrigin: Item.Center
                          transform: Scale {
                              origin.x: width / 2
                              origin.y: height / 2
                              xScale: root.elementStretchX(elementName)
                              yScale: root.elementStretchY(elementName)
                          }
                          opacity: root.elementOpacity(elementName)
                              * (modelData.visible !== false ? 1.0 : root.editorMode ? 0.30 : 0.0)
                              * (spawnMode === "pixel-warp" ? spawnProgress : 1)
                          z: 4
          
                          function restartSpawnAnimation() {
                              spawnAnimation.stop();
                              if (spawnMode === "none") { spawnProgress = 1; return; }
                              spawnProgress = 0;
                              spawnAnimation.restart();
                          }
          
                          Image {
                              id: customImageSource
                              anchors.fill: parent
                              source: String(customImageDelegate.modelData.path || "").startsWith("/")
                                  ? "file://" + String(customImageDelegate.modelData.path) : ""
                              asynchronous: true
                              cache: true
                              fillMode: Image.PreserveAspectFit
                              smooth: customImageDelegate.spawnMode !== "pixel-warp" || customImageDelegate.spawnProgress >= 0.999
                          }
          
                          ShaderEffectSource {
                              id: pixelWarpSource
                              anchors.fill: parent
                              sourceItem: customImageSource
                              hideSource: visible
                              live: true
                              recursive: false
                              smooth: false
                              readonly property real pixelFactor: 1 + 31 * Math.pow(Math.max(0, 1 - customImageDelegate.spawnProgress), 1.25)
                              textureSize: Qt.size(Math.max(1, Math.round(width / pixelFactor)), Math.max(1, Math.round(height / pixelFactor)))
                              visible: customImageDelegate.spawnMode === "pixel-warp" && customImageDelegate.spawnProgress < 0.999
                          }
          
                          NumberAnimation {
                              id: spawnAnimation
                              target: customImageDelegate
                              property: "spawnProgress"
                              from: 0
                              to: 1
                              duration: customImageDelegate.spawnMode === "pixel-warp" ? 620 : 520
                              easing.type: Easing.OutCubic
                          }
          
                          Connections {
                              target: root
                              function onCustomImageSpawnEpochChanged() { customImageDelegate.restartSpawnAnimation(); }
                          }
                      }
          '''
          text = one(text, image_block, image_new, 'custom image spawn renderer')
          text = one(text,
          '''                            property real formationProgress:
                                      root.animationPreference === "off" ? 1 : 0
          ''',
          '''                            property real formationProgress:
                                      root.animationPreference === "off"
                                      || (root.previewMode && root.presentationReplayToken === 0) ? 1 : 0
          ''', 'quiet editor logo formation')
          if '"iris"' in text or 'irisThreshold' in text or 'distanceFromCenter' in text:
              raise SystemExit('Iris-specific scene logic remains after patch')
          scene_path.write_text(text)
          Path('config/quickshell/awtarchy/LockPreviewScene.qml').write_text(text)

          editor_path = Path('config/quickshell/awtarchy/LockscreenEditor.qml')
          editor = editor_path.read_text()
          anchor = 'duration: root.draftEntryTransitionDuration; replayToken: root.entryTransitionReplayToken }'
          if editor.count(anchor) != 2:
              raise SystemExit(f'editor transition auto-start patch expected 2 matches, found {editor.count(anchor)}')
          editor_path.write_text(editor.replace(anchor,
              'duration: root.draftEntryTransitionDuration; replayToken: root.entryTransitionReplayToken; autoStart: false }'))

          quick_path = Path('config/quickshell/awtarchy/QuickSettings.qml')
          quick = quick_path.read_text()
          mouse = '                                        SettingsButton { label: BarState.lockscreenMouseInteractiveEnabled() ? "On" : "Off"; active: BarState.lockscreenMouseInteractiveEnabled(); textSize: root.scaledText(9); onClicked: root.queueStateCommand(["set-lockscreen-mouse-interactive", BarState.lockscreenMouseInteractiveEnabled() ? "false" : "true"]) }\n'
          if quick.count(mouse) != 1:
              raise SystemExit(f'Quick Settings mouse anchor expected once, found {quick.count(mouse)}')
          capture = mouse + '                                        Text { Layout.fillWidth: true; text: "Hide Quick Settings Before Lock Capture"; color: Theme.foreground; font.family: Theme.fontFamily; font.pixelSize: root.scaledText(9) }\n' + '                                        SettingsButton { label: BarState.lockscreenHideQuickshellBeforeCapture() ? "On" : "Off"; active: BarState.lockscreenHideQuickshellBeforeCapture(); textSize: root.scaledText(9); onClicked: root.queueStateCommand(["set-lockscreen-hide-quickshell-before-capture", BarState.lockscreenHideQuickshellBeforeCapture() ? "false" : "true"]) }\n'
          quick_path.write_text(quick.replace(mouse, capture, 1))
          PY
          bash -n config/hypr/scripts/awtarchy_lock.sh
          bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-fifth-runtime-pass.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          cmp -s config/quickshell/awtarchy-lock/LockTransitionLayer.qml config/quickshell/awtarchy/LockPreviewTransitionLayer.qml
          git diff --check
      - name: Commit production changes
        run: |
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml config/quickshell/awtarchy/LockscreenEditor.qml config/quickshell/awtarchy/QuickSettings.qml
          git diff --cached --check
          git commit -m 'feat: complete lockscreen fifth runtime pass'
          git push origin HEAD:feature/lockscreen-interactive-effects
