name: Validate Quickshell Lockscreen Interactive Effects

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Apply save arity fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("config/hypr/scripts/quickshell_application_state.sh")
          text = path.read_text(encoding="utf-8")
          old = "6|12|13|14|16|17|18) ;;"
          new = "6|12|13|14|16|17|18|19) ;;"
          old_count = text.count(old)
          new_count = text.count(new)
          if old_count == 1 and new_count == 0:
              path.write_text(text.replace(old, new), encoding="utf-8")
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(
                  f"unexpected save-lockscreen-editor arity state: old={old_count}, new={new_count}"
              )
          PY

          hash="$(sha256sum config/hypr/scripts/quickshell_application_state.sh | awk '{print $1}')"
          entry="${hash}"$'\t'".config/hypr/scripts/quickshell_application_state.sh"
          if ! grep -Fqx -- "$entry" local/share/awtarchy/quickshell-managed-history.sha256; then
            printf '%s\n' "$entry" >> local/share/awtarchy/quickshell-managed-history.sha256
          fi

          bash -n config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

          if git diff --quiet -- config/hypr/scripts/quickshell_application_state.sh local/share/awtarchy/quickshell-managed-history.sha256; then
            printf '%s\n' 'save arity fix already applied'
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/hypr/scripts/quickshell_application_state.sh local/share/awtarchy/quickshell-managed-history.sha256
            test "$(git diff --cached --name-only | wc -l)" -eq 2
            git commit -m "fix: accept current lockscreen editor save payload"
            git push origin HEAD:feature/lockscreen-interactive-effects
          fi
