name: Validate Quickshell Lockscreen Interactive Effects

on:
  pull_request:

permissions:
  contents: read

jobs:
  clean-fifth-runtime-formatting:
    if: github.event.pull_request.number == 181 && github.event.pull_request.head.ref == 'feature/lockscreen-interactive-effects'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
      - name: Clean and validate generated scene formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          secure = Path('config/quickshell/awtarchy-lock/LockScene.qml')
          preview = Path('config/quickshell/awtarchy/LockPreviewScene.qml')
          text = secure.read_text()
          old = '''        if (returning && maxMotion < 1.2) {
          logoHoverDirty = false;
          if (!logoHoverActive && !logoExplosionActive) {
              logoReturnPending = false;
              logoParticles = ({});
          }
      }
      }
          '''
          new = '''        if (returning && maxMotion < 1.2) {
              logoHoverDirty = false;
              if (!logoHoverActive && !logoExplosionActive) {
                  logoReturnPending = false;
                  logoParticles = ({});
              }
          }
      }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one generated logo-return block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          secure.write_text(text)
          preview.write_text(text)
          PY
          bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-fifth-runtime-pass.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          git diff --check
      - name: Commit formatting cleanup
        run: |
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          git diff --cached --check
          git commit -m 'style: clean lockscreen logo return block'
          git push origin HEAD:feature/lockscreen-interactive-effects
