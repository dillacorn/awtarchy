name: Validate Quickshell Lockscreen Interactive Effects

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Apply temporary third-pass helper
        run: |
          if git log -1 --pretty=%B | grep -Fq '[third-pass-applied]'; then
            printf '%s\n' 'third-pass production patch already applied'
          else
            python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-lockscreen-third-runtime-pass.py')
          text = path.read_text()
          start_marker = "anchor='''        Image {\n            id: wallpaperImage\n"
          end_marker = "effect=anchor+'''\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise RuntimeError('wallpaper helper anchor markers not found')
          if text.find(start_marker, start + 1) >= 0:
              raise RuntimeError('wallpaper helper anchor start marker is ambiguous')
          anchor_lines = [
              "anchor='''        Image {",
              "            id: wallpaperImage",
              "            readonly property var geometry: root.wallpaperGeometry()",
              "            x: geometry.x",
              "            y: geometry.y",
              "            width: geometry.width",
              "            height: geometry.height",
              "            visible: root.backgroundMode === \"wallpaper\" && root.wallpaperSource.length > 0",
              "                && root.wallpaperBlur <= 0",
              "            source: root.wallpaperSource",
              "            fillMode: Image.Stretch",
              "            asynchronous: true",
              "            cache: true",
              "        }",
              "'''",
          ]
          replacement = "\n".join(anchor_lines) + "\n"
          path.write_text(text[:start] + replacement + text[end:])
          PY
            python3 .github/scripts/apply-lockscreen-third-runtime-pass.py
          fi

      - name: Focused pre-commit proof
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-quickshell-lockscreen-third-runtime-pass.sh
          git diff --check
          bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-background-composition.sh
          bash tests/test-quickshell-lockscreen-background-save-dispatch.sh
          bash tests/test-quickshell-lockscreen-runtime-acceptance-187.sh
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-editor-config-boundary.sh
          bash tests/test-quickshell-lockscreen-live-editor.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-editor-presets.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-rotation-reset.sh
          bash tests/test-quickshell-lockscreen-visualizer-transparency.sh
          bash tests/test-quickshell-lockscreen-visualizer-editing.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh

      - name: Commit focused-green production patch
        run: |
          if git log -1 --pretty=%B | grep -Fq '[third-pass-applied]'; then
            printf '%s\n' 'third-pass production commit already present'
          else
            git config user.name 'dillacorn'
            git config user.email '28743863+dillacorn@users.noreply.github.com'
            git add config tests local/share/awtarchy/quickshell-managed-history.sha256
            git diff --cached --check
            git commit -m 'fix: address third lockscreen runtime pass [third-pass-applied]'
            git push origin HEAD:feature/lockscreen-interactive-effects
          fi
