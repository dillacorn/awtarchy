name: Lockscreen runtime polish development

# Temporary branch-only TDD executor. Remove after the validated implementation commit.
on:
  push:
    branches:
      - feature/lockscreen-interactive-effects

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Verify runtime polish regression is red before implementation
        shell: bash
        run: |
          set +e
          bash tests/test-quickshell-lockscreen-runtime-polish-ui.sh
          rc=$?
          set -e
          test "$rc" -ne 0

      - name: Apply runtime polish implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-lockscreen-runtime-polish.py')
          text = path.read_text()
          needle = "' ''',"
          count = text.count(needle)
          if count != 4:
              raise SystemExit(f'expected 4 multiline template endings, found {count}')
          text = text.replace(needle, "'\n''',")
          path.write_text(text)
          PY
          python3 -m py_compile .github/scripts/apply-lockscreen-runtime-polish.py
          set +e
          python3 .github/scripts/apply-lockscreen-runtime-polish.py 2>&1 | tee /tmp/runtime-polish-patcher.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0

      - name: Upload patcher diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockscreen-runtime-polish-patcher
          path: /tmp/runtime-polish-patcher.txt
          if-no-files-found: ignore

      - name: Validate changed shell syntax
        shell: bash
        run: |
          bash -n config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh
          bash -n tests/test-quickshell-lockscreen-runtime-polish-ui.sh
          bash -n tests/test-bibata-cursor-migration.sh
          bash -n tests/test-quickshell-lockscreen-logo-cohesion.sh

      - name: ShellCheck changed shell contracts
        shell: bash
        run: |
          shellcheck config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh
          shellcheck tests/test-quickshell-lockscreen-runtime-polish-ui.sh
          # This test intentionally searches source for literal "$theme"/"$CURSOR_SIZE" text.
          shellcheck -e SC2016 tests/test-bibata-cursor-migration.sh
          shellcheck tests/test-quickshell-lockscreen-logo-cohesion.sh

      - name: Validate runtime polish contracts
        shell: bash
        run: |
          bash tests/test-quickshell-lockscreen-runtime-polish-ui.sh
          bash tests/test-quickshell-lockscreen-runtime-polish.sh
          bash tests/test-bibata-cursor-migration.sh
          bash tests/test-quickshell-lockscreen-logo-cohesion.sh
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-editor-config-boundary.sh
          bash tests/test-quickshell-lockscreen-live-editor.sh
          bash tests/test-quickshell-lockscreen-editor-flick.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-editor-presets.sh
          bash tests/test-quickshell-lockscreen-background-composition.sh
          bash tests/test-quickshell-lockscreen-background-save-dispatch.sh
          bash tests/test-quickshell-lockscreen-weather.sh
          bash tests/test-quickshell-lockscreen-weather-units.sh
          bash tests/test-quickshell-lockscreen-runtime-services.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh

      - name: Validate Quick Settings regressions
        shell: bash
        run: |
          for test in \
            tests/test-quicksettings-layout.sh \
            tests/test-quicksettings-layout-editor.sh \
            tests/test-quicksettings-settings.sh \
            tests/test-quickshell-flyout-settings.sh; do
            if [[ -f "$test" ]]; then
              bash "$test"
            fi
          done

      - name: Verify authentication owner was untouched
        shell: bash
        run: git diff --exit-code HEAD -- config/quickshell/awtarchy-lock/LockAuth.qml

      - name: Validate whitespace
        shell: bash
        run: git diff --check

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "dillacorn"
          git config user.email "28743863+dillacorn@users.noreply.github.com"
          git add \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy/FlyoutSettings.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            tests/test-bibata-cursor-migration.sh \
            tests/test-quickshell-lockscreen-logo-cohesion.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --check
          git commit -m "Polish lockscreen editor and interactions [skip ci]"
          git push origin HEAD:feature/lockscreen-interactive-effects
