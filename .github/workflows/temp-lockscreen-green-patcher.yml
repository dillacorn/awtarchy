name: Temporary Lockscreen GREEN Patcher

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/temp-lockscreen-green-patcher.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Verify RED base is still untouched
        run: |
          git merge-base --is-ancestor 53e91bf488dbf2ca556494eb92b3a800c678c528 HEAD
          test -z "$(git diff --name-only 53e91bf488dbf2ca556494eb92b3a800c678c528..HEAD -- config local/share tests)"
      - name: Apply production GREEN patch
        run: python3 .github/temp-lockscreen-green-patch.py
      - name: Install focused validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Validate focused GREEN contracts
        run: |
          bash -n config/hypr/scripts/awtarchy_lock.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_editor_save.sh
          shellcheck config/hypr/scripts/awtarchy_lock.sh config/hypr/scripts/quickshell_lockscreen_editor_save.sh
          bash tests/test-quickshell-lockscreen-selector-flyout.sh
          bash tests/test-quickshell-lockscreen-spawn-editor-semantics.sh
          bash tests/test-quickshell-lockscreen-rotation-reset.sh
          bash tests/test-quickshell-lockscreen-timezones-text.sh
          bash tests/test-quickshell-lockscreen-quicksettings-header.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check
      - name: Commit verified production patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/quickshell/awtarchy/LockscreenCompactSelector.qml \
                  config/quickshell/awtarchy/LockscreenEditor.qml \
                  config/quickshell/awtarchy/LockPreviewScene.qml \
                  config/quickshell/awtarchy/BarState.qml \
                  config/quickshell/awtarchy/QuickSettings.qml \
                  config/quickshell/awtarchy-lock/LockScene.qml \
                  config/quickshell/awtarchy-lock/shell.qml \
                  config/hypr/scripts/quickshell_lockscreen_editor_save.sh \
                  config/hypr/scripts/awtarchy_lock.sh \
                  local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --quiet && { printf 'No patch produced\n' >&2; false; }
          git commit -m "fix(lockscreen): finish editor runtime polish"
          git push origin HEAD:feature/lockscreen-interactive-effects
