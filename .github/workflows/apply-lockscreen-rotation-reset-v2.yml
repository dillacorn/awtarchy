name: Apply Lockscreen Rotation Reset V2

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - .github/workflows/apply-lockscreen-rotation-reset-v2.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Implement rotation and per-element reset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          app = 'config/hypr/scripts/quickshell_application_state.sh'
          replace_once(app,
              '        def keys_ok: ["id", "opacity", "path", "scale", "stretch_x", "stretch_y", "visible", "x", "y"];',
              '        def keys_ok: ["id", "opacity", "path", "rotation", "scale", "stretch_x", "stretch_y", "visible", "x", "y"];')
          replace_once(app,
              '                and ((. | keys | sort) == keys_ok)',
              '                and ((. | keys - keys_ok | length) == 0)')
          replace_once(app,
              '                and (.opacity | type) == "number" and .opacity >= 0 and .opacity <= 100\n'
              '                and (.visible | type) == "boolean"))\n'
              '        then $candidate else error("invalid custom images") end',
              '                and (.opacity | type) == "number" and .opacity >= 0 and .opacity <= 100\n'
              '                and ((.rotation // 0) | type) == "number"\n'
              '                and (.rotation // 0) >= -180 and (.rotation // 0) <= 180\n'
              '                and (.visible | type) == "boolean"))\n'
              '        then [$candidate[] | . + {rotation: (.rotation // 0)}]\n'
              '        else error("invalid custom images") end')

          bar = 'config/quickshell/awtarchy/BarState.qml'
          replace_once(bar,
              '            const opacity = Number(raw.opacity);\n'
              '            if (!/^image-[A-Za-z0-9_-]{1,64}$/.test(id) || ids[id]',
              '            const opacity = Number(raw.opacity);\n'
              '            const rotation = Number(raw.rotation === undefined ? 0 : raw.rotation);\n'
              '            if (!/^image-[A-Za-z0-9_-]{1,64}$/.test(id) || ids[id]')
          replace_once(bar,
              '                    || !Number.isFinite(opacity) || opacity < 0 || opacity > 100\n'
              '                    || typeof raw.visible !== "boolean")',
              '                    || !Number.isFinite(opacity) || opacity < 0 || opacity > 100\n'
              '                    || !Number.isFinite(rotation) || rotation < -180 || rotation > 180\n'
              '                    || typeof raw.visible !== "boolean")')
          replace_once(bar,
              '                stretch_x: stretchX, stretch_y: stretchY,\n'
              '                opacity: opacity, visible: raw.visible }));',
              '                stretch_x: stretchX, stretch_y: stretchY,\n'
              '                opacity: opacity, rotation: rotation, visible: raw.visible }));')

          shell = 'config/quickshell/awtarchy-lock/shell.qml'
          replace_once(shell,
              '            const opacity = Number(image.opacity);\n'
              '            if (!/^image-[A-Za-z0-9_-]{1,64}$/.test(id) || ids[id] || path.length === 0',
              '            const opacity = Number(image.opacity);\n'
              '            const rotation = Number(image.rotation === undefined ? 0 : image.rotation);\n'
              '            if (!/^image-[A-Za-z0-9_-]{1,64}$/.test(id) || ids[id] || path.length === 0')
          replace_once(shell,
              '                    || !Number.isFinite(opacity) || opacity < 0 || opacity > 100\n'
              '                    || typeof image.visible !== "boolean")',
              '                    || !Number.isFinite(opacity) || opacity < 0 || opacity > 100\n'
              '                    || !Number.isFinite(rotation) || rotation < -180 || rotation > 180\n'
              '                    || typeof image.visible !== "boolean")')
          replace_once(shell,
              '                stretch_x: stretchX, stretch_y: stretchY, opacity: opacity,\n'
              '                visible: image.visible',
              '                stretch_x: stretchX, stretch_y: stretchY, opacity: opacity,\n'
              '                rotation: rotation, visible: image.visible')

          editor = 'config/quickshell/awtarchy/LockscreenEditor.qml'
          replace_once(editor,
              '    property real resizeCenterY: 0\n\n    function defaultVisualizer() {',
              '    property real resizeCenterY: 0\n'
              '    property string rotationElementName: ""\n'
              '    property real rotationStartAngle: 0\n'
              '    property real rotationStartValue: 0\n'
              '    property real rotationCenterX: 0\n'
              '    property real rotationCenterY: 0\n\n'
              '    function defaultVisualizer() {')
          replace_once(editor,
              '            const opacity = Number(raw.opacity);\n'
              '            ids[id] = true;',
              '            const opacity = Number(raw.opacity);\n'
              '            const rotation = Number(raw.rotation === undefined ? 0 : raw.rotation);\n'
              '            ids[id] = true;')
          replace_once(editor,
              '                opacity: Math.max(0, Math.min(100, Number.isFinite(opacity) ? opacity : 100)),\n'
              '                visible: typeof raw.visible === "boolean" ? raw.visible : true',
              '                opacity: Math.max(0, Math.min(100, Number.isFinite(opacity) ? opacity : 100)),\n'
              '                rotation: Math.max(-180, Math.min(180, Number.isFinite(rotation) ? rotation : 0)),\n'
              '                visible: typeof raw.visible === "boolean" ? raw.visible : true')
          replace_once(editor,
              '            id: id, path: value, x: 0.5, y: 0.5, scale: 1.0,\n'
              '            stretch_x: 1.0, stretch_y: 1.0, opacity: 100, visible: true',
              '            id: id, path: value, x: 0.5, y: 0.5, scale: 1.0,\n'
              '            stretch_x: 1.0, stretch_y: 1.0, opacity: 100, rotation: 0, visible: true')

          rotation_functions = (
              '    function normalizedRotation(value) {\n'
              '        const numeric = Number(value);\n'
              '        if (!Number.isFinite(numeric))\n'
              '            return 0;\n'
              '        let normalized = ((numeric + 180) % 360 + 360) % 360 - 180;\n'
              '        if (normalized === -180 && numeric > 0)\n'
              '            normalized = 180;\n'
              '        return normalized;\n'
              '    }\n\n'
              '    function elementRotation(name) {\n'
              '        const index = customImageIndex(name);\n'
              '        if (index < 0)\n'
              '            return 0;\n'
              '        return normalizedRotation(draftCustomImages[index].rotation === undefined\n'
              '            ? 0 : draftCustomImages[index].rotation);\n'
              '    }\n\n'
              '    function setDraftRotationSilently(name, rotation) {\n'
              '        const index = customImageIndex(name);\n'
              '        if (index < 0)\n'
              '            return;\n'
              '        const next = cloneCustomImages(draftCustomImages);\n'
              '        next[index].rotation = normalizedRotation(rotation);\n'
              '        draftCustomImages = next;\n'
              '    }\n\n'
              '    function setDraftRotation(name, rotation) {\n'
              '        if (!isCustomImage(name))\n'
              '            return;\n'
              '        const numeric = Number(rotation);\n'
              '        if (!Number.isFinite(numeric) || numeric < -180 || numeric > 180) {\n'
              '            statusMessage = "Rotation must be -180 to 180 degrees";\n'
              '            return;\n'
              '        }\n'
              '        recordUndoBeforeChange();\n'
              '        setDraftRotationSilently(name, numeric);\n'
              '        selectElement(name, false);\n'
              '        statusMessage = "Image rotation updated";\n'
              '    }\n\n'
              '    function beginRotateElement(name, sceneX, sceneY) {\n'
              '        if (!isCustomImage(name) || editorFocus.width <= 0 || editorFocus.height <= 0)\n'
              '            return;\n'
              '        selectElement(name, false);\n'
              '        const point = elementPoint(name);\n'
              '        rotationElementName = name;\n'
              '        rotationCenterX = Number(point.x) * editorFocus.width;\n'
              '        rotationCenterY = Number(point.y) * editorFocus.height;\n'
              '        rotationStartAngle = Math.atan2(Number(sceneY) - rotationCenterY,\n'
              '            Number(sceneX) - rotationCenterX) * 180 / Math.PI;\n'
              '        rotationStartValue = elementRotation(name);\n'
              '        beginHistoryTransaction();\n'
              '    }\n\n'
              '    function updateRotateElement(sceneX, sceneY) {\n'
              '        if (rotationElementName.length === 0)\n'
              '            return;\n'
              '        const angle = Math.atan2(Number(sceneY) - rotationCenterY,\n'
              '            Number(sceneX) - rotationCenterX) * 180 / Math.PI;\n'
              '        let delta = angle - rotationStartAngle;\n'
              '        if (delta > 180)\n'
              '            delta -= 360;\n'
              '        else if (delta < -180)\n'
              '            delta += 360;\n'
              '        setDraftRotationSilently(rotationElementName, rotationStartValue + delta);\n'
              '    }\n\n'
              '    function endRotateElement() {\n'
              '        if (rotationElementName.length === 0)\n'
              '            return;\n'
              '        rotationElementName = "";\n'
              '        commitHistoryTransaction();\n'
              '        scheduleContrastRefresh();\n'
              '    }\n\n')
          replace_once(editor, '    function beginResizeElement(name, sceneX, sceneY) {',
              rotation_functions + '    function beginResizeElement(name, sceneX, sceneY) {')

          reset_function = (
              '    function resetElementToDefault(name) {\n'
              '        if (!elementExists(name))\n'
              '            return;\n'
              '        recordUndoBeforeChange();\n'
              '        if (name === "visualizer") {\n'
              '            draftVisualizer = defaultVisualizer();\n'
              '        } else if (isCustomImage(name)) {\n'
              '            const index = customImageIndex(name);\n'
              '            const next = cloneCustomImages(draftCustomImages);\n'
              '            const current = next[index];\n'
              '            next[index] = ({\n'
              '                id: current.id, path: current.path, x: 0.5, y: 0.5,\n'
              '                scale: 1.0, stretch_x: 1.0, stretch_y: 1.0,\n'
              '                opacity: 100, rotation: 0, visible: true\n'
              '            });\n'
              '            draftCustomImages = next;\n'
              '        } else {\n'
              '            const defaults = defaultLayout();\n'
              '            const visibility = defaultVisibility();\n'
              '            const nextLayout = cloneLayout(draftLayout);\n'
              '            nextLayout[name] = cloneSnapshot(defaults[name]);\n'
              '            draftLayout = nextLayout;\n'
              '            const nextVisibility = cloneVisibility(draftVisibility);\n'
              '            nextVisibility[name] = name === "password" ? true : visibility[name];\n'
              '            draftVisibility = nextVisibility;\n'
              '        }\n'
              '        selectedElement = name;\n'
              '        selectedElements = [name];\n'
              '        statusMessage = elementLabel(name) + " reset to default";\n'
              '        scheduleContrastRefresh();\n'
              '    }\n\n')
          replace_once(editor, '    function setDraftBackgroundMode(mode) {',
              reset_function + '    function setDraftBackgroundMode(mode) {')

          rotation_handle = (
              '            Rectangle {\n'
              '                id: rotationHandle\n'
              '                visible: root.isCustomImage(root.selectedElement)\n'
              '                width: 20\n'
              '                height: 20\n'
              '                radius: 10\n'
              '                x: Math.round(root.primaryPoint().x * parent.width - width / 2)\n'
              '                y: Math.round(root.primaryPoint().y * parent.height\n'
              '                    - Math.max(54, 100 * root.elementScale(root.selectedElement)) - height / 2)\n'
              '                color: Theme.background\n'
              '                border.width: 2\n'
              '                border.color: Theme.focus\n'
              '                z: 40\n\n'
              '                Text {\n'
              '                    anchors.centerIn: parent\n'
              '                    text: "↻"\n'
              '                    color: Theme.text\n'
              '                    font.family: Theme.fontFamily\n'
              '                    font.pixelSize: 11\n'
              '                }\n\n'
              '                MouseArea {\n'
              '                    anchors.fill: parent\n'
              '                    cursorShape: Qt.SizeAllCursor\n'
              '                    preventStealing: true\n'
              '                    onPressed: mouse => {\n'
              '                        const point = parent.mapToItem(editorFocus, mouse.x, mouse.y);\n'
              '                        root.beginRotateElement(root.selectedElement, point.x, point.y);\n'
              '                        mouse.accepted = true;\n'
              '                    }\n'
              '                    onPositionChanged: mouse => {\n'
              '                        if (!pressed)\n'
              '                            return;\n'
              '                        const point = parent.mapToItem(editorFocus, mouse.x, mouse.y);\n'
              '                        root.updateRotateElement(point.x, point.y);\n'
              '                    }\n'
              '                    onReleased: root.endRotateElement()\n'
              '                    onCanceled: root.endRotateElement()\n'
              '                }\n'
              '            }\n\n')
          replace_once(editor,
              '            Rectangle {\n                visible: root.guideX >= 0',
              rotation_handle + '            Rectangle {\n                visible: root.guideX >= 0')

          rotation_numeric = (
              '                        Text {\n'
              '                            text: "Rotation"\n'
              '                            visible: root.isCustomImage(root.selectedElement)\n'
              '                            color: Theme.muted\n'
              '                            font.family: Theme.fontFamily\n'
              '                            font.pixelSize: 9\n'
              '                        }\n'
              '                        TextField {\n'
              '                            Layout.preferredWidth: 58\n'
              '                            visible: root.isCustomImage(root.selectedElement)\n'
              '                            text: Number(root.elementRotation(root.selectedElement)).toFixed(1)\n'
              '                            validator: DoubleValidator { bottom: -180; top: 180; decimals: 1 }\n'
              '                            selectByMouse: true\n'
              '                            font.pixelSize: 9\n'
              '                            onEditingFinished: root.setDraftRotation(root.selectedElement, text)\n'
              '                        }\n\n')
          replace_once(editor,
              '                        SettingsButton {\n                            id: selectedElementColorButton',
              rotation_numeric + '                        SettingsButton {\n                            id: selectedElementColorButton')
          replace_once(editor,
              '                        Text { text: "Element color"; color: Theme.muted; font.family: Theme.fontFamily; font.pixelSize: 9 }',
              '                        SettingsButton {\n'
              '                            label: "Reset to Default"\n'
              '                            textSize: 9\n'
              '                            onClicked: root.resetElementToDefault(root.selectedElement)\n'
              '                        }\n'
              '                        Text { text: "Element color"; color: Theme.muted; font.family: Theme.fontFamily; font.pixelSize: 9 }')

          scene = 'config/quickshell/awtarchy-lock/LockScene.qml'
          replace_once(scene, '    function elementColor(name) {',
              '    function elementRotation(name) {\n'
              '        const image = customImageForName(name);\n'
              '        if (!image)\n'
              '            return 0;\n'
              '        const value = Number(image.rotation === undefined ? 0 : image.rotation);\n'
              '        return Number.isFinite(value) ? Math.max(-180, Math.min(180, value)) : 0;\n'
              '    }\n\n'
              '    function elementColor(name) {')
          replace_once(scene,
              '                scale: root.elementScale(elementName)\n                transformOrigin: Item.Center',
              '                scale: root.elementScale(elementName)\n'
              '                rotation: root.elementRotation(elementName)\n'
              '                transformOrigin: Item.Center')
          Path('config/quickshell/awtarchy/LockPreviewScene.qml').write_text(Path(scene).read_text())
          PY

          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash tests/test-quickshell-lockscreen-rotation-reset.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-live-editor.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          git diff --check

      - name: Refresh managed stock hashes
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          printf '\n# 2026-09-12 custom-image rotation and per-element reset.\n' >> "$history"
          while IFS='|' read -r source installed; do
            digest="$(sha256sum "$source" | awk '{print $1}')"
            entry="${digest}"$'\t'"${installed}"
            if ! grep -Fqx -- "$entry" "$history"; then
              printf '%s\n' "$entry" >> "$history"
            fi
          done <<'EOF'
          config/hypr/scripts/quickshell_application_state.sh|.config/hypr/scripts/quickshell_application_state.sh
          config/quickshell/awtarchy/BarState.qml|.config/quickshell/awtarchy/BarState.qml
          config/quickshell/awtarchy/LockscreenEditor.qml|.config/quickshell/awtarchy/LockscreenEditor.qml
          config/quickshell/awtarchy/LockPreviewScene.qml|.config/quickshell/awtarchy/LockPreviewScene.qml
          config/quickshell/awtarchy-lock/shell.qml|.config/quickshell/awtarchy-lock/shell.qml
          config/quickshell/awtarchy-lock/LockScene.qml|.config/quickshell/awtarchy-lock/LockScene.qml
          EOF
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            config/hypr/scripts/quickshell_application_state.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy-lock/shell.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m "Add lockscreen image rotation and element reset"
          git push origin HEAD:feature/lockscreen-interactive-effects
