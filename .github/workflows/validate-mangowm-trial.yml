name: Validate MangoWM Trial
on:
  push:
    branches: [MangoWM_Migration_Trial_Investigation]
    paths:
      - 'trials/mangowm/**'
      - 'tests/test-mangowm-trial.sh'
      - 'tests/test-mangowm-managed-migration.sh'
      - 'tests/test-mangowm-position.py'
      - 'tests/test-mangowm-cursor.py'
      - 'tests/test-mangowm-idle.py'
      - 'tests/test-mangowm-launch-handler.py'
      - 'config/hypr/scripts/launch_handler.sh'
      - 'tests/test-default-applications.py'
      - 'local/share/awtarchy/migrate-default-apps-hyprland.py'
      - 'tests/test-mangowm-shared-shell.sh'
      - 'tests/test-mangowm-lock.sh'
      - 'tests/test-mangowm-quicksettings.sh'
      - 'tests/test-polkit-agent-mango.py'
      - 'config/hypr/scripts/awtarchy-polkit-agent/**'
      - 'config/hypr/scripts/quickshell_*.sh'
      - 'config/mango/**'
      - 'local/share/awtarchy/awtarchy-runtime.sh'
      - '.github/workflows/validate-mangowm-trial.yml'
  pull_request:
    paths:
      - 'trials/mangowm/**'
      - 'tests/test-mangowm-trial.sh'
      - '.github/workflows/validate-mangowm-trial.yml'
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Static checks
        run: |
          bash tests/test-mangowm-trial.sh
          bash tests/test-mangowm-trial-mocks.sh
          bash tests/test-mangowm-managed-migration.sh
          python3 tests/test-mangowm-position.py
          python3 tests/test-mangowm-cursor.py
          python3 tests/test-mangowm-idle.py
          python3 tests/test-mangowm-launch-handler.py
          python3 tests/test-default-applications.py
          bash tests/test-mangowm-shared-shell.sh
          bash tests/test-mangowm-lock.sh
          bash tests/test-mangowm-quicksettings.sh
          python3 tests/test-polkit-agent-mango.py
          python3 tests/test-polkit-agent-tui.py
          bash tests/test-polkit-agent-hypr-dispatch.sh
          bash tests/test-polkit-agent-session-binding.sh
          bash tests/test-polkit-agent-secure.sh
          bash tests/test-polkit-agent-foot-appearance.sh
          bash tests/test-polkit-agent-glib-watch.sh
          bash tests/test-polkit-agent-headless-idle.sh
          bash tests/test-polkit-agent-internal-window-ui.sh
          bash tests/test-polkit-agent-password-retry.sh
          bash tests/test-polkit-agent-production-integration.sh
          bash tests/test-polkit-agent-runtime-rebuild.sh
          bash tests/test-polkit-agent-startup-diagnostics.sh
          python3 tests/test-polkit-agent-auth-feedback.py
          python3 tests/test-polkit-agent-transient-frontend.py
          bash -n config/hypr/scripts/awtarchy-polkit-agent/launcher.sh
          shellcheck -S warning trials/mangowm/*.sh
          shellcheck -S warning config/mango/scripts/*.sh
      - name: Validate with Arch packaged MangoWM parser
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo archlinux:latest bash -euc '
            pacman -Sy --noconfirm mangowm qt6-declarative python
            mango -c /repo/trials/mangowm/config.conf -p
            mango -c /repo/config/mango/config.conf -p

            # Parse the actual generated Mango Quickshell profile instead
            # of relying on substring checks that cannot catch QML syntax.
            staging="$(mktemp -d)"
            trap '''rm -rf -- "$staging"''' EXIT
            python3 /repo/trials/mangowm/render-quickshell.py \
              --source /repo/config/quickshell/awtarchy \
              --dest "$staging/awtarchy-mango" \
              --bridge-dir /repo/trials/mangowm
            for file in "$staging"/awtarchy-mango/*.qml \
                /repo/config/quickshell/awtarchy-lock/*.qml; do
              /usr/lib/qt6/bin/qmlformat --ignore-settings "$file" >/dev/null
            done
          '
