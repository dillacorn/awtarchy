name: Temporary Lockscreen Selector History Fix

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/temp-lockscreen-selector-history-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Verify exact failed parent
        run: test "$(git rev-parse HEAD^)" = "b83269693f3056238d8cc4b190a9f1e10a67cdf8"
      - name: Patch selector managed-history coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test-quickshell-lockscreen-interactive-managed-history.sh')
          text = path.read_text()
          needle = "    'config/quickshell/awtarchy/LockscreenEditor.qml:.config/quickshell/awtarchy/LockscreenEditor.qml'\n"
          addition = needle + "    'config/quickshell/awtarchy/LockscreenCompactSelector.qml:.config/quickshell/awtarchy/LockscreenCompactSelector.qml'\n"
          if addition not in text:
              if text.count(needle) != 1:
                  raise SystemExit('focused managed-history selector insertion point is not unique')
              path.write_text(text.replace(needle, addition, 1))
          PY
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          source='config/quickshell/awtarchy/LockscreenCompactSelector.qml'
          installed='.config/quickshell/awtarchy/LockscreenCompactSelector.qml'
          digest="$(sha256sum "$source" | awk '{print $1}')"
          entry="${digest}"$'\t'"${installed}"
          grep -Fqx -- "$entry" "$history" || printf '%s\t%s\n' "$digest" "$installed" >> "$history"
      - name: Install integration validation tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils shellcheck lua5.4
      - name: Validate focused and full updater contracts
        run: |
          bash -n tests/test-quickshell-lockscreen-interactive-managed-history.sh
          shellcheck tests/test-quickshell-lockscreen-interactive-managed-history.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          for pair in \
            'config/hypr/scripts/quickshell_lockscreen_editor_save.sh:.config/hypr/scripts/quickshell_lockscreen_editor_save.sh' \
            'config/quickshell/awtarchy/LockscreenCompactSelector.qml:.config/quickshell/awtarchy/LockscreenCompactSelector.qml'; do
            source="${pair%%:*}"
            installed="${pair#*:}"
            digest="$(sha256sum "$source" | awk '{print $1}')"
            grep -Fqx -- "${digest}"$'\t'"${installed}" "$history"
          done
          aur_scan_fixture_installed=0
          cleanup_aur_scan_fixture() {
            if (( aur_scan_fixture_installed == 1 )); then
              sudo rm -f -- /usr/bin/aur-scan
            fi
          }
          trap cleanup_aur_scan_fixture RETURN
          if [[ ! -x /usr/bin/aur-scan ]]; then
            sudo install -m 0755 tests/fixtures/aur-scan-version-only.sh /usr/bin/aur-scan
            aur_scan_fixture_installed=1
          fi
          bash tests/test-quickshell-updater-migration.sh
          cleanup_aur_scan_fixture
          aur_scan_fixture_installed=0
          trap - RETURN
          git diff --check
      - name: Commit verified correction
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add tests/test-quickshell-lockscreen-interactive-managed-history.sh local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --quiet && false
          git commit -m 'test(lockscreen): cover selector managed history'
          git push origin HEAD:feature/lockscreen-interactive-effects
