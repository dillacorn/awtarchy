name: Feature lockscreen profile roundtrip

on:
  push:
    branches:
      - feature/lockscreen-media-editor-polish

permissions:
  contents: read

jobs:
  profile-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Profile save parity
        run: bash tests/test-quickshell-lockscreen-profile-save-parity.sh
      - name: Per-display resolver contracts
        run: node tests/test-quickshell-lockscreen-monitor-profile-resolver.mjs
      - name: Per-display persistence
        run: bash tests/test-quickshell-lockscreen-monitor-profile-state.sh
      - name: Secure per-display profile contracts
        run: bash tests/test-quickshell-lockscreen-secure-monitor-profiles.sh
      - name: Saved configuration targets
        run: bash tests/test-quickshell-lockscreen-saved-profiles.sh
      - name: Per-display editor session
        run: bash tests/test-quickshell-lockscreen-multimonitor-editor.sh
      - name: Element opacity floor
        run: bash tests/test-quickshell-lockscreen-element-opacity.sh
      - name: Explicit element selection
        run: bash tests/test-quickshell-lockscreen-selector-flyout.sh
