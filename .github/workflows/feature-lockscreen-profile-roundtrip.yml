name: Feature lockscreen profile roundtrip

on:
  push:
    branches:
      - feature/lockscreen-media-editor-polish

permissions:
  contents: read

jobs:
  profile-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Profile save parity
        run: bash tests/test-quickshell-lockscreen-profile-save-parity.sh
