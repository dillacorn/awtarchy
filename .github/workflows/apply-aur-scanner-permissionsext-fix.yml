name: Apply PermissionsExt prototype compile fix

on:
  push:
    branches:
      - feature/aur-scanner-single-auth-prototype

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply PermissionsExt prototype compile fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Restore required PermissionsExt import
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('tools/aur-scanner-single-auth-prototype.py')
          text = path.read_text(encoding='utf-8')
          old = 'use std::os::unix::fs::{MetadataExt, OpenOptionsExt};'
          new = 'use std::os::unix::fs::{MetadataExt, OpenOptionsExt, PermissionsExt};'
          if text.count(old) != 1:
              raise SystemExit(f'expected one import marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile tools/aur-scanner-single-auth-prototype.py
          git diff --check
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add tools/aur-scanner-single-auth-prototype.py
          git commit -m 'Restore PermissionsExt for trusted binary check'
          git push origin HEAD:feature/aur-scanner-single-auth-prototype
