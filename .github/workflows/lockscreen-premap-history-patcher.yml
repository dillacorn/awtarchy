name: Lockscreen Pre-map History Patcher

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-history:
    if: github.event.pull_request.number == 181 && github.event.pull_request.head.ref == 'feature/lockscreen-interactive-effects'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Record current compositor input hashes
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'

          append_current_hash() {
            local source="$1"
            local target="$2"
            local sum entry
            sum="$(sha256sum "$source" | awk '{print $1}')"
            entry="${sum}"$'\t'"${target}"
            if ! grep -Fxq -- "$entry" "$history"; then
              printf '%s\n' "$entry" >>"$history"
            fi
          }

          printf '\n%s\n' '# Lockscreen compositor-owned immediate Power Menu input.' >>"$history"
          append_current_hash \
            'config/hypr/hyprland.lua' \
            '.config/hypr/hyprland.lua'
          append_current_hash \
            'config/hypr/scripts/quickshell_power_menu.sh' \
            '.config/hypr/scripts/quickshell_power_menu.sh'
          append_current_hash \
            'config/hypr/scripts/quickshell_power_menu_key.sh' \
            '.config/hypr/scripts/quickshell_power_menu_key.sh'
          append_current_hash \
            'config/quickshell/awtarchy/PowerMenu.qml' \
            '.config/quickshell/awtarchy/PowerMenu.qml'

          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check
      - name: Commit history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'chore(lockscreen): record compositor input hashes'
          git push origin HEAD:feature/lockscreen-interactive-effects