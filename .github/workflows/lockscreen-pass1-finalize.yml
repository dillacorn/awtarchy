name: Lockscreen Pass 1 Finalize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 181 && github.event.pull_request.head.ref == 'feature/lockscreen-interactive-effects'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Apply deterministic Pass 1 final repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          secure = Path('config/quickshell/awtarchy-lock/LockScene.qml')
          preview = Path('config/quickshell/awtarchy/LockPreviewScene.qml')
          animation_test = Path('tests/test-quickshell-lockscreen-animation-preference.sh')
          history = Path('local/share/awtarchy/quickshell-managed-history.sha256')

          text = secure.read_text(encoding='utf-8')
          scene_replacements = [
              (
                  'readonly property string usernameText: showUsername ? Quickshell.env("USER") : "";    readonly property real passwordCenterX:',
                  'readonly property string usernameText: showUsername ? Quickshell.env("USER") : "";\n    readonly property real passwordCenterX:'
              ),
              (
                  'property string dateText: "";    function wallpaperGeometry() {',
                  'property string dateText: "";\n\n    function wallpaperGeometry() {'
              ),
              (
                  'function minuteTimeFormat() {    function minuteTimeFormat() {',
                  'function minuteTimeFormat() {'
              ),
              (
                  '    }    Timer {\n        interval: 15000',
                  '    }\n\n    Timer {\n        interval: 15000'
              ),
              (
                  '''        const local = wordmarkItem.mapFromItem(root, x, y);
                  const margin = 90 * uiScale;
                  if (local.x < -margin || local.y < -margin
                          || local.x > wordmarkWidth + margin
                          || local.y > wordmarkHeight + margin)
                      return;
          ''',
                  '''        const local = wordmarkItem.mapFromItem(root, x, y);
          '''
              ),
          ]

          for old, new in scene_replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one scene repair match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          secure.write_text(text, encoding='utf-8')
          preview.write_text(text, encoding='utf-8')

          test_text = animation_test.read_text(encoding='utf-8')
          old_audio_contract = '''require_text "$SCENE_QML" 'readonly property bool pointerEffectsEnabled: mouseInteractive && pointerActive' \\
              'pointer effects are not controlled independently from formation animation'
          require_text "$SCENE_QML" 'readonly property bool audioEffectsEnabled: audioReactive && audioLevel > audioSilenceThreshold' \\
              'audio effects are not controlled independently from formation animation'
          require_text "$SHELL_QML" 'enabled: root.lockAudioReactive' \\
              'audio analyzer is not controlled solely by the Audio Reactive preference'
          reject_text "$SCENE_QML" 'readonly property bool interactiveEffectsEnabled: root.animationPreference !== "off"' \\
              'formation Off still suppresses independent pointer/audio effects'
          reject_text "$SHELL_QML" 'enabled: root.lockAudioReactive && root.lockAnimationPreference !== "off"' \\
              'formation Off still suppresses the independent audio analyzer'
          '''
          new_audio_contract = '''require_text "$SCENE_QML" 'readonly property bool pointerEffectsEnabled: mouseInteractive && pointerActive' \\
              'pointer effects are not controlled independently from formation animation'
          reject_text "$SCENE_QML" 'readonly property bool audioEffectsEnabled:' \\
              'retired audio-driven logo movement remains in the presentation scene'
          reject_text "$SCENE_QML" 'required property bool audioReactive' \\
              'presentation scene still accepts retired logo audio-reactive state'
          reject_text "$SURFACE_QML" 'required property bool audioReactive' \\
              'secure lock surface still carries retired logo audio-reactive state'
          reject_text "$SHELL_QML" 'property bool lockAudioReactive' \\
              'secure lock shell still persists retired logo audio-reactive state'
          reject_text "$SHELL_QML" 'LockAudioAnalyzer {' \\
              'secure lock still instantiates audio analysis solely for logo movement'
          reject_text "$SCENE_QML" 'readonly property bool interactiveEffectsEnabled: root.animationPreference !== "off"' \\
              'formation Off still suppresses independent pointer effects'
          '''
          count = test_text.count(old_audio_contract)
          if count != 1:
              raise SystemExit(f'expected one stale audio contract block, found {count}')
          animation_test.write_text(test_text.replace(old_audio_contract, new_audio_contract, 1), encoding='utf-8')

          history_text = history.read_text(encoding='utf-8')
          managed = [
              (preview, '.config/quickshell/awtarchy/LockPreviewScene.qml'),
              (secure, '.config/quickshell/awtarchy-lock/LockScene.qml'),
          ]
          additions = []
          for source, installed in managed:
              digest = hashlib.sha256(source.read_bytes()).hexdigest()
              entry = f'{digest}\t{installed}'
              if entry not in history_text.splitlines():
                  additions.append(entry)
          if additions:
              if history_text and not history_text.endswith('\n'):
                  history_text += '\n'
              history_text += '\n'.join(additions) + '\n'
              history.write_text(history_text, encoding='utf-8')
          PY

      - name: Focused Pass 1 validation
        shell: bash
        run: |
          bash -n tests/test-quickshell-lockscreen-interaction-polish.sh
          bash -n tests/test-quickshell-lockscreen-animation-preference.sh
          shellcheck tests/test-quickshell-lockscreen-interaction-polish.sh
          shellcheck tests/test-quickshell-lockscreen-animation-preference.sh

          bash tests/test-quickshell-lockscreen-interaction-polish.sh
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash tests/test-quickshell-lockscreen-logo-cohesion.sh
          bash tests/test-quickshell-lockscreen-animation-preference.sh
          bash tests/test-quickshell-lockscreen-foundation.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-editor-flick.sh
          bash tests/test-quickshell-lockscreen-runtime-polish.sh
          bash tests/test-quickshell-lockscreen-runtime-polish-ui.sh
          bash tests/test-quickshell-lockscreen-runtime-services.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh

          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          git diff --check
          git diff --exit-code origin/main -- config/quickshell/awtarchy-lock/LockAuth.qml

      - name: Remove temporary Pass 1 implementation machinery
        shell: bash
        run: |
          git rm \
            .github/scripts/apply-lockscreen-expansion-pass1.py \
            .github/scripts/normalize-lockscreen-pass1-patcher.py \
            .github/workflows/lockscreen-expansion-pass1-development.yml \
            .github/workflows/lockscreen-pass1-finalize.yml
          git diff --check

      - name: Commit finalized Pass 1
        shell: bash
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            tests/test-quickshell-lockscreen-animation-preference.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Finalize lockscreen Pass 1 interactions'
          git push origin HEAD:feature/lockscreen-interactive-effects
