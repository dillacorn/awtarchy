name: Lockscreen Pass 3 State Development

on:
  push:
    branches: [feature/lockscreen-interactive-effects]

permissions:
  contents: write

jobs:
  apply-state-slice:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Apply Pass 3 state slice
        run: python3 .github/scripts/apply-lockscreen-pass3-state.py
      - name: Validate state slice syntax and existing contracts
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-quickshell-lockscreen-element-system.sh
          shellcheck tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          git diff --check
      - name: Require Pass 3 contract to advance to analyzer boundary
        run: |
          set +e
          output="$(bash tests/test-quickshell-lockscreen-visualizer-transparency.sh 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          [[ $status -ne 0 ]]
          grep -Fq 'FAIL: CAVA visualizer source is not fixed at 64 bands' <<<"$output"
      - name: Commit verified state slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/hypr/scripts/quickshell_application_state.sh config/quickshell/awtarchy/BarState.qml
          git diff --cached --quiet && exit 0
          git commit -m 'Add lockscreen Pass 3 state model'
          git push origin HEAD:feature/lockscreen-interactive-effects
