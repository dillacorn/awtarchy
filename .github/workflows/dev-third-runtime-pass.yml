name: Temporary Third Runtime Pass Apply

on:
  push:
    branches: [feature/lockscreen-interactive-effects]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: add temporary third-pass apply workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Apply exact third-pass patch
        run: python3 .github/scripts/apply-lockscreen-third-runtime-pass.py
      - name: Syntax and whitespace
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-quickshell-lockscreen-third-runtime-pass.sh
          git diff --check
      - name: Third runtime-pass RED-to-GREEN contract
        run: bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
      - name: Transition regressions
        run: |
          bash tests/test-quickshell-lockscreen-entry-transitions.sh
          bash tests/test-quickshell-lockscreen-transition-layer.sh
          bash tests/test-quickshell-lockscreen-capture.sh
      - name: Background regressions
        run: |
          bash tests/test-quickshell-lockscreen-background-composition.sh
          bash tests/test-quickshell-lockscreen-background-save-dispatch.sh
      - name: Issue 187 runtime acceptance
        run: bash tests/test-quickshell-lockscreen-runtime-acceptance-187.sh
      - name: Editor and transform regressions
        run: |
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-editor-config-boundary.sh
          bash tests/test-quickshell-lockscreen-live-editor.sh
          bash tests/test-quickshell-lockscreen-editor-flick.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-editor-presets.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-rotation-reset.sh
          bash tests/test-quickshell-lockscreen-visualizer-transparency.sh
          bash tests/test-quickshell-lockscreen-visualizer-editing.sh
      - name: Interaction regressions
        run: |
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash tests/test-quickshell-lockscreen-interaction-polish.sh
      - name: Managed history
        run: bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
      - name: Commit validated production patch
        run: |
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add config tests local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --check
          git commit -m 'fix: address third lockscreen runtime pass [third-pass-applied]'
          git push origin HEAD:feature/lockscreen-interactive-effects
