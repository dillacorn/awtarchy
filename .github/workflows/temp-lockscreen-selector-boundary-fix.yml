name: Temporary Lockscreen Selector Boundary Fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 181 && github.event.pull_request.head.ref == 'feature/lockscreen-interactive-effects'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Repair timezone selector property boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('config/quickshell/awtarchy/LockscreenEditor.qml')
          text = path.read_text()
          old = '''                        LockscreenCompactSelector {
                            popupBoundary: editorFocus Layout.preferredWidth: 180; model: root.timezonePresets; currentIndex: root.timezonePresetIndex(root.elementPoint(root.selectedElement).timezone); onActivated: index => root.setTimezoneClockZone(root.selectedElement, root.timezonePresets[index].key) }'''
          new = '''                        LockscreenCompactSelector {
                            popupBoundary: editorFocus
                            Layout.preferredWidth: 180
                            model: root.timezonePresets
                            currentIndex: root.timezonePresetIndex(root.elementPoint(root.selectedElement).timezone)
                            onActivated: index => root.setTimezoneClockZone(root.selectedElement, root.timezonePresets[index].key)
                        }'''
          if text.count(old) != 1:
              raise SystemExit('timezone selector malformed anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY

          HISTORY='local/share/awtarchy/quickshell-managed-history.sha256'
          src='config/quickshell/awtarchy/LockscreenEditor.qml'
          dst='.config/quickshell/awtarchy/LockscreenEditor.qml'
          digest="$(sha256sum "$src" | awk '{print $1}')"
          line="${digest}"$'\t'"${dst}"
          grep -Fqx -- "$line" "$HISTORY" || printf '%s\n' "$line" >> "$HISTORY"

          bash tests/test-quickshell-lockscreen-selector-flyout.sh
          bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

      - name: Commit clean result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-lockscreen-selector-boundary-fix.yml
          git add \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            local/share/awtarchy/quickshell-managed-history.sha256 \
            .github/workflows/temp-lockscreen-selector-boundary-fix.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(lockscreen): repair selector property boundary'
          git push origin HEAD:feature/lockscreen-interactive-effects
