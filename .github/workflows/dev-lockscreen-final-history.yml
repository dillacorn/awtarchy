name: Lockscreen Final Managed History Development

on:
  push:
    branches: [feature/lockscreen-interactive-effects]

permissions:
  contents: write

jobs:
  refresh-history:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Append exact current managed hashes
        run: |
          set -euo pipefail
          output="$(mktemp)"
          if bash tests/test-quickshell-lockscreen-interactive-managed-history.sh >"$output" 2>&1; then
            cat "$output"
          else
            cat "$output"
            grep '^MISSING_MANAGED_HASH ' "$output" \
              | sed 's/^MISSING_MANAGED_HASH //' \
              >> local/share/awtarchy/quickshell-managed-history.sha256
          fi
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check
      - name: Commit verified history only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --quiet && exit 0
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = 'local/share/awtarchy/quickshell-managed-history.sha256'
          git commit -m 'Refresh lockscreen managed history'
          git push origin HEAD:feature/lockscreen-interactive-effects
