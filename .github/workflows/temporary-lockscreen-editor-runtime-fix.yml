name: Temporary lockscreen editor runtime fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 181 &&
      github.event.pull_request.head.ref == 'feature/lockscreen-interactive-effects' &&
      github.actor == 'dillacorn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 2

      - name: Verify exact helper parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "8ae66bb0d868fa3e2b3947bbd2f0dfb5c19299e0"

      - name: Apply production fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          editor = Path("config/quickshell/awtarchy/LockscreenEditor.qml")
          text = editor.read_text(encoding="utf-8")

          old_header = '''            color: "transparent"; focusable: false; aboveWindows: true; exclusionMode: ExclusionMode.Ignore; anchors.top: true; anchors.bottom: true; anchors.left: true; anchors.right: true; opacity: root.editorEntranceOpacity
            Item { id: secondaryTransitionStart; x: parent.width + 64; y: 0; width: parent.width; height: parent.height
'''
          new_header = '''            color: "transparent"; focusable: false; aboveWindows: true; exclusionMode: ExclusionMode.Ignore; anchors.top: true; anchors.bottom: true; anchors.left: true; anchors.right: true
            Item { id: secondaryPreviewContent; anchors.fill: parent; opacity: root.editorEntranceOpacity }
            Item { id: secondaryTransitionStart; parent: secondaryPreviewContent; x: parent.width + 64; y: 0; width: parent.width; height: parent.height
'''
          old_scene = '            LockPreviewScene { id: secondaryPreviewScene; anchors.fill: parent; theme: Theme; animationPreference: BarState.lockscreenAnimationPreference()\n'
          new_scene = '            LockPreviewScene { id: secondaryPreviewScene; parent: secondaryPreviewContent; anchors.fill: parent; theme: Theme; animationPreference: BarState.lockscreenAnimationPreference()\n'
          old_transition = '            LockPreviewTransitionLayer { id: secondaryPreviewTransitionLayer; anchors.fill: parent; z: 160; startSource: secondaryTransitionStart; endSource: secondaryPreviewScene; mode: root.draftEntryTransition; duration: root.draftEntryTransitionDuration; replayToken: root.entryTransitionReplayToken; autoStart: false }\n'
          new_transition = '            LockPreviewTransitionLayer { id: secondaryPreviewTransitionLayer; parent: secondaryPreviewContent; anchors.fill: parent; z: 160; startSource: secondaryTransitionStart; endSource: secondaryPreviewScene; mode: root.draftEntryTransition; duration: root.draftEntryTransitionDuration; replayToken: root.entryTransitionReplayToken; autoStart: false }\n'

          for label, old in (("secondary window header", old_header), ("secondary preview scene", old_scene), ("secondary transition layer", old_transition)):
              if text.count(old) != 1:
                  raise RuntimeError(f"expected exactly one {label} match, found {text.count(old)}")

          text = text.replace(old_header, new_header, 1)
          text = text.replace(old_scene, new_scene, 1)
          text = text.replace(old_transition, new_transition, 1)
          editor.write_text(text, encoding="utf-8")

          digest = hashlib.sha256(editor.read_bytes()).hexdigest()
          history = Path("local/share/awtarchy/quickshell-managed-history.sha256")
          history_text = history.read_text(encoding="utf-8")
          entry = f"{digest}\t.config/quickshell/awtarchy/LockscreenEditor.qml"
          if entry in history_text:
              raise RuntimeError("new managed-history hash unexpectedly already exists")
          if not history_text.endswith("\n"):
              history_text += "\n"
          history_text += "\n# 2026-09-13 secondary editor PanelWindow opacity runtime fix stock hash.\n" + entry + "\n"
          history.write_text(history_text, encoding="utf-8")
          print(f"LockscreenEditor sha256: {digest}")
          PY

          bash tests/test-quickshell-lockscreen-runtime-regressions.sh
          git diff --check

      - name: Commit scoped production fix and remove helper
        shell: bash
        run: |
          git config user.name "dillacorn"
          git config user.email "28743863+dillacorn@users.noreply.github.com"
          git rm .github/workflows/temporary-lockscreen-editor-runtime-fix.yml
          git add config/quickshell/awtarchy/LockscreenEditor.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --check
          git commit -m "fix: move secondary editor fade to content item"
          git push origin HEAD:feature/lockscreen-interactive-effects
