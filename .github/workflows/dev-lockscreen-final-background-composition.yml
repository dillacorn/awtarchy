name: Dev Lockscreen Final Background Composition

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Apply final background composition patch
        run: python3 .github/scripts/dev-fix-lockscreen-final-background-composition.py
      - name: Validate focused lockscreen contracts
        run: |
          bash -n tests/test-quickshell-lockscreen-composition-blur-rendering.sh
          bash -n tests/test-quickshell-lockscreen-background-composition.sh
          bash -n tests/test-quickshell-lockscreen-blur-iris-editor-controls.sh
          bash -n tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash -n tests/test-quickshell-lockscreen-runtime-acceptance-187.sh
          bash -n tests/test-quickshell-lockscreen-interactive-managed-history.sh
          shellcheck tests/test-quickshell-lockscreen-composition-blur-rendering.sh
          shellcheck tests/test-quickshell-lockscreen-background-composition.sh
          shellcheck tests/test-quickshell-lockscreen-blur-iris-editor-controls.sh
          shellcheck tests/test-quickshell-lockscreen-third-runtime-pass.sh
          shellcheck tests/test-quickshell-lockscreen-runtime-acceptance-187.sh
          shellcheck tests/test-quickshell-lockscreen-interactive-managed-history.sh
          bash tests/test-quickshell-lockscreen-composition-blur-rendering.sh
          bash tests/test-quickshell-lockscreen-background-composition.sh
          bash tests/test-quickshell-lockscreen-blur-iris-editor-controls.sh
          bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-runtime-acceptance-187.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/quickshell/awtarchy-lock/LockSurface.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            tests/test-quickshell-lockscreen-background-composition.sh \
            tests/test-quickshell-lockscreen-blur-iris-editor-controls.sh \
            tests/test-quickshell-lockscreen-third-runtime-pass.sh \
            tests/test-quickshell-lockscreen-runtime-acceptance-187.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          if ! git diff --cached --quiet; then
            git commit -m "fix: blur final lockscreen background composition"
            git push origin HEAD:feature/lockscreen-interactive-effects
          fi
