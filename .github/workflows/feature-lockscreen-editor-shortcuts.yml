name: Feature lockscreen editor shortcuts

on:
  push:
    branches: [feature/lockscreen-media-editor-polish]

permissions:
  contents: write

jobs:
  shortcut-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Apply window-owned shortcut fix
        run: python3 .github/scripts/feature-lockscreen-editor-shortcuts-fix.py
      - name: Shortcut regression
        run: bash tests/test-quickshell-lockscreen-editor-shortcuts.sh
      - name: Lockscreen regression suite
        run: |
          for test in tests/test-quickshell-lockscreen-*.sh; do
            echo "=== $test ==="
            bash "$test"
          done
          node tests/test-quickshell-lockscreen-efficiency.mjs
          bash tests/test-lua-validation.sh
          bash tests/test-quickshell-production-readiness.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_editor_save.sh
          git diff --check
      - name: Commit fix and remove temporary validation tooling
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add config/quickshell/awtarchy/LockscreenEditor.qml local/share/awtarchy/quickshell-managed-history.sha256 tests/test-quickshell-lockscreen-editor-shortcuts.sh
          git rm .github/scripts/feature-lockscreen-editor-shortcuts-fix.py .github/workflows/feature-lockscreen-editor-shortcuts.yml
          git commit -m 'Fix lockscreen editor save and cancel shortcuts'
          git push origin HEAD:feature/lockscreen-media-editor-polish
