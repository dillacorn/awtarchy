name: Apply Lockscreen Task 7 Managed History

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - '.github/workflows/apply-lockscreen-task7-managed-history.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Append verified Task 7 managed hashes and remove helper
        shell: bash
        run: |
          set -euo pipefail

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          picker='config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh'
          quick_settings='config/quickshell/awtarchy/QuickSettings.qml'
          expected_picker='85ca4b74f7a4e9c157c1a3aa5705d208b1c3b80d79e1552a58388fb740359b17'
          expected_quick_settings='35d02b16778ab7946d944b614e709617c74c338bf763c0238c115c0c01277379'

          actual_picker="$(sha256sum "$picker" | awk '{print $1}')"
          actual_quick_settings="$(sha256sum "$quick_settings" | awk '{print $1}')"
          [[ "$actual_picker" == "$expected_picker" ]]
          [[ "$actual_quick_settings" == "$expected_quick_settings" ]]

          picker_entry="${actual_picker}"$'\t''.config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh'
          quick_settings_entry="${actual_quick_settings}"$'\t''.config/quickshell/awtarchy/QuickSettings.qml'

          if ! grep -Fxq -- "$picker_entry" "$history" || ! grep -Fxq -- "$quick_settings_entry" "$history"; then
            printf '\n# 2026-09-12 exact Awtwall targeting and lockscreen header actions.\n' >>"$history"
            grep -Fxq -- "$picker_entry" "$history" || printf '%s\n' "$picker_entry" >>"$history"
            grep -Fxq -- "$quick_settings_entry" "$history" || printf '%s\n' "$quick_settings_entry" >>"$history"
          fi

          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          rm -- .github/workflows/apply-lockscreen-task7-managed-history.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$history" .github/workflows/apply-lockscreen-task7-managed-history.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Record lockscreen Task 7 managed hashes'
          git push origin HEAD:feature/lockscreen-interactive-effects
