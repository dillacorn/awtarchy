name: Feature lockscreen profile editor polish

on:
  push:
    branches: [feature/lockscreen-media-editor-polish]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq lua5.4

      - name: Append current managed hashes
        run: |
          set -euo pipefail
          history=local/share/awtarchy/quickshell-managed-history.sha256
          printf '\n# 2026-09-17 lockscreen profile presets and synchronization.\n' >> "$history"
          while IFS='|' read -r source target; do
            hash="$(sha256sum "$source" | awk '{print $1}')"
            entry="${hash}"$'\t'"${target}"
            grep -Fqx -- "$entry" "$history" || printf '%s\n' "$entry" >> "$history"
          done <<'EOF'
          config/quickshell/awtarchy/LockscreenPresentationState.js|.config/quickshell/awtarchy/LockscreenPresentationState.js
          config/quickshell/awtarchy-lock/LockscreenPresentationState.js|.config/quickshell/awtarchy-lock/LockscreenPresentationState.js
          config/hypr/scripts/quickshell_application_state.sh|.config/hypr/scripts/quickshell_application_state.sh
          config/hypr/scripts/quickshell_lockscreen_editor_save.sh|.config/hypr/scripts/quickshell_lockscreen_editor_save.sh
          config/quickshell/awtarchy/BarState.qml|.config/quickshell/awtarchy/BarState.qml
          config/quickshell/awtarchy/LockscreenEditor.qml|.config/quickshell/awtarchy/LockscreenEditor.qml
          EOF

      - name: Complete focused verification
        run: |
          set -euo pipefail
          for test in tests/test-quickshell-lockscreen-*.sh; do
            echo "=== $test ==="
            bash "$test"
          done
          node tests/test-quickshell-lockscreen-efficiency.mjs
          node tests/test-quickshell-lockscreen-monitor-profile-resolver.mjs
          bash tests/test-lua-validation.sh
          bash tests/test-quickshell-production-readiness.sh
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_editor_save.sh
          git diff --check

      - name: Remove temporary validation tooling
        run: |
          set -euo pipefail
          rm -f -- \
            .github/scripts/feature-lockscreen-profile-editor-task1.py \
            .github/scripts/feature-lockscreen-profile-editor-task2.py \
            .github/scripts/feature-lockscreen-profile-editor-task3.py \
            .github/scripts/feature-lockscreen-profile-editor-task4.py \
            .github/scripts/feature-lockscreen-profile-editor-task5.py \
            .github/workflows/feature-lockscreen-profile-editor-polish.yml
          test -z "$(find .github/scripts .github/workflows -maxdepth 1 -type f -name 'feature-lockscreen-profile-editor-*' -print -quit)"

      - name: Permanent contracts after cleanup
        run: |
          set -euo pipefail
          bash tests/test-quickshell-lockscreen-saved-profiles.sh
          bash tests/test-quickshell-lockscreen-profile-mode-switch.sh
          bash tests/test-quickshell-lockscreen-shared-preview-settle.sh
          bash tests/test-quickshell-lockscreen-multimonitor-editor.sh
          bash tests/test-quickshell-lockscreen-editor-shortcuts.sh
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          node tests/test-quickshell-lockscreen-monitor-profile-resolver.mjs
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_editor_save.sh
          git diff --check

      - name: Commit final candidate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached --quiet || {
            git commit -m "Finalize lockscreen profile editor polish"
            git push origin HEAD:feature/lockscreen-media-editor-polish
          }
