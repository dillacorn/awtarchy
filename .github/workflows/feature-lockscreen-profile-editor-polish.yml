name: Feature lockscreen profile editor polish

on:
  push:
    branches: [feature/lockscreen-media-editor-polish]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Apply Task 1 patch
        run: python3 .github/scripts/feature-lockscreen-profile-editor-task1.py
      - name: Task 1 GREEN
        run: |
          node tests/test-quickshell-lockscreen-monitor-profile-resolver.mjs
          bash tests/test-quickshell-lockscreen-profile-save-parity.sh
          bash -n config/hypr/scripts/quickshell_application_state.sh
          git diff --check
      - name: Commit Task 1 production changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add config/quickshell/awtarchy/LockscreenPresentationState.js \
                  config/quickshell/awtarchy-lock/LockscreenPresentationState.js \
                  config/hypr/scripts/quickshell_application_state.sh
          git diff --cached --quiet || {
            git commit -m "Fix lockscreen profile save parity"
            git push origin HEAD:feature/lockscreen-media-editor-polish
          }
      - name: Task 2 RED
        run: bash tests/test-quickshell-lockscreen-shared-preview-settle.sh
