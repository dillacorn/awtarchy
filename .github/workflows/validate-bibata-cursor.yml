name: Validate Bibata Cursor

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Validate Bibata cursor migration
        run: |
          bash -n config/hypr/scripts/quickshell_cursor_theme.sh
          bash -n tests/test-bibata-cursor-migration.sh
          bash -n tests/test-bibata-cursor-options.sh
          bash tests/test-bibata-cursor-migration.sh
          bash tests/test-bibata-cursor-options.sh

  patch-approved-lockscreen-blur:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci(lockscreen): trigger approved blur patcher' }}"
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Guard exact parent state
        run: |
          test "$(git rev-parse HEAD^)" = "48f2ecda6186d0e49bffd0ab91ccb4e1d5183e74"
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Apply approved blur implementation
        run: python3 .github/scripts/patch_lockscreen_blur_approved.py
      - name: Validate focused blur behavior
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          bash tests/test-quickshell-lockscreen-blur-iris-editor-controls.sh
          git diff --check
      - name: Commit approved production change
        run: |
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add \
            config/hypr/scripts/quickshell_application_state.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy-lock/shell.qml
          git commit -m 'fix(lockscreen): strengthen composition blur'
          git push origin HEAD:feature/lockscreen-interactive-effects
