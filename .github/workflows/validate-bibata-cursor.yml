name: Validate Bibata Cursor

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Validate Bibata cursor migration
        run: |
          bash -n config/hypr/scripts/quickshell_cursor_theme.sh
          bash -n tests/test-bibata-cursor-migration.sh
          bash -n tests/test-bibata-cursor-options.sh
          bash tests/test-bibata-cursor-migration.sh
          bash tests/test-bibata-cursor-options.sh

  patch-approved-lockscreen-two-snapshot:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci(lockscreen): retry two-snapshot production patcher 3' }}"
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Guard exact parent state
        run: |
          test "$(git rev-parse HEAD^)" = "e5fa4da8443af8046114d1b920f44e941ec7b7e5"
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Apply approved two-snapshot implementation
        run: python3 .github/scripts/patch_lockscreen_two_snapshot.py
      - name: Validate focused capture behavior
        run: |
          bash -n config/hypr/scripts/quickshell_lockscreen_capture.sh
          bash -n config/hypr/scripts/quickshell_power_menu.sh
          shellcheck config/hypr/scripts/quickshell_lockscreen_capture.sh
          shellcheck config/hypr/scripts/quickshell_power_menu.sh
          bash tests/test-quickshell-lockscreen-capture.sh
          bash tests/test-quickshell-lockscreen-transition-layer.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check
      - name: Commit approved production change
        run: |
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add \
            config/quickshell/awtarchy/shell.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/PowerMenu.qml \
            config/quickshell/awtarchy-lock/LockSurface.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'fix(lockscreen): complete two-snapshot power transition'
          git push origin HEAD:feature/lockscreen-interactive-effects
