name: Temporary Register PowerMenu Hash

on:
  push:
    branches: [fix/power-menu-lock-reopen-flash]

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/power-menu-lock-reopen-flash
      - name: Register managed hash
        shell: bash
        run: |
          set -euo pipefail
          file='local/share/awtarchy/quickshell-managed-history.sha256'
          hash='7ec3ff9a688eeb5f13ee0b5bf06da0688b54d116b5df887140945264dbe960c4'
          path='.config/quickshell/awtarchy/PowerMenu.qml'
          entry="${hash}	${path}"
          if ! grep -Fqx -- "$entry" "$file"; then
            printf '\n# 2026-09-15 keep Power Menu hidden after committed lock handoff.\n%s\n' "$entry" >> "$file"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$file"
          if ! git diff --cached --quiet; then
            git commit -m 'chore: register PowerMenu lock handoff hash'
            git push origin HEAD:fix/power-menu-lock-reopen-flash
          fi
