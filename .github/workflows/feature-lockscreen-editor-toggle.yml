name: Feature lockscreen editor toggle

on:
  push:
    branches: [feature/lockscreen-media-editor-polish]

permissions:
  contents: write

jobs:
  toggle-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Apply monitor profile resolver
        run: python3 .github/scripts/feature-lockscreen-monitor-profile-task2.py
      - name: Profile resolver regression
        run: |
          node tests/test-quickshell-lockscreen-monitor-profile-resolver.mjs
          cmp -s config/quickshell/awtarchy/LockscreenPresentationState.js config/quickshell/awtarchy-lock/LockscreenPresentationState.js
      - name: Apply monitor profile persistence
        run: |
          python3 .github/scripts/feature-lockscreen-monitor-profile-task3-fix.py
          python3 .github/scripts/feature-lockscreen-monitor-profile-task3.py
      - name: Monitor profile state regression
        run: bash tests/test-quickshell-lockscreen-monitor-profile-state.sh
      - name: Apply multi-monitor editor session
        run: |
          python3 .github/scripts/feature-lockscreen-monitor-profile-task4-fix.py
          python3 .github/scripts/feature-lockscreen-monitor-profile-task4.py
      - name: Multi-monitor editor regression
        run: bash tests/test-quickshell-lockscreen-multimonitor-editor.sh
      - name: Apply per-monitor contrast
        run: python3 .github/scripts/feature-lockscreen-monitor-profile-task5.py
      - name: Monitor contrast regression
        run: bash tests/test-quickshell-lockscreen-monitor-contrast.sh
      - name: Apply per-monitor weather and timezones
        run: python3 .github/scripts/feature-lockscreen-monitor-profile-task6.py
      - name: Monitor weather regression
        run: bash tests/test-quickshell-lockscreen-monitor-weather.sh
      - name: Verify weather, contrast, and existing contracts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          bash tests/test-quickshell-lockscreen-animated-contrast.sh
          bash tests/test-quickshell-lockscreen-runtime-polish.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-background-save-dispatch.sh
          bash tests/test-quickshell-lockscreen-weather.sh
          bash tests/test-quickshell-lockscreen-weather-units.sh
          bash tests/test-quickshell-lockscreen-timezones-text.sh
          bash tests/test-quickshell-lockscreen-editor-shortcuts.sh
          bash tests/test-quickshell-lockscreen-media-editor-polish.sh
          bash tests/test-quickshell-lockscreen-media-preroll.sh
          bash tests/test-quickshell-lockscreen-selector-flyout.sh
          bash tests/test-lua-validation.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_weather.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_timezones.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_contrast.sh
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_editor_save.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_editor.sh
          git diff --check
      - name: Commit per-monitor weather production patch
        run: |
          if git diff --quiet -- config/hypr/scripts/quickshell_lockscreen_weather.sh config/quickshell/awtarchy/LockscreenWeather.qml config/quickshell/awtarchy/LockscreenEditor.qml config/quickshell/awtarchy-lock/LockWeatherCache.qml config/quickshell/awtarchy-lock/LockSurface.qml config/quickshell/awtarchy-lock/shell.qml; then
            echo "Per-monitor weather/timezone patch already present."
            exit 0
          fi
          git config user.name "dillacorn"
          git config user.email "28743863+dillacorn@users.noreply.github.com"
          git add config/hypr/scripts/quickshell_lockscreen_weather.sh config/quickshell/awtarchy/LockscreenWeather.qml config/quickshell/awtarchy/LockscreenEditor.qml config/quickshell/awtarchy-lock/LockWeatherCache.qml config/quickshell/awtarchy-lock/LockSurface.qml config/quickshell/awtarchy-lock/shell.qml
          git commit -m "Scope lockscreen weather and clocks per monitor"
          git push origin HEAD:feature/lockscreen-media-editor-polish
