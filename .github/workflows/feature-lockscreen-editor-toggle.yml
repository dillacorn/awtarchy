name: Feature lockscreen editor toggle

on:
  push:
    branches: [feature/lockscreen-media-editor-polish]

permissions:
  contents: write

jobs:
  toggle-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Profile resolver regression
        run: node tests/test-quickshell-lockscreen-monitor-profile-resolver.mjs
      - name: Apply toggle and noalt patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shell = Path("config/quickshell/awtarchy/shell.qml")
          text = shell.read_text(encoding="utf-8")
          old = '        function openLockscreenEditor(): void { LockscreenEditor.openFocused(); }'
          new = '        function toggleLockscreenEditor(): void { if (LockscreenEditor.open) LockscreenEditor.close(); else LockscreenEditor.openFocused(); }'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("shell IPC anchor missing")
          shell.write_text(text, encoding="utf-8")

          launcher = Path("config/hypr/scripts/quickshell_lockscreen_editor.sh")
          text = launcher.read_text(encoding="utf-8")
          text = text.replace("# Open the native Awtarchy lockscreen layout editor.", "# Toggle the native Awtarchy lockscreen layout editor.", 1)
          old = "exec qs -c awtarchy ipc call control openLockscreenEditor"
          new = "exec qs -c awtarchy ipc call control toggleLockscreenEditor"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("editor launcher IPC anchor missing")
          launcher.write_text(text, encoding="utf-8")

          hypr = Path("config/hypr/hyprland.lua")
          text = hypr.read_text(encoding="utf-8")
          bind = '    hl.bind("SUPER + ALT + e", hl.dsp.exec_cmd(lockscreen_editor), {})'
          if text.count(bind) == 0:
              anchor = '    hl.bind("SUPER + ALT + backspace", hl.dsp.exec_cmd(hypr_quicksettings), {})\n'
              if anchor not in text:
                  raise SystemExit("noalt brightness anchor missing")
              text = text.replace(anchor, anchor + bind + "\n", 1)
          elif text.count(bind) > 1:
              raise SystemExit("unexpected duplicate noalt editor bind")
          hypr.write_text(text, encoding="utf-8")
          PY
      - name: Verify toggle and transition contracts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          bash tests/test-quickshell-lockscreen-editor-shortcuts.sh
          bash tests/test-quickshell-lockscreen-media-editor-polish.sh
          bash tests/test-quickshell-lockscreen-media-preroll.sh
          bash tests/test-lua-validation.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_editor.sh
          git diff --check
      - name: Commit production patch
        run: |
          if git diff --quiet -- config/quickshell/awtarchy/shell.qml config/hypr/scripts/quickshell_lockscreen_editor.sh config/hypr/hyprland.lua; then
            echo "Production toggle patch already present."
            exit 0
          fi
          git config user.name "dillacorn"
          git config user.email "28743863+dillacorn@users.noreply.github.com"
          git add config/quickshell/awtarchy/shell.qml config/hypr/scripts/quickshell_lockscreen_editor.sh config/hypr/hyprland.lua
          git commit -m "Toggle lockscreen editor shortcut"
          git push origin HEAD:feature/lockscreen-media-editor-polish
