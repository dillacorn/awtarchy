name: Feature lockscreen final validation

on:
  push:
    branches: [feature/lockscreen-media-editor-polish]

permissions:
  contents: write

jobs:
  final-lockscreen-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Migrate profile-aware legacy contracts
        run: python3 .github/scripts/feature-lockscreen-monitor-profile-task8-testfix.py
      - name: Prove managed-history RED
        run: |
          python3 .github/scripts/feature-lockscreen-monitor-profile-task8.py coverage
          if bash tests/test-quickshell-lockscreen-interactive-managed-history.sh > /tmp/managed-red.log 2>&1; then
            cat /tmp/managed-red.log
            echo "Managed-history regression unexpectedly passed before hash refresh." >&2
            exit 1
          fi
          cat /tmp/managed-red.log
      - name: Refresh managed history
        run: |
          python3 .github/scripts/feature-lockscreen-monitor-profile-task8.py history
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
      - name: Remove temporary feature tooling from final tree
        run: |
          git rm -f .github/workflows/feature-lockscreen-editor-toggle.yml
          git rm -f .github/scripts/feature-lockscreen-monitor-profile-task*.py
      - name: Complete focused lockscreen validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          for test in tests/test-quickshell-lockscreen-*.sh; do
            echo "=== $test ==="
            bash "$test"
          done
          node tests/test-quickshell-lockscreen-efficiency.mjs
          node tests/test-quickshell-lockscreen-monitor-profile-resolver.mjs
          bash tests/test-lua-validation.sh
          bash tests/test-quickshell-production-readiness.sh
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_editor_save.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_contrast.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_weather.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_editor.sh
          git diff --check
      - name: Commit final feature tree
        run: |
          git config user.name "dillacorn"
          git config user.email "28743863+dillacorn@users.noreply.github.com"
          git add tests/test-quickshell-lockscreen-interactive-managed-history.sh tests/test-quickshell-lockscreen-animation-preference.sh local/share/awtarchy/quickshell-managed-history.sha256
          git add -u .github
          git diff --cached --check
          git commit -m "Finalize lockscreen multi-monitor editor"
          git push origin HEAD:feature/lockscreen-media-editor-polish
