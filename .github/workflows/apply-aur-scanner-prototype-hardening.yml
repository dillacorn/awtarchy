name: Apply aur-scanner prototype hardening

on:
  push:
    branches:
      - feature/aur-scanner-single-auth-prototype

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply aur-scanner prototype hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Harden generator and workflow contracts
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('tools/aur-scanner-single-auth-prototype.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'use std::fs::{self, File, OpenOptions};',
              'use std::fs::{self, OpenOptions};',
              1,
          )
          old = '''fn pacman_stdio(command: &mut Command) -> Result<()> {
              let terminal = OpenOptions::new()
          '''
          new = '''fn pacman_stdio(command: &mut Command) -> Result<()> {
              command.stdin(Stdio::null());
              let terminal = OpenOptions::new()
          '''
          if old not in text:
              raise SystemExit('pacman_stdio marker missing')
          text = text.replace(old, new, 1)

          old = '''fn package_paths_from_packagelist(output: &[u8], base_dir: &Path) -> Result<Vec<PathBuf>> {
              let text = std::str::from_utf8(output).context("makepkg --packagelist returned non-UTF-8 output")?;
              let mut paths = Vec::new();
          '''
          new = '''fn package_paths_from_packagelist(output: &[u8], base_dir: &Path) -> Result<Vec<PathBuf>> {
              let canonical_base = fs::canonicalize(base_dir)
                  .with_context(|| format!("canonicalizing scanned base directory {}", base_dir.display()))?;
              let text = std::str::from_utf8(output).context("makepkg --packagelist returned non-UTF-8 output")?;
              let mut paths = Vec::new();
          '''
          if old not in text:
              raise SystemExit('packagelist function marker missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              'if !canonical_parent.starts_with(base_dir) {',
              'if !canonical_parent.starts_with(&canonical_base) {',
              1,
          )
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/validate-aur-scanner-single-auth-prototype.yml')
          wf = workflow.read_text(encoding='utf-8')
          marker = '''          grep -F -- '--packagelist' <<<"$diff" >/dev/null \\
            || { printf '%s\\n' 'prototype does not enumerate build artifacts explicitly' >&2; exit 1; }
          '''
          replacement = marker + '''          grep -F 'command.stdin(Stdio::null())' <<<"$diff" >/dev/null \\
            || { printf '%s\\n' 'pacman broker command does not isolate protocol stdin' >&2; exit 1; }
          grep -F 'canonical_base' <<<"$diff" >/dev/null \\
            || { printf '%s\\n' 'package artifact validation does not canonicalize the approved base' >&2; exit 1; }
          '''
          if marker not in wf:
              raise SystemExit('workflow safety marker missing')
          wf = wf.replace(marker, replacement, 1)
          workflow.write_text(wf, encoding='utf-8')
          PY

          python3 -m py_compile tools/aur-scanner-single-auth-prototype.py
          git diff --check
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add tools/aur-scanner-single-auth-prototype.py .github/workflows/validate-aur-scanner-single-auth-prototype.yml
          git commit -m 'Harden aur-scanner broker prototype'
          git push origin HEAD:feature/aur-scanner-single-auth-prototype
