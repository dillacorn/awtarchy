name: Lockscreen Latency History Patcher

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-history:
    if: github.event.pull_request.head.ref == 'feature/lockscreen-interactive-effects' && github.event.pull_request.head.sha == 'bf53e70c89071ced1f379de047ab03c8c62f9cf0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Append exact managed-history hash
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          entry=$'f003ed9f8d2f0bfb2481c2569a6ad3b8309c067166219d13a282c832e569b58d\t.config/quickshell/awtarchy-lock/LockSurface.qml'
          if ! grep -Fxq -- "$entry" "$history"; then
            printf '\n%s\n%s\n' \
              '# Lockscreen interaction response and secure capture latency optimization.' \
              "$entry" >>"$history"
          fi
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check
      - name: Commit history and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/lockscreen-latency-history-patcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/share/awtarchy/quickshell-managed-history.sha256 \
                  .github/workflows/lockscreen-latency-history-patcher.yml
          git commit -m 'chore(lockscreen): record latency optimization hash'
          git push origin HEAD:feature/lockscreen-interactive-effects
