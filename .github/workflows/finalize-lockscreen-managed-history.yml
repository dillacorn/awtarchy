name: Finalize Lockscreen Managed History

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Restore updater test and append exact stock hashes
        shell: bash
        run: |
          set -euo pipefail

          git show 47bd987ac0b7703a1167f6c993e15a1befc11d8d:tests/test-quickshell-updater-migration.sh \
            > tests/test-quickshell-updater-migration.sh
          chmod 0755 tests/test-quickshell-updater-migration.sh

          manifest='local/share/awtarchy/quickshell-managed-history.sha256'
          entries=(
            $'6672439222a06f006e49d6dfc47e2f4bb12a5f8e597c6a8bf0d67afdc783d393\t.config/quickshell/awtarchy-lock/LockScene.qml'
            $'2fa4167134123e882b0b948a443b3f944859cec803cd37c574e9201a5b887a5e\t.config/quickshell/awtarchy-lock/LockSurface.qml'
            $'2ad70576b915d838856d6d5e4358d3abaf72b1fff70724909d4d679d588a3aa2\t.config/quickshell/awtarchy-lock/shell.qml'
            $'6672439222a06f006e49d6dfc47e2f4bb12a5f8e597c6a8bf0d67afdc783d393\t.config/quickshell/awtarchy/LockPreviewScene.qml'
            $'14614b307f1ee61d92935508606bdb4d47e0cb4c0625e5a5cb4ec1b69ba1d66f\t.config/quickshell/awtarchy/LockscreenCompactSelector.qml'
            $'895a98fc33511fc3a96ed987fe24c142adf7f572d0822ffcf89052c03dae8727\t.config/quickshell/awtarchy/LockscreenEditor.qml'
          )

          missing=0
          for entry in "${entries[@]}"; do
            if ! grep -Fqx -- "$entry" "$manifest"; then
              missing=1
              break
            fi
          done

          if (( missing == 1 )); then
            printf '\n# 2026-09-13 lockscreen presentation sequencing and editor controls stock hashes.\n' >> "$manifest"
            for entry in "${entries[@]}"; do
              grep -Fqx -- "$entry" "$manifest" || printf '%s\n' "$entry" >> "$manifest"
            done
          fi

          for entry in "${entries[@]}"; do
            grep -Fqx -- "$entry" "$manifest"
          done
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml
          bash -n tests/test-quickshell-updater-migration.sh

          rm -- .github/workflows/finalize-lockscreen-managed-history.yml
          git add -A
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(updater): record current lockscreen stock hashes'
          git push origin HEAD:feature/lockscreen-interactive-effects
