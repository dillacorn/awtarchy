name: Validate Stable Release Notes

on:
  pull_request:
    paths:
      - AGENTS.md
      - README.md
      - INSTALL.md
      - UPDATING.md
      - .github/scripts/validate-stable-release-notes.py
      - .github/workflows/validate-stable-release-notes.yml
      - tests/test-stable-release-notes-validator.sh
      - tests/test-install-update-docs.sh
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - README.md
      - INSTALL.md
      - UPDATING.md
      - .github/scripts/validate-stable-release-notes.py
      - .github/workflows/validate-stable-release-notes.yml
      - tests/test-stable-release-notes-validator.sh
      - tests/test-install-update-docs.sh

permissions:
  contents: read

jobs:
  release-notes-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Bash syntax
        run: |
          bash -n tests/test-stable-release-notes-validator.sh
          bash -n tests/test-install-update-docs.sh
      - name: Stable release notes contract
        run: bash tests/test-stable-release-notes-validator.sh
      - name: Canonical installation and update docs
        run: bash tests/test-install-update-docs.sh

  publish-v3-7-2:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.title == 'release: publish v3.7.2 bridge' &&
      github.head_ref == 'release/v3.7.2-bridge' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: e6d5c8ab31b0629491dfaab90604a3029d1be128
      RELEASE_TAG: v3.7.2
      PREVIOUS_TAG: v3.7.1
      RELEASE_TITLE: Awtarchy v3.7.2 Quickshell
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Verify release target and state
        run: |
          set -Eeuo pipefail
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$main_sha" == "$EXPECTED_SHA" ]] || {
            printf 'main moved: expected %s, got %s\n' "$EXPECTED_SHA" "$main_sha" >&2
            exit 1
          }
          latest_stable="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
          [[ "$latest_stable" == "$PREVIOUS_TAG" ]] || {
            printf 'latest stable changed: expected %s, got %s\n' "$PREVIOUS_TAG" "$latest_stable" >&2
            exit 1
          }
          ! gh release view "$RELEASE_TAG" >/dev/null 2>&1 || {
            printf 'release %s already exists\n' "$RELEASE_TAG" >&2
            exit 1
          }
          [[ -z "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" ]] || {
            printf 'tag %s already exists\n' "$RELEASE_TAG" >&2
            exit 1
          }
      - name: Validate proposed stable release notes
        run: |
          set -Eeuo pipefail
          printf '%s' '' | base64 -d > /tmp/proposed-release.md
          gh release view "$PREVIOUS_TAG" --json body --jq .body > /tmp/previous-release.md
          python3 .github/scripts/validate-stable-release-notes.py             --version "$RELEASE_TAG"             --notes /tmp/proposed-release.md             --previous /tmp/previous-release.md
      - name: Publish stable release
        run: |
          set -Eeuo pipefail
          gh release create "$RELEASE_TAG"             --target "$EXPECTED_SHA"             --title "$RELEASE_TITLE"             --notes-file /tmp/proposed-release.md
      - name: Verify published release and notes
        run: |
          set -Eeuo pipefail
          gh release view "$RELEASE_TAG" --json body --jq .body > /tmp/published-release.md
          python3 .github/scripts/validate-stable-release-notes.py             --version "$RELEASE_TAG"             --notes /tmp/published-release.md             --previous /tmp/previous-release.md

          gh release view "$RELEASE_TAG"             --json tagName,name,isDraft,isPrerelease,targetCommitish             --jq '{tagName,name,isDraft,isPrerelease,targetCommitish}'

          tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.type)"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          if [[ "$tag_type" == "tag" ]]; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .object.sha)"
          fi
          [[ "$tag_sha" == "$EXPECTED_SHA" ]] || {
            printf 'tag target mismatch: expected %s, got %s\n' "$EXPECTED_SHA" "$tag_sha" >&2
            exit 1
          }

          release_name="$(gh release view "$RELEASE_TAG" --json name --jq .name)"
          release_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          release_prerelease="$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)"
          release_target="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)"
          [[ "$release_name" == "$RELEASE_TITLE" ]]
          [[ "$release_draft" == "false" ]]
          [[ "$release_prerelease" == "false" ]]
          [[ "$release_target" == "$EXPECTED_SHA" ]]
      - name: Remove one-use helper branch
        if: success()
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release/v3.7.2-bridge"
