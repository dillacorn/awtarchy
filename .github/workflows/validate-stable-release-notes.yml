name: Validate Stable Release Notes

on:
  pull_request:
    paths:
      - AGENTS.md
      - README.md
      - INSTALL.md
      - UPDATING.md
      - .github/scripts/validate-stable-release-notes.py
      - .github/workflows/validate-stable-release-notes.yml
      - tests/test-stable-release-notes-validator.sh
      - tests/test-install-update-docs.sh
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - README.md
      - INSTALL.md
      - UPDATING.md
      - .github/scripts/validate-stable-release-notes.py
      - .github/workflows/validate-stable-release-notes.yml
      - tests/test-stable-release-notes-validator.sh
      - tests/test-install-update-docs.sh

permissions:
  contents: read

jobs:
  release-notes-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Bash syntax
        run: |
          bash -n tests/test-stable-release-notes-validator.sh
          bash -n tests/test-install-update-docs.sh
      - name: Stable release notes contract
        run: bash tests/test-stable-release-notes-validator.sh
      - name: Canonical installation and update docs
        run: bash tests/test-install-update-docs.sh

  v380-post-release-yazi-drag-bridge:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 235 && github.event.pull_request.title == 'Temporary v3.8.0 release notes bridge' && github.event.pull_request.head.ref == 'chore/v380-post-release-yazi-drag-bridge' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Verify existing v3.8.0 release update and remove bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag='v3.8.0'
          title='Awtarchy v3.8.0 Yazi'
          release_target='46eadde776a4d881507545968a69ef3cb5e2906e'
          expected_main='a8fdea169a03afc794887c51fd0af90107af9452'
          branch='chore/v380-post-release-yazi-drag-bridge'
          published="$RUNNER_TEMP/v380-release-published.md"
          previous="$RUNNER_TEMP/v374-release-previous.md"
          metadata="$RUNNER_TEMP/v380-release-metadata.json"

          gh release view "$tag" --json name,tagName,targetCommitish,isDraft,isPrerelease >"$metadata"
          gh release view "$tag" --json body --jq '.body' >"$published"
          gh release view v3.7.4 --json body --jq '.body' >"$previous"

          python3 - "$metadata" "$published" <<'PY'
          from pathlib import Path
          import json
          import sys

          metadata = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          body = Path(sys.argv[2]).read_text(encoding="utf-8")

          expected = {
              "name": "Awtarchy v3.8.0 Yazi",
              "tagName": "v3.8.0",
              "targetCommitish": "46eadde776a4d881507545968a69ef3cb5e2906e",
              "isDraft": False,
              "isPrerelease": False,
          }
          if metadata != expected:
              raise SystemExit(f"unexpected v3.8.0 release metadata: {metadata!r}")

          placeholder = "_Placeholder for possible tested post-release patches to v3.8.0._"
          entry = (
              "- **2026-09-24 — Yazi outbound drag:** Adds explicit outbound drag through "
              "`d g` and right-click **Drag out...** using a compact `ripdrag` surface. "
              "Stable `ripdrag` is now a required AUR feature dependency delivered by fresh "
              "installation, `awtarchy packages`, stable updates, and Git-testing updates. "
              "Managed Yazi configuration updates no longer require Yazi to be closed; they "
              "finish normally and print a restart notice when Yazi files changed. Maintainer "
              "runtime testing confirmed outbound drag/drop works on Awtarchy. Delivered from "
              "post-release `main` commit "
              "`a8fdea169a03afc794887c51fd0af90107af9452`; the v3.8.0 tag remains unchanged."
          )
          if body.count(entry) != 1:
              raise SystemExit("expected exactly one tested v3.8.0 Yazi outbound-drag post-release entry")
          if body.count(placeholder) != 1:
              raise SystemExit("expected exactly one v3.8.0 post-release placeholder")
          PY

          tag_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')"
          if [[ "$tag_sha" != "$release_target" ]]; then
            printf 'Unexpected %s tag SHA: %s\n' "$tag" "$tag_sha" >&2
            exit 1
          fi

          main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ "$main_sha" != "$expected_main" ]]; then
            printf 'Unexpected main SHA during release verification: %s\n' "$main_sha" >&2
            exit 1
          fi

          python3 .github/scripts/validate-stable-release-notes.py \
            --version "$tag" \
            --title "$title" \
            --notes "$published" \
            --previous "$previous"

          printf 'Verified %s release notes and unchanged tag SHA %s.\n' "$tag" "$tag_sha"

          gh pr close 235 --repo dillacorn/awtarchy --comment 'v3.8.0 post-release notes verified. Closing this temporary bridge without merge.'
          git push origin --delete "$branch"
