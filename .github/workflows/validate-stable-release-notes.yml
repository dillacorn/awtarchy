name: Validate Stable Release Notes

on:
  pull_request:
    paths:
      - AGENTS.md
      - README.md
      - INSTALL.md
      - UPDATING.md
      - .github/scripts/validate-stable-release-notes.py
      - .github/workflows/validate-stable-release-notes.yml
      - tests/test-stable-release-notes-validator.sh
      - tests/test-install-update-docs.sh
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - README.md
      - INSTALL.md
      - UPDATING.md
      - .github/scripts/validate-stable-release-notes.py
      - .github/workflows/validate-stable-release-notes.yml
      - tests/test-stable-release-notes-validator.sh
      - tests/test-install-update-docs.sh

permissions:
  contents: read

jobs:
  release-notes-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Bash syntax
        run: |
          bash -n tests/test-stable-release-notes-validator.sh
          bash -n tests/test-install-update-docs.sh
      - name: Stable release notes contract
        run: bash tests/test-stable-release-notes-validator.sh
      - name: Canonical installation and update docs
        run: bash tests/test-install-update-docs.sh

  replace-v4-1-3:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize') &&
      github.head_ref == 'release/v4.1.3-replace-oneuse-20261030' &&
      github.event.pull_request.title == 'Awtarchy v4.1.3 one-use corrected release replacement' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: awtarchy-v4-1-3-replace-one-use
      cancel-in-progress: false
    steps:
      - name: Checkout exact fixed main commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: e6d8be16a0e370c5b52e4b1669f3abe14190f133
          fetch-depth: 0
          persist-credentials: false
      - name: Validate, replace, and revalidate published v4.1.3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="v4.1.3"
          expected="e6d8be16a0e370c5b52e4b1669f3abe14190f133"
          original="71fc4d2d1170b38acd2bceb51051c02bd3f8e7ef"
          original_release_id="428656873"
          title="Awtarchy v4.1.3 Hyprland 0.57"
          [[ "$(git rev-parse HEAD)" == "$expected" ]] || { echo "ERROR: checkout mismatch" >&2; exit 1; }
          [[ "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" == "$expected" ]] || { echo "ERROR: main changed" >&2; exit 1; }

          released="$(gh api "repos/$GH_REPO/releases/tags/$version")"
          printf '%s\n' "$released" | jq -e --arg id "$original_release_id" --arg commit "$original" --arg title "$title" '
            (.id|tostring) == $id and .target_commitish == $commit and .name == $title and (.draft == false) and (.prerelease == false)
          ' >/dev/null || { echo "ERROR: release is not the exact previous publication" >&2; exit 1; }
          [[ "$(gh api "repos/$GH_REPO/git/ref/tags/$version" --jq '.object.sha')" == "$original" ]] || { echo "ERROR: existing tag changed" >&2; exit 1; }

          work="$RUNNER_TEMP/awtarchy-v4.1.3-replacement"
          mkdir -p "$work"
          notes="$work/replacement.md"
          previous="$work/previous.md"
          stable_prev="$work/v4.1.2.md"
          published="$work/published.md"
          gh release view "$version" --repo "$GH_REPO" --json body --jq '.body' > "$previous"
          gh release view v4.1.2 --repo "$GH_REPO" --json body --jq '.body' > "$stable_prev"
          [[ -s "$previous" && -s "$stable_prev" ]] || { echo "ERROR: previous release notes missing" >&2; exit 1; }
          grep -Fq 'The deprecated `dwindle.special_scale_factor = 0.9` remains unchanged' "$previous" || { echo "ERROR: old release body changed" >&2; exit 1; }
          digest="$(sha256sum config/hypr/hyprland.lua | awk '{print $1}')"
          grep -Fqx "$(printf '%s\t.config/hypr/hyprland.lua' "$digest")" local/share/awtarchy/quickshell-managed-history.sha256 || { echo "ERROR: managed hash not in history" >&2; exit 1; }
          ! grep -Fq 'special_scale_factor = 0.9' config/hypr/hyprland.lua || { echo "ERROR: deprecated setting still active" >&2; exit 1; }

          cat > "$notes" <<'AWTARCHY_RELEASE_BODY'
          # Awtarchy v4.1.3 Hyprland 0.57

          Adds optional Hyprland 0.57 enhancements and updates the deprecated scratchpad scaling configuration.

          ## Install and update

          - [Installation guide](https://github.com/dillacorn/awtarchy/blob/main/INSTALL.md)
          - [Updating guide](https://github.com/dillacorn/awtarchy/blob/main/UPDATING.md)
          - Existing installations: `awtarchy update`.

          ## Hyprland 0.57

          - Eight manually enabled Lua examples: wobbly windows, motion blur, glow, alternative blur variants, proportional blur, cursor warping between monitors, focus-click swallowing, and tablet disabling. All remain commented out by default.
          - Replaces deprecated `dwindle.special_scale_factor = 0.9` with a workspace-specific `gaps_out` rule for the `special:magic` scratchpad.
          - Gaps approximate the previous 0.9 scaling at 1920x1080. Fixed pixel gaps may appear different on other monitor sizes.
          - Awtarchy already uses Lua, avoiding the removed legacy `.conf` support.
          - Version-sensitive `hyprpm` plugins may require compatible rebuilds after upgrading Hyprland.

          ## Validation

          - PRs #316 and #318 merged into the exact release target; the new managed configuration checksum matches.
          - PR #318: 27 of 28 checks passed. The only failure is the existing unrelated ShellCheck warning in `tests/test-usb-refresh-security.sh`.
          - Hyprland 0.57 live desktop and scratchpad appearance were not verified in CI.
          AWTARCHY_RELEASE_BODY

          python3 .github/scripts/validate-stable-release-notes.py --version "$version" --title "$title" --notes "$notes" --previous "$previous"
          python3 .github/scripts/validate-stable-release-notes.py --version "$version" --title "$title" --notes "$notes" --previous "$stable_prev"
          echo "PASS: all checks completed before replacing original release $original_release_id"

          # Explicitly authorized replacement of the incorrect published release and its old tag.
          gh release delete "$version" --repo "$GH_REPO" --yes --cleanup-tag
          if gh release view "$version" --repo "$GH_REPO" >/dev/null 2>&1; then echo "ERROR: old release still exists" >&2; exit 1; fi
          if gh api "repos/$GH_REPO/git/ref/tags/$version" >/dev/null 2>&1; then echo "ERROR: old tag still exists" >&2; exit 1; fi
          gh release create "$version" --repo "$GH_REPO" --target "$expected" --title "$title" --notes-file "$notes"

          meta="$(gh release view "$version" --repo "$GH_REPO" --json name,tagName,isDraft,isPrerelease,targetCommitish)"
          printf '%s\n' "$meta" | jq -e --arg version "$version" --arg title "$title" --arg expected "$expected" '
            .name == $title and .tagName == $version and (.isDraft == false) and (.isPrerelease == false) and .targetCommitish == $expected
          ' >/dev/null
          [[ "$(gh api "repos/$GH_REPO/git/ref/tags/$version" --jq '.object.sha')" == "$expected" ]] || { echo "ERROR: published tag commit mismatch" >&2; exit 1; }
          gh release view "$version" --repo "$GH_REPO" --json body --jq '.body' > "$published"
          [[ "$(cat "$published")" == "$(cat "$notes")" ]] || { echo "ERROR: published notes mismatch" >&2; exit 1; }
          python3 .github/scripts/validate-stable-release-notes.py --version "$version" --title "$title" --notes "$published" --previous "$previous"
          echo "PASS: corrected $version release republished at $expected"
