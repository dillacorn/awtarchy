name: Validate Stable Release Notes

on:
  pull_request:
    paths:
      - AGENTS.md
      - README.md
      - INSTALL.md
      - UPDATING.md
      - .github/scripts/validate-stable-release-notes.py
      - .github/workflows/validate-stable-release-notes.yml
      - tests/test-stable-release-notes-validator.sh
      - tests/test-install-update-docs.sh
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - README.md
      - INSTALL.md
      - UPDATING.md
      - .github/scripts/validate-stable-release-notes.py
      - .github/workflows/validate-stable-release-notes.yml
      - tests/test-stable-release-notes-validator.sh
      - tests/test-install-update-docs.sh

permissions:
  contents: read

jobs:
  release-notes-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Bash syntax
        run: |
          bash -n tests/test-stable-release-notes-validator.sh
          bash -n tests/test-install-update-docs.sh
      - name: Stable release notes contract
        run: bash tests/test-stable-release-notes-validator.sh
      - name: Canonical installation and update docs
        run: bash tests/test-install-update-docs.sh

  publish-v3-8-4:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.title == 'Publish Awtarchy v3.8.4' &&
      github.event.pull_request.head.ref == 'release/v3.8.4-bridge' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: v3.8.4
      RELEASE_TITLE: Awtarchy v3.8.4 Brightness and Volume Controls
      RELEASE_TARGET: a8f34b93310f5d1da53a2d5e11ad5ab0ea9c1f60
      PREVIOUS_STABLE: v3.8.3
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Validate and publish exact stable release
        shell: bash
        run: |
          set -Eeuo pipefail

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          [[ "$current_main" == "$RELEASE_TARGET" ]] || {
            printf 'main moved: expected %s, got %s\n' "$RELEASE_TARGET" "$current_main" >&2
            false
          }

          latest_stable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          [[ "$latest_stable" == "$PREVIOUS_STABLE" ]] || {
            printf 'latest stable changed: expected %s, got %s\n' "$PREVIOUS_STABLE" "$latest_stable" >&2
            false
          }

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'release %s already exists; refusing to recreate it\n' "$VERSION" >&2
            false
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            printf 'tag %s already exists; refusing to move or reuse it\n' "$VERSION" >&2
            false
          fi

          gh release view "$PREVIOUS_STABLE" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' \
            > /tmp/previous-stable-release.md
          printf '%s' '' | base64 --decode \
            > /tmp/proposed-release.md

          python3 .github/scripts/validate-stable-release-notes.py \
            --version "$VERSION" \
            --title "$RELEASE_TITLE" \
            --notes /tmp/proposed-release.md \
            --previous /tmp/previous-stable-release.md

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/proposed-release.md

          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' \
            > /tmp/published-release.md
          python3 .github/scripts/validate-stable-release-notes.py \
            --version "$VERSION" \
            --title "$RELEASE_TITLE" \
            --notes /tmp/published-release.md \
            --previous /tmp/previous-stable-release.md

          actual_title="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json name --jq '.name')"
          actual_draft="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          actual_prerelease="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
          actual_target="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
          actual_tag="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          resolved_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" --jq '.sha')"

          [[ "$actual_title" == "$RELEASE_TITLE" ]]
          [[ "$actual_draft" == "false" ]]
          [[ "$actual_prerelease" == "false" ]]
          [[ "$actual_target" == "$RELEASE_TARGET" ]]
          [[ "$actual_tag" == "$VERSION" ]]
          [[ "$resolved_tag_sha" == "$RELEASE_TARGET" ]]

          printf 'PASS: published %s at %s with validated notes and tag target\n' \
            "$VERSION" "$RELEASE_TARGET"
