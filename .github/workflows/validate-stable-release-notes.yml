name: Validate Stable Release Notes

on:
  pull_request:
    paths:
      - AGENTS.md
      - README.md
      - INSTALL.md
      - UPDATING.md
      - .github/scripts/validate-stable-release-notes.py
      - .github/workflows/validate-stable-release-notes.yml
      - tests/test-stable-release-notes-validator.sh
      - tests/test-install-update-docs.sh
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - README.md
      - INSTALL.md
      - UPDATING.md
      - .github/scripts/validate-stable-release-notes.py
      - .github/workflows/validate-stable-release-notes.yml
      - tests/test-stable-release-notes-validator.sh
      - tests/test-install-update-docs.sh

permissions:
  contents: read

jobs:
  release-notes-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Bash syntax
        run: |
          bash -n tests/test-stable-release-notes-validator.sh
          bash -n tests/test-install-update-docs.sh
      - name: Stable release notes contract
        run: bash tests/test-stable-release-notes-validator.sh
      - name: Canonical installation and update docs
        run: bash tests/test-install-update-docs.sh

  publish-v404-speedcrunch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.title == 'release: publish v4.0.4 SpeedCrunch (one-use)' &&
      github.event.pull_request.head.ref == 'automation/release-v4.0.4-speedcrunch-once' &&
      github.event.pull_request.head.repo.full_name == 'dillacorn/awtarchy' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out approved merged main
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: main
          persist-credentials: false
      - name: Validate and publish v4.0.4 SpeedCrunch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="0bd232d0640b2ff05675476ba7389220fe492e54"
          version="v4.0.4"
          title="Awtarchy v4.0.4 SpeedCrunch Fixes"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [[ "$main_sha" != "$expected" ]]; then
            printf "STOP: main moved from approved release commit (%s != %s)\n" "$main_sha" "$expected" >&2
            exit 1
          fi
          latest="$(gh release view --json tagName --jq .tagName)"
          if [[ "$latest" != "v4.0.3" ]]; then
            printf "STOP: latest stable release changed to %s\n" "$latest" >&2
            exit 1
          fi
          if gh release view "$version" --json tagName >/dev/null 2>&1; then
            echo "STOP: v4.0.4 release already exists" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "STOP: v4.0.4 tag already exists" >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/v4.0.4.md"
          previous="$RUNNER_TEMP/v4.0.3.md"
          published="$RUNNER_TEMP/v4.0.4-published.md"
          cat >"$notes" <<'RELEASE_NOTES'
          # Awtarchy v4.0.4 SpeedCrunch Fixes
          
          This patch release restores SpeedCrunch theme compatibility and its floating window behavior.
          
          ## Install and update
          
          - [Install](https://github.com/dillacorn/awtarchy/blob/main/INSTALL.md)
          - [Update](https://github.com/dillacorn/awtarchy/blob/main/UPDATING.md), or run `awtarchy update`.
          
          ## Fixes
          
          - Updated all nine bundled SpeedCrunch themes for the new theme format, including Catppuccin Frappé and Pip-Boy.
          - Restored floating and centered SpeedCrunch windows using its current Wayland application class.
          - Set the default SpeedCrunch floating size to **347 × 510 px**.
          - Automatically migrate older SpeedCrunch rules in preserved `hyprland.lua` files without overwriting unrelated user settings.
          
          ## Validation
          
          - [PR #302](https://github.com/dillacorn/awtarchy/pull/302) passed all 29 GitHub Actions checks, including SpeedCrunch migration and theme regression tests.
          - Manually verified SpeedCrunch theme switching, floating and centering, and the new launch size.
          RELEASE_NOTES
          gh release view v4.0.3 --json body --jq .body >"$previous"
          python3 .github/scripts/validate-stable-release-notes.py \
            --version "$version" --title "$title" --notes "$notes" --previous "$previous"
          gh release create "$version" --target "$expected" --title "$title" --notes-file "$notes" --latest
          gh release view "$version" --json body --jq .body >"$published"
          python3 .github/scripts/validate-stable-release-notes.py \
            --version "$version" --title "$title" --notes "$published" --previous "$previous"
          python3 - "$notes" "$published" <<'VERIFY_NOTES'
          from pathlib import Path
          import sys
          expected = Path(sys.argv[1]).read_text(encoding="utf-8").rstrip("\r\n")
          published = Path(sys.argv[2]).read_text(encoding="utf-8").rstrip("\r\n")
          if expected != published:
              raise SystemExit("Published release body does not match validated notes")
          print("PASS: published release body matches proposed notes")
          VERIFY_NOTES
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$version" | jq -e \
            --arg title "$title" --arg target "$expected" \
            '.tag_name == "v4.0.4" and .name == $title and .draft == false and .prerelease == false and .target_commitish == $target'
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" --jq .object.sha)"
          if [[ "$tag_sha" != "$expected" ]]; then
            printf "STOP: published tag points to unexpected commit %s\n" "$tag_sha" >&2
            exit 1
          fi
          echo "PASS: v4.0.4 release published at approved merge commit $expected"
          # One-shot helper branch is not merged to main; retire it after successful publication.
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/automation/release-v4.0.4-speedcrunch-once" >/dev/null \
            || echo "WARN: helper branch cleanup needs manual follow-up"
