name: TEMP Fix lockscreen editor shadow

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/tmp-fix-lockscreen-editor-shadow.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Fix shadow and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('config/quickshell/awtarchy/LockscreenEditor.qml')
          text = path.read_text()
          header = '    function writeDraftPoint(name, x, y, selectElement) {'
          start = text.find(header)
          end = text.find('\n    function setDraftPoint(name, x, y)', start)
          if start < 0 or end < 0:
              raise SystemExit('could not isolate writeDraftPoint')
          block = text[start:end]
          if block.count('if (selectElement)') != 2:
              raise SystemExit(f'unexpected selectElement guard count: {block.count("if (selectElement)")}')
          block = block.replace(header, '    function writeDraftPoint(name, x, y, selectPrimary) {', 1)
          block = block.replace('if (selectElement)', 'if (selectPrimary)')
          path.write_text(text[:start] + block + text[end:])
          PY

          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-editor-flick.sh
          bash tests/test-quickshell-lockscreen-live-editor.sh

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          source_path='config/quickshell/awtarchy/LockscreenEditor.qml'
          digest="$(sha256sum "$source_path" | awk '{print $1}')"
          line="${digest}"$'\t'".${source_path}"
          if ! grep -Fqx -- "$line" "$history"; then
            printf '%s\t%s\n' "$digest" ".${source_path}" >> "$history"
          fi
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/quickshell/awtarchy/LockscreenEditor.qml local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'fix: avoid lockscreen editor selection shadow'
          git push origin HEAD:feature/lockscreen-interactive-effects
