name: Lockscreen Expansion Pass 1 Development

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/scripts/apply-lockscreen-expansion-pass1.py
      - .github/workflows/lockscreen-expansion-pass1-development.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Apply Pass 1 production patch
        run: python3 .github/scripts/apply-lockscreen-expansion-pass1.py

      - name: Bash syntax
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh
          bash -n tests/test-quickshell-lockscreen-interactive-effects.sh
          bash -n tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash -n tests/test-quickshell-lockscreen-logo-cohesion.sh
          bash -n tests/test-quickshell-lockscreen-interaction-polish.sh

      - name: ShellCheck
        run: |
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh
          shellcheck tests/test-quickshell-lockscreen-interactive-effects.sh
          shellcheck tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          shellcheck tests/test-quickshell-lockscreen-logo-cohesion.sh
          shellcheck tests/test-quickshell-lockscreen-interaction-polish.sh

      - name: Focused Pass 1 regressions
        run: |
          bash tests/test-quickshell-lockscreen-interaction-polish.sh
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash tests/test-quickshell-lockscreen-logo-cohesion.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-editor-flick.sh
          bash tests/test-quickshell-lockscreen-runtime-polish.sh
          bash tests/test-quickshell-lockscreen-runtime-polish-ui.sh
          bash tests/test-quickshell-lockscreen-runtime-services.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh

      - name: Security and parity guards
        run: |
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          git diff --exit-code HEAD -- config/quickshell/awtarchy-lock/LockAuth.qml
          git diff --check

      - name: Commit implementation
        env:
          BRANCH: feature/lockscreen-interactive-effects
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add \
            config/hypr/scripts/quickshell_application_state.sh \
            config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy-lock/shell.qml \
            config/quickshell/awtarchy-lock/LockSurface.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            tests/test-quickshell-lockscreen-interactive-effects.sh \
            tests/test-quickshell-lockscreen-interactive-physics-regressions.sh \
            tests/test-quickshell-lockscreen-logo-cohesion.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Polish lockscreen interactions'
          git push origin "HEAD:${BRANCH}"
