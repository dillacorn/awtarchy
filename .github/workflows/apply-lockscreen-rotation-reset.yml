name: Apply Lockscreen Rotation Reset

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - .github/workflows/apply-lockscreen-rotation-reset.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Implement rotation and per-element reset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          app = 'config/hypr/scripts/quickshell_application_state.sh'
          replace_once(
              app,
              '        def keys_ok: ["id", "opacity", "path", "scale", "stretch_x", "stretch_y", "visible", "x", "y"];',
              '        def keys_ok: ["id", "opacity", "path", "rotation", "scale", "stretch_x", "stretch_y", "visible", "x", "y"];',
          )
          replace_once(
              app,
              '                and ((. | keys | sort) == keys_ok)',
              '                and ((. | keys - keys_ok | length) == 0)',
          )
          replace_once(
              app,
              '                and (.opacity | type) == "number" and .opacity >= 0 and .opacity <= 100\n'
              '                and (.visible | type) == "boolean"))\n'
              '        then $candidate else error("invalid custom images") end',
              '                and (.opacity | type) == "number" and .opacity >= 0 and .opacity <= 100\n'
              '                and ((.rotation // 0) | type) == "number"\n'
              '                and (.rotation // 0) >= -180 and (.rotation // 0) <= 180\n'
              '                and (.visible | type) == "boolean"))\n'
              '        then [$candidate[] | . + {rotation: (.rotation // 0)}]\n'
              '        else error("invalid custom images") end',
          )

          bar = 'config/quickshell/awtarchy/BarState.qml'
          replace_once(
              bar,
              '            const opacity = Number(raw.opacity);\n'
              '            if (!/^image-[A-Za-z0-9_-]{1,64}$/.test(id) || ids[id]',
              '            const opacity = Number(raw.opacity);\n'
              '            const rotation = Number(raw.rotation === undefined ? 0 : raw.rotation);\n'
              '            if (!/^image-[A-Za-z0-9_-]{1,64}$/.test(id) || ids[id]',
          )
          replace_once(
              bar,
              '                    || !Number.isFinite(opacity) || opacity < 0 || opacity > 100\n'
              '                    || typeof raw.visible !== "boolean")',
              '                    || !Number.isFinite(opacity) || opacity < 0 || opacity > 100\n'
              '                    || !Number.isFinite(rotation) || rotation < -180 || rotation > 180\n'
              '                    || typeof raw.visible !== "boolean")',
          )
          replace_once(
              bar,
              '                stretch_x: stretchX, stretch_y: stretchY,\n'
              '                opacity: opacity, visible: raw.visible }));',
              '                stretch_x: stretchX, stretch_y: stretchY,\n'
              '                opacity: opacity, rotation: rotation, visible: raw.visible }));',
          )

          shell = 'config/quickshell/awtarchy-lock/shell.qml'
          replace_once(
              shell,
              '            const opacity = Number(image.opacity);\n'
              '            if (!/^image-[A-Za-z0-9_-]{1,64}$/.test(id) || ids[id] || path.length === 0',
              '            const opacity = Number(image.opacity);\n'
              '            const rotation = Number(image.rotation === undefined ? 0 : image.rotation);\n'
              '            if (!/^image-[A-Za-z0-9_-]{1,64}$/.test(id) || ids[id] || path.length === 0',
          )
          replace_once(
              shell,
              '                    || !Number.isFinite(opacity) || opacity < 0 || opacity > 100\n'
              '                    || typeof image.visible !== "boolean")',
              '                    || !Number.isFinite(opacity) || opacity < 0 || opacity > 100\n'
              '                    || !Number.isFinite(rotation) || rotation < -180 || rotation > 180\n'
              '                    || typeof image.visible !== "boolean")',
          )
          replace_once(
              shell,
              '                stretch_x: stretchX, stretch_y: stretchY, opacity: opacity,\n'
              '                visible: image.visible',
              '                stretch_x: stretchX, stretch_y: stretchY, opacity: opacity,\n'
              '                rotation: rotation, visible: image.visible',
          )

          editor = 'config/quickshell/awtarchy/LockscreenEditor.qml'
          replace_once(
              editor,
              '    property real resizeCenterY: 0\n\n    function defaultVisualizer() {',
              '    property real resizeCenterY: 0\n'
              '    property string rotationElementName: ""\n'
              '    property real rotationStartAngle: 0\n'
              '    property real rotationStartValue: 0\n'
              '    property real rotationCenterX: 0\n'
              '    property real rotationCenterY: 0\n\n'
              '    function defaultVisualizer() {',
          )
          replace_once(
              editor,
              '            const opacity = Number(raw.opacity);\n'
              '            ids[id] = true;',
              '            const opacity = Number(raw.opacity);\n'
              '            const rotation = Number(raw.rotation === undefined ? 0 : raw.rotation);\n'
              '            ids[id] = true;',
          )
          replace_once(
              editor,
              '                opacity: Math.max(0, Math.min(100, Number.isFinite(opacity) ? opacity : 100)),\n'
              '                visible: typeof raw.visible === "boolean" ? raw.visible : true',
              '                opacity: Math.max(0, Math.min(100, Number.isFinite(opacity) ? opacity : 100)),\n'
              '                rotation: Math.max(-180, Math.min(180, Number.isFinite(rotation) ? rotation : 0)),\n'
              '                visible: typeof raw.visible === "boolean" ? raw.visible : true',
          )
          replace_once(
              editor,
              '            id: id, path: value, x: 0.5, y: 0.5, scale: 1.0,\n'
              '            stretch_x: 1.0, stretch_y: 1.0, opacity: 100, visible: true',
              '            id: id, path: value, x: 0.5, y: 0.5, scale: 1.0,\n'
              '            stretch_x: 1.0, stretch_y: 1.0, opacity: 100, rotation: 0, visible: true',
          )

          rotation_functions = '''    function normalizedRotation(value) {
              const numeric = Number(value);
              if (!Number.isFinite(numeric))
                  return 0;
              let normalized = ((numeric + 180) % 360 + 360) % 360 - 180;
              if (normalized === -180 && numeric > 0)
                  normalized = 180;
              return normalized;
          }

          function elementRotation(name) {
              const index = customImageIndex(name);
              if (index < 0)
                  return 0;
              return normalizedRotation(draftCustomImages[index].rotation === undefined
                  ? 0 : draftCustomImages[index].rotation);
          }

          function setDraftRotationSilently(name, rotation) {
              const index = customImageIndex(name);
              if (index < 0)
                  return;
              const next = cloneCustomImages(draftCustomImages);
              next[index].rotation = normalizedRotation(rotation);
              draftCustomImages = next;
          }

          function setDraftRotation(name, rotation) {
              if (!isCustomImage(name))
                  return;
              const numeric = Number(rotation);
              if (!Number.isFinite(numeric) || numeric < -180 || numeric > 180) {
                  statusMessage = "Rotation must be -180 to 180 degrees";
                  return;
              }
              recordUndoBeforeChange();
              setDraftRotationSilently(name, numeric);
              selectElement(name, false);
              statusMessage = "Image rotation updated";
          }

          function beginRotateElement(name, sceneX, sceneY) {
              if (!isCustomImage(name) || editorFocus.width <= 0 || editorFocus.height <= 0)
                  return;
              selectElement(name, false);
              const point = elementPoint(name);
              rotationElementName = name;
              rotationCenterX = Number(point.x) * editorFocus.width;
              rotationCenterY = Number(point.y) * editorFocus.height;
              rotationStartAngle = Math.atan2(Number(sceneY) - rotationCenterY,
                  Number(sceneX) - rotationCenterX) * 180 / Math.PI;
              rotationStartValue = elementRotation(name);
              beginHistoryTransaction();
          }

          function updateRotateElement(sceneX, sceneY) {
              if (rotationElementName.length === 0)
                  return;
              const angle = Math.atan2(Number(sceneY) - rotationCenterY,
                  Number(sceneX) - rotationCenterX) * 180 / Math.PI;
              let delta = angle - rotationStartAngle;
              if (delta > 180)
                  delta -= 360;
              else if (delta < -180)
                  delta += 360;
              setDraftRotationSilently(rotationElementName, rotationStartValue + delta);
          }

          function endRotateElement() {
              if (rotationElementName.length === 0)
                  return;
              rotationElementName = "";
              commitHistoryTransaction();
              scheduleContrastRefresh();
          }

'''
          replace_once(
              editor,
              '    function beginResizeElement(name, sceneX, sceneY) {',
              rotation_functions + '    function beginResizeElement(name, sceneX, sceneY) {',
          )

          reset_function = '''    function resetElementToDefault(name) {
              if (!elementExists(name))
                  return;
              recordUndoBeforeChange();
              if (name === "visualizer") {
                  draftVisualizer = defaultVisualizer();
              } else if (isCustomImage(name)) {
                  const index = customImageIndex(name);
                  const next = cloneCustomImages(draftCustomImages);
                  const current = next[index];
                  next[index] = ({
                      id: current.id,
                      path: current.path,
                      x: 0.5,
                      y: 0.5,
                      scale: 1.0,
                      stretch_x: 1.0,
                      stretch_y: 1.0,
                      opacity: 100,
                      rotation: 0,
                      visible: true
                  });
                  draftCustomImages = next;
              } else {
                  const defaults = defaultLayout();
                  const visibility = defaultVisibility();
                  const nextLayout = cloneLayout(draftLayout);
                  nextLayout[name] = cloneSnapshot(defaults[name]);
                  draftLayout = nextLayout;
                  const nextVisibility = cloneVisibility(draftVisibility);
                  nextVisibility[name] = name === "password" ? true : visibility[name];
                  draftVisibility = nextVisibility;
              }
              selectedElement = name;
              selectedElements = [name];
              statusMessage = elementLabel(name) + " reset to default";
              scheduleContrastRefresh();
          }

'''
          replace_once(
              editor,
              '    function setDraftBackgroundMode(mode) {',
              reset_function + '    function setDraftBackgroundMode(mode) {',
          )

          rotation_handle = '''            Rectangle {
                  id: rotationHandle
                  visible: root.isCustomImage(root.selectedElement)
                  width: 20
                  height: 20
                  radius: 10
                  x: Math.round(root.primaryPoint().x * parent.width - width / 2)
                  y: Math.round(root.primaryPoint().y * parent.height
                      - Math.max(54, 100 * root.elementScale(root.selectedElement)) - height / 2)
                  color: Theme.background
                  border.width: 2
                  border.color: Theme.focus
                  z: 40

                  Text {
                      anchors.centerIn: parent
                      text: "↻"
                      color: Theme.text
                      font.family: Theme.fontFamily
                      font.pixelSize: 11
                  }

                  MouseArea {
                      anchors.fill: parent
                      cursorShape: Qt.SizeAllCursor
                      preventStealing: true
                      onPressed: mouse => {
                          const point = parent.mapToItem(editorFocus, mouse.x, mouse.y);
                          root.beginRotateElement(root.selectedElement, point.x, point.y);
                          mouse.accepted = true;
                      }
                      onPositionChanged: mouse => {
                          if (!pressed)
                              return;
                          const point = parent.mapToItem(editorFocus, mouse.x, mouse.y);
                          root.updateRotateElement(point.x, point.y);
                      }
                      onReleased: root.endRotateElement()
                      onCanceled: root.endRotateElement()
                  }
              }

'''
          replace_once(
              editor,
              '            Rectangle {\n                visible: root.guideX >= 0',
              rotation_handle + '            Rectangle {\n                visible: root.guideX >= 0',
          )

          rotation_numeric = '''                        Text {
                              text: "Rotation"
                              visible: root.isCustomImage(root.selectedElement)
                              color: Theme.muted
                              font.family: Theme.fontFamily
                              font.pixelSize: 9
                          }
                          TextField {
                              Layout.preferredWidth: 58
                              visible: root.isCustomImage(root.selectedElement)
                              text: Number(root.elementRotation(root.selectedElement)).toFixed(1)
                              validator: DoubleValidator { bottom: -180; top: 180; decimals: 1 }
                              selectByMouse: true
                              font.pixelSize: 9
                              onEditingFinished: root.setDraftRotation(root.selectedElement, text)
                          }

'''
          replace_once(
              editor,
              '                        SettingsButton {\n                            id: selectedElementColorButton',
              rotation_numeric + '                        SettingsButton {\n                            id: selectedElementColorButton',
          )
          replace_once(
              editor,
              '                        Text { text: "Element color"; color: Theme.muted; font.family: Theme.fontFamily; font.pixelSize: 9 }',
              '                        SettingsButton {\n'
              '                            label: "Reset to Default"\n'
              '                            textSize: 9\n'
              '                            onClicked: root.resetElementToDefault(root.selectedElement)\n'
              '                        }\n'
              '                        Text { text: "Element color"; color: Theme.muted; font.family: Theme.fontFamily; font.pixelSize: 9 }',
          )

          scene = 'config/quickshell/awtarchy-lock/LockScene.qml'
          replace_once(
              scene,
              '    function elementColor(name) {',
              '    function elementRotation(name) {\n'
              '        const image = customImageForName(name);\n'
              '        if (!image)\n'
              '            return 0;\n'
              '        const value = Number(image.rotation === undefined ? 0 : image.rotation);\n'
              '        return Number.isFinite(value) ? Math.max(-180, Math.min(180, value)) : 0;\n'
              '    }\n\n'
              '    function elementColor(name) {',
          )
          replace_once(
              scene,
              '                scale: root.elementScale(elementName)\n'
              '                transformOrigin: Item.Center',
              '                scale: root.elementScale(elementName)\n'
              '                rotation: root.elementRotation(elementName)\n'
              '                transformOrigin: Item.Center',
          )
          Path('config/quickshell/awtarchy/LockPreviewScene.qml').write_text(Path(scene).read_text())
          PY

          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash tests/test-quickshell-lockscreen-rotation-reset.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-live-editor.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          git diff --check

      - name: Refresh managed stock hashes
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          printf '\n# 2026-09-12 custom-image rotation and per-element reset.\n' >> "$history"
          while IFS='|' read -r source installed; do
            digest="$(sha256sum "$source" | awk '{print $1}')"
            entry="${digest}"$'\t'"${installed}"
            if ! grep -Fqx -- "$entry" "$history"; then
              printf '%s\n' "$entry" >> "$history"
            fi
          done <<'EOF'
          config/hypr/scripts/quickshell_application_state.sh|.config/hypr/scripts/quickshell_application_state.sh
          config/quickshell/awtarchy/BarState.qml|.config/quickshell/awtarchy/BarState.qml
          config/quickshell/awtarchy/LockscreenEditor.qml|.config/quickshell/awtarchy/LockscreenEditor.qml
          config/quickshell/awtarchy/LockPreviewScene.qml|.config/quickshell/awtarchy/LockPreviewScene.qml
          config/quickshell/awtarchy-lock/shell.qml|.config/quickshell/awtarchy-lock/shell.qml
          config/quickshell/awtarchy-lock/LockScene.qml|.config/quickshell/awtarchy-lock/LockScene.qml
          EOF
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            config/hypr/scripts/quickshell_application_state.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy-lock/shell.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m "Add lockscreen image rotation and element reset"
          git push origin HEAD:feature/lockscreen-interactive-effects
