name: Dev Lockscreen Blur Iris Editor Controls

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Run focused regression
        shell: bash
        run: bash tests/test-quickshell-lockscreen-blur-iris-editor-controls.sh
