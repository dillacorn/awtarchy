name: Dev Lockscreen Blur Iris Editor Controls

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Apply approved blur, Iris Reveal, reset, and Alt-drag changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          state = "config/hypr/scripts/quickshell_application_state.sh"
          replace_exact(state,
              "LOCKSCREEN_OVERLAY_MODES_JSON='[\"none\",\"dark\",\"light\"]'\n",
              "LOCKSCREEN_OVERLAY_MODES_JSON='[\"none\",\"dark\",\"light\"]'\nLOCKSCREEN_BLUR_STYLES_JSON='[\"smooth\",\"pixelated\"]'\n")
          replace_exact(state,
              '        lockscreen_wallpaper_blur: 0,\n        lockscreen_background_opacity_previous: 100\n',
              '        lockscreen_wallpaper_blur: 0,\n        lockscreen_blur_style: "smooth",\n        lockscreen_background_opacity_previous: 100\n')
          replace_exact(state,
              '''validate_lockscreen_overlay_mode() {
    local value="$1"
    if ! jq -e -n --arg value "$value" --argjson allowed "$LOCKSCREEN_OVERLAY_MODES_JSON"         '$allowed | index($value) != null' >/dev/null 2>&1; then
        printf 'invalid lockscreen overlay mode: %s\\n' "$value" >&2
        exit 2
    fi
}

''',
              '''validate_lockscreen_overlay_mode() {
    local value="$1"
    if ! jq -e -n --arg value "$value" --argjson allowed "$LOCKSCREEN_OVERLAY_MODES_JSON"         '$allowed | index($value) != null' >/dev/null 2>&1; then
        printf 'invalid lockscreen overlay mode: %s\\n' "$value" >&2
        exit 2
    fi
}

validate_lockscreen_blur_style() {
    local value="$1"
    if ! jq -e -n --arg value "$value" --argjson allowed "$LOCKSCREEN_BLUR_STYLES_JSON" \\
        '$allowed | index($value) != null' >/dev/null 2>&1; then
        printf 'invalid lockscreen blur style: %s\\n' "$value" >&2
        exit 2
    fi
}

''')
          replace_exact(state,
              '    local background_opacity_previous_input="${18:-100}"\n    local custom_images visualizer background_opacity background_opacity_previous entry_transition entry_transition_duration\n',
              '    local background_opacity_previous_input="${18:-100}"\n    local blur_style="${19:-smooth}"\n    local custom_images visualizer background_opacity background_opacity_previous entry_transition entry_transition_duration\n')
          replace_exact(state,
              '    validate_lockscreen_overlay_mode "$overlay_mode"\n    validate_lockscreen_weather_units "$weather_units"\n',
              '    validate_lockscreen_overlay_mode "$overlay_mode"\n    validate_lockscreen_blur_style "$blur_style"\n    validate_lockscreen_weather_units "$weather_units"\n')
          replace_exact(state,
              '        --argjson wallpaper_blur "$wallpaper_blur" \\\n        --arg weather_units "$weather_units" \\\n',
              '        --argjson wallpaper_blur "$wallpaper_blur" \\\n        --arg blur_style "$blur_style" \\\n        --arg weather_units "$weather_units" \\\n')
          replace_exact(state,
              '        | .lockscreen_wallpaper_blur = $wallpaper_blur\n        | .lockscreen_weather_units = $weather_units\n',
              '        | .lockscreen_wallpaper_blur = $wallpaper_blur\n        | .lockscreen_blur_style = $blur_style\n        | .lockscreen_weather_units = $weather_units\n')
          replace_exact(state,
              '        | .lockscreen_wallpaper_blur = 0\n        | .lockscreen_weather_units = "auto"\n',
