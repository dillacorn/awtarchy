name: Dev Lockscreen Blur Iris Editor Controls

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Apply production patch
        run: python3 .github/scripts/dev-lockscreen-blur-iris-editor-controls.py
      - name: Refresh managed hashes
        shell: bash
        run: |
          history=local/share/awtarchy/quickshell-managed-history.sha256
          while IFS='|' read -r source managed; do
            hash="$(sha256sum "$source" | awk '{print $1}')"
            entry="${hash}"$'\t'"${managed}"
            if ! grep -Fqx -- "$entry" "$history"; then
              printf '%s\n' "$entry" >> "$history"
            fi
          done <<'EOF'
          config/hypr/scripts/quickshell_application_state.sh|.config/hypr/scripts/quickshell_application_state.sh
          config/quickshell/awtarchy/BarState.qml|.config/quickshell/awtarchy/BarState.qml
          config/quickshell/awtarchy/LockscreenEditor.qml|.config/quickshell/awtarchy/LockscreenEditor.qml
          config/quickshell/awtarchy/LockPreviewScene.qml|.config/quickshell/awtarchy/LockPreviewScene.qml
          config/quickshell/awtarchy/LockPreviewTransitionLayer.qml|.config/quickshell/awtarchy/LockPreviewTransitionLayer.qml
          config/quickshell/awtarchy-lock/shell.qml|.config/quickshell/awtarchy-lock/shell.qml
          config/quickshell/awtarchy-lock/LockScene.qml|.config/quickshell/awtarchy-lock/LockScene.qml
          config/quickshell/awtarchy-lock/LockSurface.qml|.config/quickshell/awtarchy-lock/LockSurface.qml
          config/quickshell/awtarchy-lock/LockTransitionLayer.qml|.config/quickshell/awtarchy-lock/LockTransitionLayer.qml
          EOF
      - name: Focused validation
        shell: bash
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-quickshell-lockscreen-blur-iris-editor-controls.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          shellcheck tests/test-quickshell-lockscreen-blur-iris-editor-controls.sh
          bash tests/test-quickshell-lockscreen-blur-iris-editor-controls.sh
          bash tests/test-quickshell-lockscreen-background-composition.sh
          bash tests/test-quickshell-lockscreen-entry-transitions.sh
          bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          cmp -s config/quickshell/awtarchy-lock/LockTransitionLayer.qml config/quickshell/awtarchy/LockPreviewTransitionLayer.qml
          git diff --exit-code origin/main -- config/quickshell/awtarchy-lock/LockAuth.qml
          grep -Fq 'Math.min(1, (root.progress - 0.45) / 0.10)' config/quickshell/awtarchy-lock/LockTransitionLayer.qml
          grep -Fq '+ 47 * Math.pow(Math.max(0, root.collapseAmount), 1.35)' config/quickshell/awtarchy-lock/LockTransitionLayer.qml
          git diff --check
      - name: Commit production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/hypr/scripts/quickshell_application_state.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy/LockPreviewTransitionLayer.qml \
            config/quickshell/awtarchy-lock/shell.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy-lock/LockSurface.qml \
            config/quickshell/awtarchy-lock/LockTransitionLayer.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git commit -m "feat: refine lockscreen blur and editor controls"
          git push origin HEAD:feature/lockscreen-interactive-effects
