name: Feature lockscreen runtime startup fix

on:
  push:
    branches:
      - feature/lockscreen-media-editor-polish

permissions:
  contents: write

jobs:
  validate-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Prove duplicate property regression RED
        run: |
          set +e
          output="$(bash tests/test-quickshell-lockscreen-multimonitor-editor.sh 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'lockscreen editor property must be declared exactly once' <<<"$output"

      - name: Apply duplicate property fix
        run: python3 .github/scripts/feature-lockscreen-editor-duplicate-property-fix.py

      - name: Refresh managed history
        run: |
          digest="$(sha256sum config/quickshell/awtarchy/LockscreenEditor.qml | awk '{print $1}')"
          entry="${digest}"$'\t''.config/quickshell/awtarchy/LockscreenEditor.qml'
          grep -Fqx -- "$entry" local/share/awtarchy/quickshell-managed-history.sha256 \
            || printf '%s\n' "$entry" >> local/share/awtarchy/quickshell-managed-history.sha256

      - name: Remove temporary validation tooling
        run: |
          git rm -f .github/scripts/feature-lockscreen-editor-duplicate-property-fix.py
          git rm -f .github/workflows/feature-lockscreen-runtime-startup-fix.yml

      - name: Focused regression GREEN
        run: bash tests/test-quickshell-lockscreen-multimonitor-editor.sh

      - name: Complete lockscreen validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          for test in tests/test-quickshell-lockscreen-*.sh; do
            echo "=== $test ==="
            bash "$test"
          done
          node tests/test-quickshell-lockscreen-efficiency.mjs
          node tests/test-quickshell-lockscreen-monitor-profile-resolver.mjs
          bash tests/test-lua-validation.sh
          bash tests/test-quickshell-production-readiness.sh
          git diff --check

      - name: Commit fixed candidate
        run: |
          git config user.name "dillacorn"
          git config user.email "28743863+dillacorn@users.noreply.github.com"
          git add config/quickshell/awtarchy/LockscreenEditor.qml
          git add local/share/awtarchy/quickshell-managed-history.sha256
          git add -u .github
          git diff --cached --check
          git commit -m "Fix lockscreen editor startup"
          git push origin HEAD:feature/lockscreen-media-editor-polish
