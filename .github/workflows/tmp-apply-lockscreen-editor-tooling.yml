name: TEMP Apply lockscreen editor tooling

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/tmp-apply-lockscreen-editor-tooling.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Apply tooling patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tmp-apply-lockscreen-editor-tooling.py

          bash -n tests/test-quickshell-lockscreen-editor-tooling.sh
          shellcheck tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-editor-flick.sh
          bash tests/test-quickshell-lockscreen-live-editor.sh
          bash tests/test-quickshell-lockscreen-editor-config-boundary.sh
          bash tests/test-quickshell-lockscreen-runtime-polish.sh

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          source_path='config/quickshell/awtarchy/LockscreenEditor.qml'
          digest="$(sha256sum "$source_path" | awk '{print $1}')"
          line="${digest}"$'\t'".${source_path}"
          if ! grep -Fqx -- "$line" "$history"; then
            printf '%s\t%s\n' "$digest" ".${source_path}" >> "$history"
          fi

          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/quickshell/awtarchy/LockscreenEditor.qml local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --quiet && {
            echo 'No production changes required.'
            exit 0
          }
          git commit -m 'feat: add lockscreen editor layout tooling'
          git push origin HEAD:feature/lockscreen-interactive-effects
