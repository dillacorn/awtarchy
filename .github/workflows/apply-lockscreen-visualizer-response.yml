name: Apply Lockscreen Visualizer Response

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - .github/workflows/apply-lockscreen-visualizer-response.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Apply approved visualizer response model
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, got {count}: {old[:150]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          state = "config/hypr/scripts/quickshell_application_state.sh"
          replace_once(state,
              'LOCKSCREEN_VISUALIZER_DEFAULT_JSON=\'{"enabled":false,"x":0.5,"y":0.8,"scale":1,"stretch_x":1,"stretch_y":1,"opacity":100,"color":"auto","bands":16,"gap":4,"height":100,"sensitivity":140,"shape":"straight","bend":45,"performance":"balanced"}\'\n',
              'LOCKSCREEN_VISUALIZER_DEFAULT_JSON=\'{"enabled":false,"x":0.5,"y":0.8,"scale":1,"stretch_x":1,"stretch_y":1,"opacity":100,"color":"auto","bands":16,"gap":4,"height":100,"sensitivity":180,"shape":"straight","bend":45,"performance":"balanced"}\'\n')
          replace_once(state,
              'and ($bend | type) == "number" and ($bend | floor) == $bend and $bend >= -360 and $bend <= 360\n                and ($performance == "balanced" or $performance == "responsive")',
              'and ($bend | type) == "number" and ($bend | floor) == $bend and $bend >= -2000 and $bend <= 2000\n                and ($performance == "balanced" or $performance == "responsive" or $performance == "high")')

          bar = "config/quickshell/awtarchy/BarState.qml"
          replace_once(bar, '        sensitivity: 140,\n        shape: "straight",\n',
                           '        sensitivity: 180,\n        shape: "straight",\n')
          replace_once(bar,
              '                || ["balanced", "responsive"].indexOf(performance) < 0\n                || !Number.isInteger(bend) || bend < -360 || bend > 360)',
              '                || ["balanced", "responsive", "high"].indexOf(performance) < 0\n                || !Number.isInteger(bend) || bend < -2000 || bend > 2000)')

          shell = "config/quickshell/awtarchy-lock/shell.qml"
          replace_once(shell, '            sensitivity: 140,\n            shape: "straight",\n',
                             '            sensitivity: 180,\n            shape: "straight",\n')
          replace_once(shell,
              '                || ["balanced", "responsive"].indexOf(performance) < 0\n                || !Number.isInteger(bend) || bend < -360 || bend > 360)',
              '                || ["balanced", "responsive", "high"].indexOf(performance) < 0\n                || !Number.isInteger(bend) || bend < -2000 || bend > 2000)')

          for path in (
              "config/quickshell/awtarchy-lock/LockScene.qml",
              "config/quickshell/awtarchy/LockPreviewScene.qml",
          ):
              replace_once(path,
                  '        return Math.round(visualizerNumber("bend", 45, -360, 360));\n',
                  '        return Math.round(visualizerNumber("bend", 45, -2000, 2000));\n')
              replace_once(path,
                  '        const sensitivity = visualizerNumber("sensitivity", 100, 25, 300) / 100;\n',
                  '        const sensitivity = visualizerNumber("sensitivity", 180, 25, 300) / 100;\n')

          editor = "config/quickshell/awtarchy/LockscreenEditor.qml"
          replace_once(editor, '            sensitivity: 140,\n            shape: "straight",\n',
                               '            sensitivity: 180,\n            shape: "straight",\n')
          replace_once(editor,
              '            bend: Number.isInteger(bend) ? Math.max(-360, Math.min(360, bend)) : defaults.bend,\n            performance: ["balanced", "responsive"].indexOf(performance) >= 0',
              '            bend: Number.isInteger(bend) ? Math.max(-2000, Math.min(2000, bend)) : defaults.bend,\n            performance: ["balanced", "responsive", "high"].indexOf(performance) >= 0')
          replace_once(editor,
              '            if (["balanced", "responsive"].indexOf(performance) < 0)\n',
              '            if (["balanced", "responsive", "high"].indexOf(performance) < 0)\n')
          replace_once(editor,
              '                bend: ({ min: -360, max: 360 })\n',
              '                bend: ({ min: -2000, max: 2000 })\n')
          replace_once(editor,
              '''                        SettingsButton { label: "Balanced"; active: root.draftVisualizer.performance === "balanced"; textSize: 9; onClicked: root.setDraftVisualizerSetting("performance", "balanced") }\n                        SettingsButton { label: "Responsive"; active: root.draftVisualizer.performance === "responsive"; textSize: 9; onClicked: root.setDraftVisualizerSetting("performance", "responsive") }\n''',
              '''                        SettingsButton { label: "Balanced 60"; active: root.draftVisualizer.performance === "balanced"; textSize: 9; onClicked: root.setDraftVisualizerSetting("performance", "balanced") }\n                        SettingsButton { label: "Responsive 90"; active: root.draftVisualizer.performance === "responsive"; textSize: 9; onClicked: root.setDraftVisualizerSetting("performance", "responsive") }\n                        SettingsButton { label: "High 120"; active: root.draftVisualizer.performance === "high"; textSize: 9; onClicked: root.setDraftVisualizerSetting("performance", "high") }\n''')
          replace_once(editor,
              '                            validator: DoubleValidator { bottom: -360; top: 360; decimals: 0 }\n',
              '                            validator: DoubleValidator { bottom: -2000; top: 2000; decimals: 0 }\n')

          audio = "config/hypr/scripts/quickshell_lockscreen_audio.sh"
          replace_once(audio,
              '''    balanced) framerate=60 ;;\n    responsive) framerate=90 ;;\n    *) framerate=60 ;;\n''',
              '''    balanced) framerate=60 ;;\n    responsive) framerate=90 ;;\n    high) framerate=120 ;;\n    *) framerate=60 ;;\n''')

          # Update older Pass 3 expectations so they assert the final approved
          # profile rather than fighting the new visualizer contract.
          transparency = "tests/test-quickshell-lockscreen-visualizer-transparency.sh"
          replace_once(transparency,
              '    and .lockscreen_visualizer.sensitivity == 140\n',
              '    and .lockscreen_visualizer.sensitivity == 180\n')
          replace_once(transparency,
              'bad_bend="${visualizer/\\"bend\\":-55/\\"bend\\":361}"\n',
              'bad_bend="${visualizer/\\"bend\\":-55/\\"bend\\":2001}"\n')
          replace_once(transparency,
              "    fail 'visualizer bend outside -360..360 was accepted'\n",
              "    fail 'visualizer bend outside -2000..2000 was accepted'\n")
          replace_once(transparency,
              '''require_text "$AUDIO_HELPER" 'responsive) framerate=90' \\\n    'audio helper has no explicit higher-responsiveness mode'\n''',
              '''require_text "$AUDIO_HELPER" 'responsive) framerate=90' \\\n    'audio helper has no explicit responsive mode'\nrequire_text "$AUDIO_HELPER" 'high) framerate=120' \\\n    'audio helper has no explicit High 120 mode'\n''')

          acceptance = "tests/test-quickshell-lockscreen-runtime-acceptance-187.sh"
          replace_once(acceptance,
              '''has "$AUDIO_HELPER" 'responsive) framerate=90' 'responsive CAVA rate is not 90 Hz'\n''',
              '''has "$AUDIO_HELPER" 'responsive) framerate=90' 'responsive CAVA rate is not 90 Hz'\nhas "$AUDIO_HELPER" 'high) framerate=120' 'high-response CAVA rate is not 120 Hz'\n''')
          PY

      - name: Update managed stock history
        run: |
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          printf '\n# 2026-09-12 final visualizer bend, sensitivity, and 60/90/120 response modes.\n' >> "$history"
          add_current_hash() {
            local source="$1" installed="$2" digest entry
            digest="$(sha256sum "$source" | awk '{print $1}')"
            entry="${digest}"$'\t'"${installed}"
            grep -Fqx -- "$entry" "$history" || printf '%s\n' "$entry" >> "$history"
          }
          add_current_hash config/hypr/scripts/quickshell_application_state.sh .config/hypr/scripts/quickshell_application_state.sh
          add_current_hash config/hypr/scripts/quickshell_lockscreen_audio.sh .config/hypr/scripts/quickshell_lockscreen_audio.sh
          add_current_hash config/quickshell/awtarchy/BarState.qml .config/quickshell/awtarchy/BarState.qml
          add_current_hash config/quickshell/awtarchy/LockscreenEditor.qml .config/quickshell/awtarchy/LockscreenEditor.qml
          add_current_hash config/quickshell/awtarchy/LockPreviewScene.qml .config/quickshell/awtarchy/LockPreviewScene.qml
          add_current_hash config/quickshell/awtarchy-lock/LockScene.qml .config/quickshell/awtarchy-lock/LockScene.qml
          add_current_hash config/quickshell/awtarchy-lock/shell.qml .config/quickshell/awtarchy-lock/shell.qml

      - name: Focused validation
        run: |
          cmp -s config/quickshell/awtarchy/LockPreviewScene.qml config/quickshell/awtarchy-lock/LockScene.qml
          cmp -s config/quickshell/awtarchy/LockPreviewAudioAnalyzer.qml config/quickshell/awtarchy-lock/LockAudioAnalyzer.qml
          bash -n config/hypr/scripts/quickshell_lockscreen_audio.sh
          shellcheck config/hypr/scripts/quickshell_lockscreen_audio.sh
          bash tests/test-quickshell-lockscreen-visualizer-editing.sh
          bash tests/test-quickshell-lockscreen-visualizer-transparency.sh
          bash tests/test-quickshell-lockscreen-runtime-acceptance-187.sh
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

      - name: Commit focused implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-lockscreen-visualizer-response.yml
          git add \
            config/hypr/scripts/quickshell_application_state.sh \
            config/hypr/scripts/quickshell_lockscreen_audio.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy-lock/shell.qml \
            tests/test-quickshell-lockscreen-visualizer-transparency.sh \
            tests/test-quickshell-lockscreen-runtime-acceptance-187.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Expand lockscreen visualizer response controls'
          git push origin HEAD:feature/lockscreen-interactive-effects
