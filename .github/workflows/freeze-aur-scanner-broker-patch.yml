name: Freeze validated aur-scanner broker patch

on:
  push:
    branches:
      - feature/aur-scanner-single-auth-prototype

permissions:
  contents: write

jobs:
  freeze:
    if: github.event.head_commit.message == 'Freeze validated aur-scanner broker patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Generate and verify patch
        run: |
          set -Eeuo pipefail
          git clone https://github.com/KiefStudioMA/ks-aur-scanner.git upstream
          git -C upstream checkout 07893f5c1a71252a8c2b584016eb6e24627a249e
          python3 tools/aur-scanner-single-auth-prototype.py upstream
          cargo fmt --all --manifest-path upstream/Cargo.toml
          mkdir -p patches/aur-scanner
          git -C upstream diff --binary > patches/aur-scanner/0001-single-auth-privileged-broker.patch
          test -s patches/aur-scanner/0001-single-auth-privileged-broker.patch
          git clone https://github.com/KiefStudioMA/ks-aur-scanner.git verify-upstream
          git -C verify-upstream checkout 07893f5c1a71252a8c2b584016eb6e24627a249e
          git -C verify-upstream apply --check "$GITHUB_WORKSPACE/patches/aur-scanner/0001-single-auth-privileged-broker.patch"
          git -C verify-upstream apply "$GITHUB_WORKSPACE/patches/aur-scanner/0001-single-auth-privileged-broker.patch"
          git -C verify-upstream diff --check
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add patches/aur-scanner/0001-single-auth-privileged-broker.patch
          git commit -m 'Add validated aur-scanner single-auth broker patch'
          git push origin HEAD:feature/aur-scanner-single-auth-prototype
