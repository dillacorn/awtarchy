name: Lockscreen Save Managed History Patcher

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/lockscreen-save-history-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Record final managed hashes
        shell: bash
        run: |
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          saver='.config/hypr/scripts/quickshell_lockscreen_editor_save.sh'
          editor='.config/quickshell/awtarchy/LockscreenEditor.qml'
          saver_source='config/hypr/scripts/quickshell_lockscreen_editor_save.sh'
          editor_source='config/quickshell/awtarchy/LockscreenEditor.qml'

          saver_hash="$(sha256sum "$saver_source" | awk '{print $1}')"
          editor_hash="$(sha256sum "$editor_source" | awk '{print $1}')"

          [[ "$saver_hash" == '6ac2f5fc2ee7beaa9395c4215194c0c3e5c7be8f325d1c2ea00040a4580805b1' ]]
          [[ "$editor_hash" == 'ab6b05a8d6b0017ccddf51ad4a9592167678f3e360ff8a5ade30a90d0e7dfbc5' ]]

          {
            printf '\n# Lockscreen Save migration compatibility and actionable diagnostics.\n'
            printf '%s\t%s\n' "$saver_hash" "$saver"
            printf '%s\t%s\n' "$editor_hash" "$editor"
          } >>"$history"

          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

      - name: Commit history and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/lockscreen-save-history-patcher.yml
          git add -- local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m "chore(lockscreen): record save compatibility hashes"
          git push origin HEAD:feature/lockscreen-interactive-effects
