name: Temporary Append PowerMenu Managed Hash

on:
  push:
    branches:
      - fix/lockscreen-defer-capture-until-lock

permissions:
  contents: write

jobs:
  append-hash:
    if: ${{ !contains(github.event.head_commit.message, 'chore: register exact PowerMenu stock hash') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/lockscreen-defer-capture-until-lock
      - name: Append exact current PowerMenu stock hash
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          line=$'410dddd7df89ff0639690cc2cae1279be6f75f366f4265ba6bff4d7a0d99badd\t.config/quickshell/awtarchy/PowerMenu.qml'
          if ! grep -Fqx -- "$line" "$history"; then
            printf '%s\n' "$line" >>"$history"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "$history"
            git commit -m 'chore: register exact PowerMenu stock hash'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
