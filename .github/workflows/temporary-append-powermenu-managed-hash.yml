name: Temporary Append PowerMenu Managed Hash

on:
  push:
    branches:
      - fix/lockscreen-defer-capture-until-lock

permissions:
  contents: write

jobs:
  cleanup-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/lockscreen-defer-capture-until-lock
      - name: Keep exact hash and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          wrong='59d4626472b3c76f8d2deb5d55fb3d7b1d283a18b94b3376636dba0f2c66ac54'
          correct=$'410dddd7df89ff0639690cc2cae1279be6f75f366f4265ba6bff4d7a0d99badd\t.config/quickshell/awtarchy/PowerMenu.qml'
          sed -i "/^${wrong}[[:space:]]/d" "$history"
          if ! grep -Fqx -- "$correct" "$history"; then
            printf '%s\n' "$correct" >>"$history"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$history"
          git rm -- '.github/workflows/temporary-append-powermenu-managed-hash.yml'
          git commit -m 'chore: finalize PowerMenu stock hash'
          git push origin "HEAD:${GITHUB_REF_NAME}"
