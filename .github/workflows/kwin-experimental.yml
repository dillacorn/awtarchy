name: KWin Experimental Validation

on:
  push:
    branches:
      - KWinWM_Migration_Trial_Investigation
    paths:
      - trials/kwin/**
      - tests/test-kwin-*
      - .github/workflows/kwin-experimental.yml
  pull_request:
    paths:
      - trials/kwin/**
      - tests/test-kwin-*
      - .github/workflows/kwin-experimental.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-smoke-and-shortcuts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 2
      - name: Shell syntax and isolated preflight contract
        run: |
          bash -n trials/kwin/preflight.sh
          bash -n tests/test-kwin-preflight.sh
          bash tests/test-kwin-preflight.sh
          bash -n trials/kwin/probe-session.sh
          bash -n tests/test-kwin-probe-session.sh
          bash tests/test-kwin-probe-session.sh
          bash -n trials/kwin/tty-smoke.sh
          bash -n tests/test-kwin-tty-smoke.sh
          bash tests/test-kwin-tty-smoke.sh
          bash -n trials/kwin/package-plan.sh
          bash -n tests/test-kwin-package-plan.sh
          bash tests/test-kwin-package-plan.sh
          python3 -m py_compile trials/kwin/prepare-session.py
          python3 tests/test-kwin-session-stage.py
          python3 -m py_compile trials/kwin/monitor-info.py
          python3 tests/test-kwin-monitor-info.py
          python3 -m py_compile trials/kwin/state-bridge.py
          python3 tests/test-kwin-state-bridge.py
      - name: Quickshell probe contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          shell = Path("trials/kwin/shell.qml").read_text()
          assert "import Quickshell" in shell
          assert "ShellRoot {" in shell
          assert "Quickshell.screens" in shell
          assert "PanelWindow {" in shell
          assert "SystemClock {" in shell
          assert 'AWTARCHY_KWIN_STATE_FILE' in shell
          assert 'workspaceState' in shell
          print("PASS: Quickshell static integration contract")
          PY
      - name: KWin scripting stub verification
        run: |
          node --check trials/kwin/state-publisher.js
          node --check tests/test-kwin-state-publisher.mjs
          node tests/test-kwin-state-publisher.mjs
          node --check trials/kwin/tiling.js
          node --check tests/test-kwin-tiling.mjs
          node tests/test-kwin-tiling.mjs
          node --check trials/kwin/shortcuts.js
          node --check tests/test-kwin-shortcuts.mjs
          node tests/test-kwin-shortcuts.mjs
      - name: Session D-Bus receiver roundtrip
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            --target "$RUNNER_TEMP/kwin-test-deps" dbus-next==0.2.3
          PYTHONPATH="$RUNNER_TEMP/kwin-test-deps" \
            dbus-run-session -- python3 tests/test-kwin-state-dbus.py
      - name: Whitespace validation
        run: git diff --check HEAD^ HEAD
