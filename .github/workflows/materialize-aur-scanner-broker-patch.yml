name: Materialize aur-scanner privileged broker patch

on:
  push:
    branches:
      - feature/aur-scanner-single-auth-prototype

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'Materialize aur-scanner privileged broker patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/aur-scanner-single-auth-prototype
      - name: Generate exact upstream patch
        run: |
          set -Eeuo pipefail
          git clone https://github.com/KiefStudioMA/ks-aur-scanner.git upstream
          git -C upstream checkout 07893f5c1a71252a8c2b584016eb6e24627a249e
          python3 tools/aur-scanner-single-auth-prototype.py upstream
          cargo fmt --manifest-path upstream/Cargo.toml --all
          mkdir -p patches/aur-scanner
          git -C upstream diff --binary > patches/aur-scanner/0001-single-auth-privileged-broker.patch
          test -s patches/aur-scanner/0001-single-auth-privileged-broker.patch
          git -C upstream diff --check
      - name: Commit generated patch
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches/aur-scanner/0001-single-auth-privileged-broker.patch
          git diff --cached --check
          git commit -m 'Refresh formatted aur-scanner privileged broker patch'
          git push origin HEAD:feature/aur-scanner-single-auth-prototype
