name: Apply Lockscreen Background Backing

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - .github/workflows/apply-lockscreen-background-backing.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Apply focused background backing correction
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          surface = "config/quickshell/awtarchy-lock/LockSurface.qml"
          replace_once(surface,
              'import QtQuick\nimport Quickshell.Wayland\n',
              'import QtQuick\nimport QtQuick.Effects\nimport Quickshell.Wayland\n')
          replace_once(surface,
              '''        }\n\n        LockScene {\n            id: scene\n''',
              '''        }\n\n        MultiEffect {\n            id: desktopCaptureBlur\n            anchors.fill: parent\n            visible: root.wallpaperBlur > 0 && desktopCapture.status === Image.Ready\n            source: desktopCapture\n            autoPaddingEnabled: false\n            blurEnabled: root.wallpaperBlur > 0\n            blurMax: 32\n            blur: Math.max(0, Math.min(1, root.wallpaperBlur / 100))\n        }\n\n        LockScene {\n            id: scene\n''')

          scene_old = '''        Image {\n            id: wallpaperImage\n            readonly property var geometry: root.wallpaperGeometry()\n            x: geometry.x\n            y: geometry.y\n            width: geometry.width\n            height: geometry.height\n            visible: false\n            source: root.wallpaperSource\n            fillMode: Image.Stretch\n            asynchronous: true\n            cache: true\n        }\n\n        MultiEffect {\n            x: wallpaperImage.x\n            y: wallpaperImage.y\n            width: wallpaperImage.width\n            height: wallpaperImage.height\n            visible: root.backgroundMode === "wallpaper" && root.wallpaperSource.length > 0\n            source: wallpaperImage\n            autoPaddingEnabled: false\n            blurEnabled: root.wallpaperBlur > 0\n            blurMax: 32\n            blur: Math.max(0, Math.min(1, root.wallpaperBlur / 100))\n        }\n'''
          scene_new = '''        Image {\n            id: wallpaperImage\n            readonly property var geometry: root.wallpaperGeometry()\n            x: geometry.x\n            y: geometry.y\n            width: geometry.width\n            height: geometry.height\n            visible: root.backgroundMode === "wallpaper" && root.wallpaperSource.length > 0\n            source: root.wallpaperSource\n            fillMode: Image.Stretch\n            asynchronous: true\n            cache: true\n        }\n'''
          for path in (
              "config/quickshell/awtarchy-lock/LockScene.qml",
              "config/quickshell/awtarchy/LockPreviewScene.qml",
          ):
              replace_once(path, scene_old, scene_new)

          editor = "config/quickshell/awtarchy/LockscreenEditor.qml"
          replace_once(editor,
              '    property int draftWallpaperBlur: 0\n    property string draftWeatherUnits: "auto"\n',
              '    property int draftWallpaperBlur: 0\n    property bool draftWallpaperBlurExplicit: false\n    property string draftWeatherUnits: "auto"\n')
          replace_once(editor,
              '            wallpaperBlur: draftWallpaperBlur,\n            weatherUnits: draftWeatherUnits\n',
              '            wallpaperBlur: draftWallpaperBlur,\n            wallpaperBlurExplicit: draftWallpaperBlurExplicit,\n            weatherUnits: draftWeatherUnits\n')
          replace_once(editor,
              '''        draftWallpaperBlur = Number.isFinite(wallpaperBlur)\n            ? Math.max(0, Math.min(100, Math.round(wallpaperBlur))) : 0;\n        draftWeatherUnits = ["auto", "fahrenheit", "celsius"].indexOf(String(snapshot.weatherUnits)) >= 0\n''',
              '''        draftWallpaperBlur = Number.isFinite(wallpaperBlur)\n            ? Math.max(0, Math.min(100, Math.round(wallpaperBlur))) : 0;\n        draftWallpaperBlurExplicit = snapshot.wallpaperBlurExplicit === true;\n        draftWeatherUnits = ["auto", "fahrenheit", "celsius"].indexOf(String(snapshot.weatherUnits)) >= 0\n''')
          replace_once(editor,
              '''        if (draftBackgroundOpacity === 100 && next < 100 && draftWallpaperBlur === 0)\n            draftWallpaperBlur = 20;\n''',
              '''        if (draftBackgroundOpacity === 100 && next < 100 && draftWallpaperBlur === 0\n                && !draftWallpaperBlurExplicit)\n            draftWallpaperBlur = 20;\n''')
          replace_once(editor,
              '''        recordUndoBeforeChange();\n        draftWallpaperBlur = Math.max(0, Math.min(100, Math.round(next)));\n    }\n\n    function setDraftVisualizerSetting''',
              '''        recordUndoBeforeChange();\n        draftWallpaperBlur = Math.max(0, Math.min(100, Math.round(next)));\n        draftWallpaperBlurExplicit = true;\n    }\n\n    function setDraftVisualizerSetting''')
          replace_once(editor,
              '''        draftWallpaperBlur = 0;\n        draftWeatherUnits = "auto";\n''',
              '''        draftWallpaperBlur = 0;\n        draftWallpaperBlurExplicit = false;\n        draftWeatherUnits = "auto";\n''')
          replace_once(editor,
              '''        draftWallpaperBlur = BarState.lockscreenWallpaperBlur();\n        draftWeatherUnits = BarState.lockscreenWeatherUnits();\n''',
              '''        draftWallpaperBlur = BarState.lockscreenWallpaperBlur();\n        draftWallpaperBlurExplicit = false;\n        draftWeatherUnits = BarState.lockscreenWeatherUnits();\n''')
          PY

      - name: Update managed stock history
        run: |
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          printf '\n# 2026-09-12 secure captured-desktop backing blur and explicit blur editing.\n' >> "$history"
          add_current_hash() {
            local source="$1" installed="$2" digest entry
            digest="$(sha256sum "$source" | awk '{print $1}')"
            entry="${digest}"$'\t'"${installed}"
            grep -Fqx -- "$entry" "$history" || printf '%s\n' "$entry" >> "$history"
          }
          add_current_hash config/hypr/scripts/quickshell_lockscreen_capture.sh .config/hypr/scripts/quickshell_lockscreen_capture.sh
          add_current_hash config/quickshell/awtarchy/LockscreenEditor.qml .config/quickshell/awtarchy/LockscreenEditor.qml
          add_current_hash config/quickshell/awtarchy/LockPreviewScene.qml .config/quickshell/awtarchy/LockPreviewScene.qml
          add_current_hash config/quickshell/awtarchy-lock/LockScene.qml .config/quickshell/awtarchy-lock/LockScene.qml
          add_current_hash config/quickshell/awtarchy-lock/LockSurface.qml .config/quickshell/awtarchy-lock/LockSurface.qml

      - name: Focused validation
        run: |
          cmp -s config/quickshell/awtarchy/LockPreviewScene.qml config/quickshell/awtarchy-lock/LockScene.qml
          bash tests/test-quickshell-lockscreen-background-composition.sh
          bash tests/test-quickshell-lockscreen-background-save-dispatch.sh
          bash tests/test-quickshell-lockscreen-transition-layer.sh
          bash tests/test-quickshell-lockscreen-capture.sh
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

      - name: Commit focused correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-lockscreen-background-backing.yml
          git add \
            config/quickshell/awtarchy-lock/LockSurface.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Blur secure captured desktop backing'
          git push origin HEAD:feature/lockscreen-interactive-effects
