name: Feature lockscreen confirm shortcuts

on:
  push:
    branches:
      - feature/lockscreen-media-editor-polish

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 2
      - name: Validate lockscreen confirm shortcuts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-quickshell-lockscreen-editor-shortcuts.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          bash tests/test-quickshell-production-readiness.sh
          git diff --check HEAD^ HEAD
