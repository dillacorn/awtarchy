name: Lockscreen Transition Startup Hardening

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - '.github/workflows/dev-lockscreen-transition-startup.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck lua5.4
      - name: Start entry transition before first frame
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('config/quickshell/awtarchy-lock/LockScene.qml'),
              Path('config/quickshell/awtarchy/LockPreviewScene.qml'),
          ]
          old = '        Qt.callLater(() => root.replayEntryTransition());'
          new = '        root.replayEntryTransition();'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one deferred transition start, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
      - name: Refresh managed history for changed scenes
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          for path in \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml; do
            rel=".${path}"
            entry="$(sha256sum "$path" | awk '{print $1}')"$'\t'"$rel"
            grep -Fqx -- "$entry" "$history" || printf '%s\n' "$entry" >>"$history"
          done
      - name: Validate transition and updater contracts
        run: |
          set -euo pipefail
          bash -n tests/test-quickshell-lockscreen-entry-transitions.sh
          shellcheck tests/test-quickshell-lockscreen-entry-transitions.sh
          bash tests/test-quickshell-lockscreen-entry-transitions.sh
          bash tests/test-quickshell-lockscreen-runtime-regressions.sh
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash tests/test-quickshell-lockscreen-interaction-polish.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-visualizer-transparency.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          git diff --exit-code origin/main -- config/quickshell/awtarchy-lock/LockAuth.qml
          git diff --check
      - name: Validate updater migration
        run: |
          set -euo pipefail
          aur_scan_fixture_installed=0
          cleanup_aur_scan_fixture() {
            if (( aur_scan_fixture_installed == 1 )); then
              sudo rm -f -- /usr/bin/aur-scan
            fi
          }
          trap cleanup_aur_scan_fixture EXIT
          if [[ ! -x /usr/bin/aur-scan ]]; then
            sudo install -m 0755 tests/fixtures/aur-scan-version-only.sh /usr/bin/aur-scan
            aur_scan_fixture_installed=1
          fi
          bash tests/test-quickshell-updater-migration.sh
          bash tests/test-quickshell-updater-bootstrap.sh
      - name: Commit verified production files only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            local/share/awtarchy/quickshell-managed-history.sha256 | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]]
          git commit -m 'Start lockscreen entry transitions synchronously'
          git push origin HEAD:feature/lockscreen-interactive-effects
