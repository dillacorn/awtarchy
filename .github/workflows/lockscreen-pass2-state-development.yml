name: Lockscreen Pass 2 State Development

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - '.github/scripts/apply-lockscreen-pass2-state.py'
      - '.github/workflows/lockscreen-pass2-state-development.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'dillacorn/awtarchy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Apply Pass 2 state implementation
        run: python3 .github/scripts/apply-lockscreen-pass2-state.py
      - name: Validate state implementation
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          bash tests/test-quickshell-lockscreen-element-system.sh || true
          git diff --check
      - name: Commit state implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/hypr/scripts/quickshell_application_state.sh config/quickshell/awtarchy/BarState.qml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add lockscreen Pass 2 persisted element state'
          git push origin HEAD:feature/lockscreen-interactive-effects
