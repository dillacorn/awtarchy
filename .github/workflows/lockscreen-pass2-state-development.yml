name: Lockscreen Pass 2 Generic Editor Development

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - '.github/scripts/apply-lockscreen-pass2-state.py'
      - '.github/workflows/lockscreen-pass2-state-development.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'dillacorn/awtarchy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils shellcheck lua5.4
      - name: Apply Pass 2 generic editor
        run: python3 .github/scripts/apply-lockscreen-pass2-state.py
      - name: Refresh Pass 2 managed history
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          while IFS='|' read -r source installed; do
            digest="$(sha256sum "$source" | awk '{print $1}')"
            entry="${digest}"$'\t'"${installed}"
            grep -Fqx -- "$entry" "$history" || printf '%s\n' "$entry" >>"$history"
          done <<'EOF'
          config/hypr/scripts/quickshell_application_state.sh|.config/hypr/scripts/quickshell_application_state.sh
          config/quickshell/awtarchy/BarState.qml|.config/quickshell/awtarchy/BarState.qml
          config/quickshell/awtarchy/LockscreenEditor.qml|.config/quickshell/awtarchy/LockscreenEditor.qml
          config/quickshell/awtarchy/LockPreviewScene.qml|.config/quickshell/awtarchy/LockPreviewScene.qml
          config/quickshell/awtarchy-lock/shell.qml|.config/quickshell/awtarchy-lock/shell.qml
          config/quickshell/awtarchy-lock/LockSurface.qml|.config/quickshell/awtarchy-lock/LockSurface.qml
          config/quickshell/awtarchy-lock/LockScene.qml|.config/quickshell/awtarchy-lock/LockScene.qml
          EOF
      - name: Validate Pass 2 editor slice
        run: |
          set -euo pipefail
          bash -n config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          git diff --check
          git diff --exit-code origin/main -- config/quickshell/awtarchy-lock/LockAuth.qml
          bash tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-foundation.sh
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          bash tests/test-quickshell-lockscreen-interaction-polish.sh
          bash tests/test-quickshell-lockscreen-live-editor.sh
          bash tests/test-quickshell-lockscreen-animation-preference.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          bash tests/test-quickshell-production-readiness.sh

          aur_scan_fixture_installed=0
          cleanup_aur_scan_fixture() {
            if (( aur_scan_fixture_installed == 1 )); then
              sudo rm -f -- /usr/bin/aur-scan
            fi
          }
          trap cleanup_aur_scan_fixture EXIT
          if [[ ! -x /usr/bin/aur-scan ]]; then
            sudo install -m 0755 tests/fixtures/aur-scan-version-only.sh /usr/bin/aur-scan
            aur_scan_fixture_installed=1
          fi
          bash tests/test-quickshell-updater-migration.sh
          cleanup_aur_scan_fixture
          aur_scan_fixture_installed=0
          trap - EXIT

          bash tests/test-quickshell-updater-bootstrap.sh
      - name: Commit generic editor slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/quickshell/awtarchy/LockscreenEditor.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add lockscreen Pass 2 generic element editor'
          git push origin HEAD:feature/lockscreen-interactive-effects
