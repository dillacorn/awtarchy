name: Lockscreen Pass 2 Secure Rendering Development

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - '.github/scripts/apply-lockscreen-pass2-state.py'
      - '.github/workflows/lockscreen-pass2-state-development.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'dillacorn/awtarchy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Apply Pass 2 secure rendering
        run: python3 .github/scripts/apply-lockscreen-pass2-state.py
      - name: Validate secure rendering slice
        run: |
          set -euo pipefail
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          git diff --check
          git diff --exit-code origin/main -- config/quickshell/awtarchy-lock/LockAuth.qml
          bash tests/test-quickshell-lockscreen-foundation.sh
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          if bash tests/test-quickshell-lockscreen-element-system.sh > /tmp/pass2-element.log 2>&1; then
            cat /tmp/pass2-element.log
            echo 'Pass 2 element contract unexpectedly passed before editor implementation' >&2
            exit 1
          fi
          cat /tmp/pass2-element.log
          grep -Fq 'FAIL: editor has no draft custom-image state' /tmp/pass2-element.log
      - name: Commit secure rendering slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy-lock/LockSurface.qml \
            config/quickshell/awtarchy-lock/shell.qml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add lockscreen Pass 2 secure element rendering'
          git push origin HEAD:feature/lockscreen-interactive-effects
