name: Temporary Lockscreen Config Root Fix

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/temp-lockscreen-config-root-fix.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Apply config-root repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python3 <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path.cwd()
          source = root / "config/quickshell/LockscreenPresentationState.js"
          helper = source.read_bytes()
          old_helper_digest = sha256(helper).hexdigest()

          helper_targets = [
              root / "config/quickshell/awtarchy/LockscreenPresentationState.js",
              root / "config/quickshell/awtarchy-lock/LockscreenPresentationState.js",
          ]
          for target in helper_targets:
              target.write_bytes(helper)

          old_import = 'import "../LockscreenPresentationState.js" as LockscreenPresentationState'
          new_import = 'import "LockscreenPresentationState.js" as LockscreenPresentationState'
          import_targets = [
              root / "config/quickshell/awtarchy/LockPreviewScene.qml",
              root / "config/quickshell/awtarchy-lock/LockScene.qml",
              root / "config/quickshell/awtarchy-lock/shell.qml",
          ]
          for target in import_targets:
              text = target.read_text()
              if text.count(old_import) != 1:
                  raise SystemExit(f"unexpected presentation helper import count in {target}: {text.count(old_import)}")
              target.write_text(text.replace(old_import, new_import, 1))

          text_test = root / "tests/test-quickshell-lockscreen-timezones-text.sh"
          text = text_test.read_text()
          old_assertion = "contains \"$SCENE\" 'import \"../LockscreenPresentationState.js\" as LockscreenPresentationState' \\\n    'shared scene does not import deterministic presentation text selection'"
          new_assertion = "contains \"$SCENE\" 'import \"LockscreenPresentationState.js\" as LockscreenPresentationState' \\\n    'shared scene does not import deterministic presentation text selection from its config root'\nrejects \"$SCENE\" 'import \"../LockscreenPresentationState.js\"' \\\n    'shared scene still imports presentation state from outside its config root'"
          if text.count(old_assertion) != 1:
              raise SystemExit("timezone/text import assertion changed unexpectedly")
          text_test.write_text(text.replace(old_assertion, new_assertion, 1))

          managed_test = root / "tests/test-quickshell-lockscreen-interactive-managed-history.sh"
          text = managed_test.read_text()
          desktop_anchor = "    'config/quickshell/awtarchy/shell.qml:.config/quickshell/awtarchy/shell.qml'\n"
          desktop_entry = "    'config/quickshell/awtarchy/LockscreenPresentationState.js:.config/quickshell/awtarchy/LockscreenPresentationState.js'\n"
          lock_anchor = "    'config/quickshell/awtarchy-lock/shell.qml:.config/quickshell/awtarchy-lock/shell.qml'\n"
          lock_entry = "    'config/quickshell/awtarchy-lock/LockscreenPresentationState.js:.config/quickshell/awtarchy-lock/LockscreenPresentationState.js'\n"
          if desktop_entry not in text:
              if text.count(desktop_anchor) != 1:
                  raise SystemExit("desktop managed-history anchor changed")
              text = text.replace(desktop_anchor, desktop_anchor + desktop_entry, 1)
          if lock_entry not in text:
              if text.count(lock_anchor) != 1:
                  raise SystemExit("lock managed-history anchor changed")
              text = text.replace(lock_anchor, lock_anchor + lock_entry, 1)
          managed_test.write_text(text)

          history_path = root / "local/share/awtarchy/quickshell-managed-history.sha256"
          history = history_path.read_text()
          additions = []
          retired_entry = f"{old_helper_digest}\t.config/quickshell/LockscreenPresentationState.js"
          if retired_entry not in history:
              additions.append(retired_entry)

          managed_sources = [
              (root / "config/quickshell/awtarchy/LockscreenPresentationState.js", ".config/quickshell/awtarchy/LockscreenPresentationState.js"),
              (root / "config/quickshell/awtarchy-lock/LockscreenPresentationState.js", ".config/quickshell/awtarchy-lock/LockscreenPresentationState.js"),
              (root / "config/quickshell/awtarchy/LockPreviewScene.qml", ".config/quickshell/awtarchy/LockPreviewScene.qml"),
              (root / "config/quickshell/awtarchy-lock/LockScene.qml", ".config/quickshell/awtarchy-lock/LockScene.qml"),
              (root / "config/quickshell/awtarchy-lock/shell.qml", ".config/quickshell/awtarchy-lock/shell.qml"),
          ]
          for path, installed in managed_sources:
              digest = sha256(path.read_bytes()).hexdigest()
              entry = f"{digest}\t{installed}"
              if entry not in history:
                  additions.append(entry)

          if additions:
              if not history.endswith("\n"):
                  history += "\n"
              history += "\n# 2026-09-14 Quickshell config-root presentation helper runtime fix.\n"
              history += "\n".join(additions) + "\n"
              history_path.write_text(history)

          source.unlink()
          PY

          cmp -s config/quickshell/awtarchy/LockPreviewScene.qml \
              config/quickshell/awtarchy-lock/LockScene.qml
          cmp -s config/quickshell/awtarchy/LockscreenPresentationState.js \
              config/quickshell/awtarchy-lock/LockscreenPresentationState.js
          ! grep -R -F 'import "../LockscreenPresentationState.js"' \
              config/quickshell/awtarchy config/quickshell/awtarchy-lock

          bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-timezones-text.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

      - name: Commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-lockscreen-config-root-fix.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(lockscreen): keep presentation helper inside config roots'
          git push origin HEAD:feature/lockscreen-interactive-effects
