name: TEMP Apply lockscreen editor flick

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/tmp-apply-lockscreen-editor-flick.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Apply editor flick patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tmp-apply-lockscreen-editor-flick.py

          bash -n tests/test-quickshell-lockscreen-editor-flick.sh
          shellcheck tests/test-quickshell-lockscreen-editor-flick.sh
          bash tests/test-quickshell-lockscreen-editor-flick.sh
          bash tests/test-quickshell-lockscreen-live-editor.sh
          bash tests/test-quickshell-lockscreen-editor-config-boundary.sh
          bash tests/test-quickshell-lockscreen-runtime-polish.sh
          bash tests/test-quickshell-lockscreen-logo-cohesion.sh

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          for source_path in \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy-lock/LockScene.qml; do
            installed_path=".${source_path}"
            digest="$(sha256sum "$source_path" | awk '{print $1}')"
            line="${digest}"$'\t'"${installed_path}"
            if ! grep -Fqx -- "$line" "$history"; then
              printf '%s\t%s\n' "$digest" "$installed_path" >> "$history"
            fi
          done

          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --quiet && {
            echo 'No production changes required.'
            exit 0
          }
          git commit -m 'feat: add lockscreen editor flick interactions'
          git push origin HEAD:feature/lockscreen-interactive-effects
