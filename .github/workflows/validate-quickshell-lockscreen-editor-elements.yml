name: Temporary Lockscreen CI Cleanup Bridge

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects

permissions:
  contents: read

jobs:
  apply-ci-cleanup:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 4

      - name: Verify exact bridge
        run: |
          test "$(git log -1 --format=%s)" = 'chore(lockscreen): stage ci cleanup bridge'
          test -f .github/lockscreen_ci_cleanup.sh

      - name: Apply and verify cleanup
        run: bash .github/lockscreen_ci_cleanup.sh

      - name: Commit verified CI cleanup
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'test(lockscreen): align current editor contracts'
          git push origin HEAD:refs/heads/feature/lockscreen-interactive-effects
