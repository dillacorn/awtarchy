name: Validate Quickshell Lockscreen Editor Elements

on:
  push:
    branches: [main, feature/lockscreen-interactive-effects]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Diff whitespace validation
        run: |
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff --check HEAD^
          fi
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Syntax and ShellCheck
        run: |
          bash -n tests/test-quickshell-lockscreen-selector-flyout.sh
          bash -n tests/test-quickshell-lockscreen-spawn-editor-semantics.sh
          bash -n tests/test-quickshell-lockscreen-rotation-reset.sh
          bash -n tests/test-quickshell-lockscreen-timezones-text.sh
          bash -n tests/test-quickshell-lockscreen-quicksettings-header.sh
          shellcheck tests/test-quickshell-lockscreen-selector-flyout.sh
          shellcheck tests/test-quickshell-lockscreen-spawn-editor-semantics.sh
          shellcheck tests/test-quickshell-lockscreen-rotation-reset.sh
          shellcheck tests/test-quickshell-lockscreen-timezones-text.sh
          shellcheck tests/test-quickshell-lockscreen-quicksettings-header.sh
          if [[ -f config/hypr/scripts/quickshell_lockscreen_timezones.sh ]]; then
            bash -n config/hypr/scripts/quickshell_lockscreen_timezones.sh
            shellcheck config/hypr/scripts/quickshell_lockscreen_timezones.sh
          fi
      - name: Selector and clock contracts
        run: bash tests/test-quickshell-lockscreen-selector-flyout.sh
      - name: Image spawn editor contracts
        run: bash tests/test-quickshell-lockscreen-spawn-editor-semantics.sh
      - name: Generic rotation contracts
        run: bash tests/test-quickshell-lockscreen-rotation-reset.sh
      - name: Timezone and text contracts
        run: bash tests/test-quickshell-lockscreen-timezones-text.sh
      - name: Quick Settings header contracts
        run: bash tests/test-quickshell-lockscreen-quicksettings-header.sh

  apply-clock-toggle:
    if: github.event_name == 'push' && github.ref_name == 'feature/lockscreen-interactive-effects' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Patch editor clock control
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('config/quickshell/awtarchy/LockscreenEditor.qml')
          text = path.read_text()
          old = '''                    RowLayout {
                        Layout.fillWidth: true; spacing: 7; visible: root.activeDrawer === "element" && root.selectedElement === "time"
                        Text { text: "Clock Format"; color: Theme.muted; font.family: Theme.fontFamily; font.pixelSize: 9 }
                        LockscreenCompactSelector {
                            Layout.preferredWidth: 210
                            model: root.clockFormatPresets
                            currentIndex: root.clockFormatIndex(root.draftClockFormat)
                            onActivated: index => root.setDraftClockFormat(root.clockFormatPresets[index].key)
                        }
                        Item { Layout.fillWidth: true }
                    }
          '''
          new = '''                    RowLayout {
                        Layout.fillWidth: true; spacing: 7; visible: root.activeDrawer === "element" && root.selectedElement === "time"
                        Text { text: "Clock Format"; color: Theme.muted; font.family: Theme.fontFamily; font.pixelSize: 9 }
                        SettingsButton {
                            label: root.draftClockFormat === "24h" ? "24-hour" : "12-hour"
                            active: root.draftClockFormat === "12h"
                            textSize: 9
                            onClicked: root.setDraftClockFormat(root.draftClockFormat === "24h" ? "12h" : "24h")
                        }
                        Item { Layout.fillWidth: true }
                    }
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one Clock Format selector block, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Focused validation
        run: |
          git diff --check
          bash tests/test-quickshell-lockscreen-selector-flyout.sh
      - name: Commit production patch and restore workflow
        run: |
          git show f56d1f12385c3eacdde00995763b8274d399ea85:.github/workflows/validate-quickshell-lockscreen-editor-elements.yml > .github/workflows/validate-quickshell-lockscreen-editor-elements.yml
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add config/quickshell/awtarchy/LockscreenEditor.qml .github/workflows/validate-quickshell-lockscreen-editor-elements.yml
          git commit -m 'feat(lockscreen): use direct clock format toggle'
          git push origin HEAD:feature/lockscreen-interactive-effects
