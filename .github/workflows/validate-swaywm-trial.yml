name: Validate Sway

on:
  push:
    branches: [main, SwayWM_Migration_Trial_Investigation]
    paths:
      - ".github/workflows/validate-swaywm-trial.yml"
      - ".github/workflows/publish-v4.3.1.yml"
      - ".github/scripts/validate-stable-release-notes.py"
      - "compositors/sway/**"
      - "tests/test-sway-*.py"
      - "tests/test-hybrid-brightness.sh"
      - "config/hypr/hyprland.lua"
      - "config/hypr/scripts/quickshell.sh"
      - "config/quickshell/awtarchy/**"
      - "config/quickshell/awtarchy-lock/**"
      - "awtarchy-install.sh"
      - "local/bin/awtarchy"
      - "local/share/awtarchy/awtarchy-runtime.sh"
      - "local/share/awtarchy/awtarchy-compositor-manager.sh"
      - "local/share/awtarchy/awtarchy-compositor-stable.sh"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-swaywm-trial.yml"
      - ".github/workflows/publish-v4.3.1.yml"
      - ".github/scripts/validate-stable-release-notes.py"
      - "compositors/sway/**"
      - "tests/test-sway-*.py"
      - "tests/test-hybrid-brightness.sh"
      - "config/hypr/hyprland.lua"
      - "config/hypr/scripts/quickshell.sh"
      - "config/quickshell/awtarchy/**"
      - "config/quickshell/awtarchy-lock/**"
      - "awtarchy-install.sh"
      - "local/bin/awtarchy"
      - "local/share/awtarchy/awtarchy-runtime.sh"
      - "local/share/awtarchy/awtarchy-compositor-manager.sh"
      - "local/share/awtarchy/awtarchy-compositor-stable.sh"

permissions:
  contents: read

jobs:
  static-and-compositor-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    steps:
      - name: Install current Arch Sway and validation tools
        run: |
          pacman -Syu --noconfirm --needed git python bash sway swayidle jq qt6-declarative diffutils

      - name: Check out exact trial commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse stable compositor manager and run Sway regressions
        run: |
          bash -n local/share/awtarchy/awtarchy-compositor-stable.sh
          bash -n local/share/awtarchy/awtarchy-compositor-manager.sh
          python tests/test-sway-stable-source.py
          python tests/test-sway-tty.py
          python tests/test-sway-single-session.py
          python tests/test-sway-trial.py
          python tests/test-sway-ipc.py
          python tests/test-sway-focus-cycle.py
          python tests/test-sway-modes.py
          python tests/test-sway-screen-picker.py
          python tests/test-sway-idle.py
          python tests/test-sway-source-refresh.py
          python tests/test-sway-monitors.py
          python tests/test-sway-quickshell-parity.py
          python tests/test-sway-flyout-layer-shell.py
          python tests/test-sway-lock.py
          python tests/test-sway-lock-capture.py
          python tests/test-sway-mime-parity.py
          python tests/test-sway-sync.py
          python tests/test-sway-satty.py
          python tests/test-sway-screenshot-parity.py
          python tests/test-sway-screenshot-sound.py
          python tests/test-sway-login-sound.py
          python tests/test-sway-ddc.py
          python tests/test-sway-utility-toggle.py
          python tests/test-sway-theme-colors.py

      - name: Parse generated Sway Quickshell layer-shell QML
        run: |
          generated="$(mktemp -d)"
          python3 compositors/sway/render-quickshell.py \
            --source config/quickshell/awtarchy \
            --dest "$generated/awtarchy-sway" \
            --bridge-dir compositors/sway
          for filename in \
              SwayFlyoutWindow.qml ScreenSharePicker.qml Launcher.qml ClipboardMenu.qml \
              Notifications.qml QuickSettings.qml ScreenshotSoundSettings.qml NetworkMenu.qml \
              BluetoothMenu.qml BatteryMenu.qml PowerMenu.qml; do
            /usr/lib/qt6/bin/qmlformat \
              "$generated/awtarchy-sway/$filename" >/dev/null
          done

      - name: Parse configuration using current Arch Sway
        env:
          WLR_BACKENDS: headless
          XDG_RUNTIME_DIR: /tmp/awtarchy-sway-ci-runtime
        run: |
          install -d -m 0700 "$XDG_RUNTIME_DIR"
          # Arch Sway carries file capabilities that GitHub container policy
          # cannot grant. A non-capability copy can still validate config.
          install -m 0755 "$(command -v sway)" "$XDG_RUNTIME_DIR/sway-validator"
          "$XDG_RUNTIME_DIR/sway-validator" -C -c compositors/sway/config
          # The one native Ly session must resolve the same Awtarchy profile.
          mkdir -p "$XDG_RUNTIME_DIR/sway/awtarchy-trial"
          cp compositors/sway/native-config "$XDG_RUNTIME_DIR/sway/config"
          cp compositors/sway/config "$XDG_RUNTIME_DIR/sway/awtarchy-trial/config"
          : >"$XDG_RUNTIME_DIR/sway/awtarchy-trial/outputs"
          : >"$XDG_RUNTIME_DIR/sway/workspaces"
          "$XDG_RUNTIME_DIR/sway-validator" -C -c "$XDG_RUNTIME_DIR/sway/config"
          # Validate the precise two-monitor profile with the real compositor.
          python - "$XDG_RUNTIME_DIR/sway-monitors.config" <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          root = Path.cwd()
          module_path = root / "compositors/sway/import-hypr-monitors.py"
          spec = importlib.util.spec_from_file_location("sway_import", module_path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          base = (root / "compositors/sway/config").read_text(encoding="utf-8")
          modes = [
              "output DP-1 mode 1920x1080@400.002Hz position 0 1080 scale 1.0",
              "output DP-3 mode 1920x1080@239.761Hz position 0 0 scale 1.0",
          ]
          Path(sys.argv[1]).write_text(mod.insert_profile(base, modes), encoding="utf-8")
          PY
          "$XDG_RUNTIME_DIR/sway-validator" -C -c "$XDG_RUNTIME_DIR/sway-monitors.config"


  pointer-selection-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Keep launcher and clipboard keyboard-first
        run: |
          python3 tests/test-launcher-pointer-selection.py
          python3 tests/test-clipboard-pointer-selection.py

  patch-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Sway changes for whitespace errors
        run: git diff --check origin/main...HEAD
