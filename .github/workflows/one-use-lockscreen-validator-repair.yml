name: One-use lockscreen validator repair

on:
  push:
    branches: [feature/lockscreen-interactive-effects]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: run lockscreen validator repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Repair parser-unsafe inline validator terminators
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('config/quickshell/awtarchy/LockscreenEditor.qml')
          text = path.read_text()
          pattern = re.compile(r'(validator: (?:Int|Double)Validator \{[^{}\n]*\});(?= selectByMouse:)')
          updated, count = pattern.subn(r'\1\n                            ', text)
          if count == 0:
              raise SystemExit('expected at least one inline validator terminator to repair')
          if re.search(r'validator: (?:Int|Double)Validator \{[^}\n]*\};', updated):
              raise SystemExit('parser-unsafe inline validator terminator remains')
          path.write_text(updated)
          print(f'repaired {count} validator terminator(s)')
          PY
          git diff --check
      - name: Commit repair and remove one-use writer
        run: |
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git rm .github/workflows/one-use-lockscreen-validator-repair.yml
          git add config/quickshell/awtarchy/LockscreenEditor.qml
          git diff --cached --check
          git commit -m 'fix: repair lockscreen editor validators'
          git push origin HEAD:feature/lockscreen-interactive-effects
