name: Feature lockscreen media/editor validation

on:
  push:
    branches: [feature/lockscreen-media-editor-polish]

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Apply final cleanup
        run: |
          python3 .github/scripts/feature-lockscreen-media-editor-task7.py
          python3 .github/scripts/feature-lockscreen-media-editor-task8.py
      - name: Focused contracts
        run: |
          bash tests/test-quickshell-lockscreen-media-editor-polish.sh
          bash tests/test-quickshell-lockscreen-media-preroll.sh
          bash tests/test-quickshell-lockscreen-animated-contrast.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
      - name: Full lockscreen regression suite
        run: |
          for test in tests/test-quickshell-lockscreen-*.sh; do
            echo "=== $test ==="
            bash "$test"
          done
          node tests/test-quickshell-lockscreen-efficiency.mjs
          bash tests/test-lua-validation.sh
          bash tests/test-quickshell-production-readiness.sh
          bash tests/test-quickshell-updater-migration.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_editor.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_contrast.sh
      - name: Validate diff
        run: git diff --check
      - name: Commit validated cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add config/quickshell/awtarchy/LockscreenEditor.qml tests/test-quickshell-lockscreen-media-editor-polish.sh tests/test-quickshell-lockscreen-interactive-managed-history.sh local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Polish lockscreen media editor'
          git push origin HEAD:feature/lockscreen-media-editor-polish
