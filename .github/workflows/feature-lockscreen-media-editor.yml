name: Feature lockscreen media/editor validation

on:
  push:
    branches: [feature/lockscreen-media-editor-polish]

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Apply staged implementation
        run: |
          python3 .github/scripts/feature-lockscreen-media-editor-apply.py
          python3 .github/scripts/feature-lockscreen-media-editor-task2.py
          python3 .github/scripts/feature-lockscreen-media-editor-task3.py
          python3 .github/scripts/feature-lockscreen-media-editor-task4.py
          python3 .github/scripts/feature-lockscreen-media-editor-task5.py
          python3 .github/scripts/feature-lockscreen-media-editor-task6.py
      - name: Focused contracts
        run: |
          bash tests/test-quickshell-lockscreen-media-editor-polish.sh
          bash tests/test-quickshell-lockscreen-media-preroll.sh
          bash tests/test-quickshell-lockscreen-animated-contrast.sh
      - name: Transition and runtime regressions
        run: |
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-runtime-regressions.sh
          bash tests/test-quickshell-lockscreen-transition-layer.sh
          bash tests/test-quickshell-lockscreen-entry-transitions.sh
          bash tests/test-quickshell-lockscreen-third-runtime-pass.sh
          bash tests/test-quickshell-lockscreen-runtime-polish.sh
          node tests/test-quickshell-lockscreen-efficiency.mjs
          bash -n config/hypr/scripts/quickshell_lockscreen_contrast.sh
      - name: Validate diff
        run: git diff --check
      - name: Commit validated implementation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add config/hypr/scripts/quickshell_lockscreen_contrast.sh config/quickshell/awtarchy/LockscreenEditor.qml tests/test-quickshell-lockscreen-element-system.sh tests/test-quickshell-lockscreen-media-editor-polish.sh
          git commit -m 'Support animated lockscreen contrast'
          git push origin HEAD:feature/lockscreen-media-editor-polish
