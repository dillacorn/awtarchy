name: Feature lockscreen media/editor validation

on:
  push:
    branches: [feature/lockscreen-media-editor-polish]

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Apply staged implementation
        run: python3 .github/scripts/feature-lockscreen-media-editor-apply.py
      - name: Focused contract
        run: bash tests/test-quickshell-lockscreen-media-editor-polish.sh
      - name: Existing editor contracts
        run: |
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
      - name: Validate diff
        run: git diff --check
      - name: Commit validated implementation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add config/quickshell/awtarchy/LockscreenEditor.qml
          git commit -m 'Polish lockscreen editor controls'
          git push origin HEAD:feature/lockscreen-media-editor-polish
