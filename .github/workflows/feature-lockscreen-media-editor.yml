name: Feature lockscreen media/editor validation

on:
  push:
    branches: [feature/lockscreen-media-editor-polish]

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Apply final cleanup
        run: |
          python3 .github/scripts/feature-lockscreen-media-editor-task7.py
          python3 .github/scripts/feature-lockscreen-media-editor-task8.py
          python3 .github/scripts/feature-lockscreen-media-editor-task9.py
      - name: Trace updater migration
        env:
          AWTARCHY_TEST_KEEP_TMP: "1"
        run: bash -x tests/test-quickshell-updater-migration.sh
