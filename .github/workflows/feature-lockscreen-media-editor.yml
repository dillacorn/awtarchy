name: Feature lockscreen media/editor validation

on:
  push:
    branches: [feature/lockscreen-media-editor-polish]

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Apply staged implementation
        run: |
          python3 .github/scripts/feature-lockscreen-media-editor-apply.py
          python3 .github/scripts/feature-lockscreen-media-editor-task2.py
      - name: Focused contract
        run: bash tests/test-quickshell-lockscreen-media-editor-polish.sh
      - name: Existing editor and Lua contracts
        run: |
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-lua-validation.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_editor.sh
      - name: Validate diff
        run: git diff --check
      - name: Commit validated implementation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add config/quickshell/awtarchy/LockscreenEditor.qml config/quickshell/awtarchy/shell.qml config/quickshell/awtarchy/QuickSettings.qml config/hypr/hyprland.lua config/hypr/scripts/quickshell_lockscreen_editor.sh
          git commit -m 'Add lockscreen editor shortcut'
          git push origin HEAD:feature/lockscreen-media-editor-polish
