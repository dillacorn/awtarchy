name: Feature lockscreen media/editor validation

on:
  push:
    branches: [feature/lockscreen-media-editor-polish]

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Apply staged implementation
        run: |
          python3 .github/scripts/feature-lockscreen-media-editor-apply.py
          python3 .github/scripts/feature-lockscreen-media-editor-task2.py
          python3 .github/scripts/feature-lockscreen-media-editor-task3.py
      - name: Focused contract
        run: bash tests/test-quickshell-lockscreen-media-editor-polish.sh
      - name: Picker and runtime contracts
        run: |
          bash -n config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh
          bash tests/test-quickshell-lockscreen-picker-targeting.sh
          bash tests/test-quickshell-lockscreen-runtime-acceptance-187.sh
          bash tests/test-quickshell-lockscreen-runtime-polish.sh
      - name: Validate diff
        run: git diff --check
      - name: Commit validated implementation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh local/share/awtarchy/awtarchy-runtime.sh tests/test-quickshell-lockscreen-picker-targeting.sh tests/test-quickshell-lockscreen-runtime-acceptance-187.sh tests/test-quickshell-lockscreen-runtime-polish.sh
          git commit -m 'Allow lockscreen media selection'
          git push origin HEAD:feature/lockscreen-media-editor-polish
