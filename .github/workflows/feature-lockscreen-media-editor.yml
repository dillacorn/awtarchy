name: Feature lockscreen media/editor finalization

on:
  push:
    branches: [feature/lockscreen-media-editor-polish]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Apply pending production cleanup
        run: |
          python3 .github/scripts/feature-lockscreen-media-editor-task7.py
          python3 .github/scripts/feature-lockscreen-media-editor-task8.py
          python3 .github/scripts/feature-lockscreen-media-editor-task9.py
      - name: Focused contracts
        run: |
          bash tests/test-quickshell-lockscreen-media-editor-polish.sh
          bash tests/test-quickshell-lockscreen-media-preroll.sh
          bash tests/test-quickshell-lockscreen-animated-contrast.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          bash tests/test-quickshell-lockscreen-selector-flyout.sh
      - name: Full lockscreen regression suite
        run: |
          for test in tests/test-quickshell-lockscreen-*.sh; do
            echo "=== $test ==="
            bash "$test"
          done
          node tests/test-quickshell-lockscreen-efficiency.mjs
          bash tests/test-lua-validation.sh
          bash tests/test-quickshell-production-readiness.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_editor.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_contrast.sh
          git diff --check
      - name: Commit production cleanup and remove temporary tooling
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com

          git add \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            tests/test-quickshell-lockscreen-media-editor-polish.sh \
            tests/test-quickshell-lockscreen-interactive-managed-history.sh \
            tests/test-quickshell-lockscreen-selector-flyout.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Finish lockscreen media editor polish'
          fi

          git rm \
            .github/workflows/feature-lockscreen-media-editor.yml \
            .github/scripts/feature-lockscreen-media-editor-apply.py \
            .github/scripts/feature-lockscreen-media-editor-task2.py \
            .github/scripts/feature-lockscreen-media-editor-task3.py \
            .github/scripts/feature-lockscreen-media-editor-task4.py \
            .github/scripts/feature-lockscreen-media-editor-task5.py \
            .github/scripts/feature-lockscreen-media-editor-task6.py \
            .github/scripts/feature-lockscreen-media-editor-task7.py \
            .github/scripts/feature-lockscreen-media-editor-task8.py \
            .github/scripts/feature-lockscreen-media-editor-task9.py
          git commit -m 'Remove temporary lockscreen validation tooling'
          git push origin HEAD:feature/lockscreen-media-editor-polish
