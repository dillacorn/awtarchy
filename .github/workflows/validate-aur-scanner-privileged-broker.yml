name: Validate aur-scanner privileged broker patch

on:
  push:
    branches:
      - feature/aur-scanner-single-auth-prototype
    paths:
      - 'patches/aur-scanner/**'
      - 'tests/test-aur-scanner-privileged-broker-patch.sh'
      - '.github/workflows/validate-aur-scanner-privileged-broker.yml'
  pull_request:
    paths:
      - 'patches/aur-scanner/**'
      - 'tests/test-aur-scanner-privileged-broker-patch.sh'
      - '.github/workflows/validate-aur-scanner-privileged-broker.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Patch contract
        run: bash tests/test-aur-scanner-privileged-broker-patch.sh
      - name: Clone exact upstream aur-scanner
        run: |
          set -Eeuo pipefail
          git clone https://github.com/KiefStudioMA/ks-aur-scanner.git upstream
          git -C upstream checkout 07893f5c1a71252a8c2b584016eb6e24627a249e
      - name: Apply saved patch
        run: |
          set -Eeuo pipefail
          git -C upstream apply --check "$GITHUB_WORKSPACE/patches/aur-scanner/0001-single-auth-privileged-broker.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/patches/aur-scanner/0001-single-auth-privileged-broker.patch"
          git -C upstream diff --check
      - name: Rust format
        working-directory: upstream
        run: cargo fmt --all --check
      - name: CLI tests
        working-directory: upstream
        run: cargo test -p aur-scanner-cli
      - name: Workspace tests
        working-directory: upstream
        run: cargo test --workspace
      - name: Clippy
        working-directory: upstream
        run: cargo clippy --workspace --all-targets -- -D warnings
