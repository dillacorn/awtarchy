name: Lockscreen Entry Transition Development

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - '.github/scripts/apply-lockscreen-entry-transitions.py'
      - '.github/workflows/dev-lockscreen-entry-transitions.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Apply deterministic transition patch
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/apply-lockscreen-entry-transitions.py
          python3 .github/scripts/apply-lockscreen-entry-transitions.py
      - name: Validate transition slice
        run: |
          set -euo pipefail
          bash -n config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-quickshell-lockscreen-entry-transitions.sh
          shellcheck tests/test-quickshell-lockscreen-entry-transitions.sh
          bash tests/test-quickshell-lockscreen-entry-transitions.sh
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash tests/test-quickshell-lockscreen-interaction-polish.sh
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-editor-config-boundary.sh
          bash tests/test-quickshell-lockscreen-live-editor.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-editor-presets.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-visualizer-transparency.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          git diff --check
          git diff --exit-code origin/main -- config/quickshell/awtarchy-lock/LockAuth.qml
      - name: Commit verified production slice only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/hypr/scripts/quickshell_application_state.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy-lock/shell.qml \
            config/quickshell/awtarchy-lock/LockSurface.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/QuickSettings.qml
          git diff --cached --quiet && exit 0
          expected="$(cat <<'EOF'
config/hypr/scripts/quickshell_application_state.sh
config/quickshell/awtarchy-lock/LockScene.qml
config/quickshell/awtarchy-lock/LockSurface.qml
config/quickshell/awtarchy-lock/shell.qml
config/quickshell/awtarchy/BarState.qml
config/quickshell/awtarchy/LockPreviewScene.qml
config/quickshell/awtarchy/LockscreenEditor.qml
config/quickshell/awtarchy/QuickSettings.qml
EOF
)"
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$expected" | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]]
          git commit -m 'Add lockscreen entry transitions'
          git push origin HEAD:feature/lockscreen-interactive-effects
