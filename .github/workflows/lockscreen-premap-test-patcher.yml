name: Lockscreen Pre-map Test Patcher

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 181 && github.event.pull_request.head.ref == 'feature/lockscreen-interactive-effects'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Update stale assertions
        run: bash .github/lockscreen-premap-test-patch.sh
      - name: Validate updated contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-quickshell-lockscreen-migration.sh
          bash tests/test-flyout-runtime-centering.sh
          bash tests/test-quickshell-lockscreen-superp-latency.sh
          git diff --check
      - name: Commit test updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test-quickshell-lockscreen-migration.sh tests/test-flyout-runtime-centering.sh
          git commit -m 'test(lockscreen): track compositor power bind'
          git push origin HEAD:feature/lockscreen-interactive-effects