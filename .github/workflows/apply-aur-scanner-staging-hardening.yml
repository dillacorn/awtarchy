name: Apply secure broker staging hardening

on:
  push:
    branches:
      - feature/aur-scanner-single-auth-prototype

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply secure broker staging hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Harden root staging and add filesystem tests
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('tools/aur-scanner-single-auth-prototype.py')
          text = path.read_text(encoding='utf-8')

          old = "'dirs = \"5.0\"\\nlibc.workspace = true\\n'"
          new = "'dirs = \"5.0\"\\nlibc.workspace = true\\ntempfile = \"3.14\"\\n'"
          if text.count(old) != 1:
              raise SystemExit(f'CLI dependency replacement marker count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = 'use std::os::unix::fs::{MetadataExt, OpenOptionsExt, PermissionsExt};'
          if text.count(old) != 1:
              raise SystemExit(f'PermissionsExt import marker count: {text.count(old)}')
          text = text.replace(old, 'use std::os::unix::fs::{MetadataExt, OpenOptionsExt};', 1)

          old = '''    let staging = std::env::temp_dir().join(format!("aur-scan-broker-{}", std::process::id()));
              fs::create_dir(&staging)
                  .with_context(|| format!("creating broker staging directory {}", staging.display()))?;
              fs::set_permissions(&staging, fs::Permissions::from_mode(0o700))?;
          '''
          new = '''    let staging = tempfile::Builder::new()
                  .prefix("aur-scan-broker-")
                  .tempdir_in("/var/tmp")
                  .context("creating secure root broker staging directory in /var/tmp")?;
          '''
          if old not in text:
              raise SystemExit('predictable staging block marker missing')
          text = text.replace(old, new, 1)

          old = 'broker_install_local(&workspace, &staging, id, &paths, asdeps),'
          if text.count(old) != 1:
              raise SystemExit(f'staging call marker count: {text.count(old)}')
          text = text.replace(
              old,
              'broker_install_local(&workspace, staging.path(), id, &paths, asdeps),',
              1,
          )

          old = '''    let _ = fs::remove_dir_all(&staging);
              result
          }
          '''
          new = '''    result
          }
          '''
          if old not in text:
              raise SystemExit('manual staging cleanup marker missing')
          text = text.replace(old, new, 1)

          marker = r'''    #[test]
              fn package_base_root_is_explicit() {
          '''
          tests = r'''    #[test]
              fn packagelist_rejects_output_outside_scanned_base() {
                  let base = tempfile::tempdir().unwrap();
                  let outside = tempfile::tempdir().unwrap();
                  let artifact = outside.path().join("escape.pkg.tar.zst");
                  std::fs::write(&artifact, b"pkg").unwrap();
                  let output = format!("{}\n", artifact.display());
                  assert!(package_paths_from_packagelist(output.as_bytes(), base.path()).is_err());
              }

              #[test]
              fn local_package_staging_rejects_symlink() {
                  use std::os::unix::fs::symlink;

                  let workspace = tempfile::tempdir().unwrap();
                  let staging = tempfile::tempdir().unwrap();
                  let real = workspace.path().join("real.pkg.tar.zst");
                  let link = workspace.path().join("link.pkg.tar.zst");
                  std::fs::write(&real, b"pkg").unwrap();
                  symlink(&real, &link).unwrap();
                  assert!(stage_local_package(
                      workspace.path(),
                      staging.path(),
                      1,
                      0,
                      &link,
                  )
                  .is_err());
              }

          '''
          if marker not in text:
              raise SystemExit('unit-test insertion marker missing')
          text = text.replace(marker, tests + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile tools/aur-scanner-single-auth-prototype.py
          git diff --check
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add tools/aur-scanner-single-auth-prototype.py
          git commit -m 'Use secure broker staging and test path isolation'
          git push origin HEAD:feature/aur-scanner-single-auth-prototype
