name: Apply Lockscreen Scale Bound

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - .github/workflows/apply-lockscreen-transition-task2.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Apply common 100x defensive scale bound
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences of {old!r}, found {count}")
              p.write_text(text.replace(old, new))

          def replace_at_least(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} occurrences of {old!r}, found {count}")
              p.write_text(text.replace(old, new))

          app = 'config/hypr/scripts/quickshell_application_state.sh'
          replace_exact(app, '$scale >= 0.5 and $scale <= 2', '$scale >= 0.5 and $scale <= 100')
          replace_exact(app, '(($candidate[$key].scale // 1) <= 2.00)', '(($candidate[$key].scale // 1) <= 100.00)')
          replace_exact(app, '.scale >= 0.50 and .scale <= 10.00', '.scale >= 0.50 and .scale <= 100.00')

          bar = 'config/quickshell/awtarchy/BarState.qml'
          replace_exact(bar, 'scale < 0.50 || scale > 2.00', 'scale < 0.50 || scale > 100.00')
          replace_exact(bar, 'scale < 0.50 || scale > 10.00', 'scale < 0.50 || scale > 100.00')

          editor = 'config/quickshell/awtarchy/LockscreenEditor.qml'
          replace_exact(editor, 'readonly property real customImageScaleMaximum: 10.0', 'readonly property real elementScaleMaximum: 100.0')
          p = Path(editor)
          text = p.read_text()
          text = text.replace('customImageScaleMaximum', 'elementScaleMaximum')
          text = text.replace('Math.min(2.00,', 'Math.min(elementScaleMaximum,')
          text = text.replace('? elementScaleMaximum : 2.00', '? elementScaleMaximum : elementScaleMaximum')
          text = text.replace('const maximum = isCustomImage(name) ? elementScaleMaximum : 2.00;', 'const maximum = elementScaleMaximum;')
          text = text.replace('root.elementScale(root.selectedElement) < 2.00', 'root.elementScale(root.selectedElement) < root.elementScaleMaximum')
          p.write_text(text)

          shell = 'config/quickshell/awtarchy-lock/shell.qml'
          replace_at_least(shell, 'scale > 2.00', 'scale > 100.00')
          replace_exact(shell, 'scale > 10.00', 'scale > 100.00')

          scene = Path('config/quickshell/awtarchy-lock/LockScene.qml')
          text = scene.read_text()
          old = 'const maximum = customImageForName(name) ? 10.00 : 2.00;'
          if text.count(old) != 1:
              raise SystemExit('LockScene scale ceiling anchor drifted')
          text = text.replace(old, 'const maximum = 100.00;')
          scene.write_text(text)
          Path('config/quickshell/awtarchy/LockPreviewScene.qml').write_text(text)

          acceptance = Path('tests/test-quickshell-lockscreen-runtime-acceptance-187.sh')
          text = acceptance.read_text()
          old = '''# Delete removes only a selected custom image through the existing undo path;
# custom images alone receive a high defensive scale ceiling.
has "$EDITOR" 'event.key === Qt.Key_Delete' 'Delete key is not routed in editor'
has "$EDITOR" 'root.removeCustomImage(root.selectedElement)' 'Delete does not use safe image removal'
has "$EDITOR" 'readonly property real customImageScaleMaximum: 10.0' 'custom image scale ceiling is not 10x'
has "$STATE" '.scale <= 10.00' 'persisted custom images still reject useful scales'
has "$BAR_STATE" 'scale > 10.00' 'BarState custom image validation ceiling is not 10x'
has "$SCENE" 'customImageForName(name) ? 10.00 : 2.00' 'renderer does not distinguish custom image scale'
'''
          new = '''# Delete removes only a selected custom image through the existing undo path;
# all elements share one high defensive scale ceiling instead of a 200% UX cap.
has "$EDITOR" 'event.key === Qt.Key_Delete' 'Delete key is not routed in editor'
has "$EDITOR" 'root.removeCustomImage(root.selectedElement)' 'Delete does not use safe image removal'
has "$EDITOR" 'readonly property real elementScaleMaximum: 100.0' 'common scale safety bound is missing'
has "$STATE" '.scale <= 100.00' 'persisted custom images do not use the common scale bound'
has "$BAR_STATE" 'scale > 100.00' 'BarState does not use the common scale bound'
has "$SCENE" 'const maximum = 100.00;' 'renderer still uses a visible 200%/10x ceiling'
'''
          if text.count(old) != 1:
              raise SystemExit('runtime acceptance scale block drifted')
          acceptance.write_text(text.replace(old, new))

          regressions = Path('tests/test-quickshell-lockscreen-runtime-regressions.sh')
          text = regressions.read_text()
          text = text.replace('customImageForName(name) ? 10.00 : 2.00', 'const maximum = 100.00;')
          regressions.write_text(text)
          PY

          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-runtime-acceptance-187.sh
          bash tests/test-quickshell-lockscreen-runtime-regressions.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          git diff --check

      - name: Refresh managed stock hashes
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          printf '\n# 2026-09-12 effectively unrestricted lockscreen element scaling.\n' >> "$history"
          while IFS='|' read -r source installed; do
            digest="$(sha256sum "$source" | awk '{print $1}')"
            entry="${digest}"$'\t'"${installed}"
            if ! grep -Fqx -- "$entry" "$history"; then
              printf '%s\n' "$entry" >> "$history"
            fi
          done <<'EOF'
          config/hypr/scripts/quickshell_application_state.sh|.config/hypr/scripts/quickshell_application_state.sh
          config/quickshell/awtarchy/BarState.qml|.config/quickshell/awtarchy/BarState.qml
          config/quickshell/awtarchy/LockscreenEditor.qml|.config/quickshell/awtarchy/LockscreenEditor.qml
          config/quickshell/awtarchy/LockPreviewScene.qml|.config/quickshell/awtarchy/LockPreviewScene.qml
          config/quickshell/awtarchy-lock/shell.qml|.config/quickshell/awtarchy-lock/shell.qml
          config/quickshell/awtarchy-lock/LockScene.qml|.config/quickshell/awtarchy-lock/LockScene.qml
          EOF
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh

      - name: Commit scale changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            config/hypr/scripts/quickshell_application_state.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy-lock/shell.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            tests/test-quickshell-lockscreen-runtime-acceptance-187.sh \
            tests/test-quickshell-lockscreen-runtime-regressions.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m "Remove lockscreen 200 percent scale ceiling"
          git push origin HEAD:feature/lockscreen-interactive-effects
