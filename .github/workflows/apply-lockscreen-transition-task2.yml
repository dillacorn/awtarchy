name: Align Lockscreen Scale Regression Test

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - .github/workflows/apply-lockscreen-transition-task2.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Update stale 200 percent regression expectation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test-quickshell-lockscreen-live-editor.sh')
          text = path.read_text()
          old = '\"scale\":2.01'
          new = '\"scale\":100.01'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale scale bound, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          bash tests/test-quickshell-lockscreen-live-editor.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          bash tests/test-quickshell-lockscreen-runtime-acceptance-187.sh
          git diff --check

      - name: Commit test alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tests/test-quickshell-lockscreen-live-editor.sh
          git commit -m "Align lockscreen scale regression bound"
          git push origin HEAD:feature/lockscreen-interactive-effects
