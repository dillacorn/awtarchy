name: Refresh Lockscreen Managed History

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - .github/workflows/apply-lockscreen-transition-task2.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Append current lockscreen stock hashes
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          printf '\n# 2026-09-12 secure desktop-to-lockscreen transition coordination.\n' >> "$history"
          while IFS='|' read -r source installed; do
            digest="$(sha256sum "$source" | awk '{print $1}')"
            entry="${digest}"$'\t'"${installed}"
            if ! grep -Fqx -- "$entry" "$history"; then
              printf '%s\n' "$entry" >> "$history"
            fi
          done <<'EOF'
          config/quickshell/awtarchy/LockPreviewScene.qml|.config/quickshell/awtarchy/LockPreviewScene.qml
          config/quickshell/awtarchy-lock/shell.qml|.config/quickshell/awtarchy-lock/shell.qml
          config/quickshell/awtarchy-lock/LockSurface.qml|.config/quickshell/awtarchy-lock/LockSurface.qml
          config/quickshell/awtarchy-lock/LockScene.qml|.config/quickshell/awtarchy-lock/LockScene.qml
          EOF
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

      - name: Commit managed history
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- local/share/awtarchy/quickshell-managed-history.sha256; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m "Refresh lockscreen managed history"
          git push origin HEAD:feature/lockscreen-interactive-effects
