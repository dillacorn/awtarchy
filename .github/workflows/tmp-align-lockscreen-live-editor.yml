name: TEMP Align lockscreen live editor contract

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/tmp-align-lockscreen-live-editor.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Align stale contract and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test-quickshell-lockscreen-live-editor.sh')
          text = path.read_text()
          replacements = [
              ('run_state save-lockscreen-editor "$valid_layout" "$valid_visibility"',
               'run_state save-lockscreen-editor "$valid_layout" "$valid_visibility" black \'#000000\' \'\''),
              ('run_state save-lockscreen-editor "$invalid_layout" "$valid_visibility" >/dev/null 2>&1',
               'run_state save-lockscreen-editor "$invalid_layout" "$valid_visibility" black \'#000000\' \'\' >/dev/null 2>&1'),
              ('run_state save-lockscreen-editor "$valid_layout" "$invalid_visibility" >/dev/null 2>&1',
               'run_state save-lockscreen-editor "$valid_layout" "$invalid_visibility" black \'#000000\' \'\' >/dev/null 2>&1'),
              ("require_text \"$SCENE\" 'required property color autoAccent' \\\n    'shared scene has no automatic black/white contrast input'",
               "require_text \"$SCENE\" 'required property var autoAccents' \\\n    'shared scene has no per-element automatic black/white contrast input'"),
              ("require_text \"$SCENE\" 'return value === \"auto\" ? root.autoAccent' \\\n    'auto element color does not use the wallpaper-derived contrast color'",
               "require_text \"$SCENE\" 'return value === \"auto\" ? safeAuto' \\\n    'auto element color does not use the per-element cached contrast color'"),
              ("require_text \"$DESKTOP_CONTRAST\" 'backend_state.tsv' \\\n    'unlocked contrast service does not react to Awtwall selections'",
               "require_text \"$DESKTOP_CONTRAST\" 'target: BarState' \\\n    'unlocked contrast service does not react to persisted lockscreen state changes'"),
              ("require_text \"$LOCK_CONTRAST\" 'lockscreen-contrast.txt' \\\n    'secure contrast reader does not consume the local cache'",
               "require_text \"$LOCK_CONTRAST\" 'lockscreen-contrast.json' \\\n    'secure contrast reader does not consume the local per-element cache'"),
              ("require_text \"$SURFACE\" 'required property color autoAccent' \\\n    'secure lock surface does not receive automatic contrast color'",
               "require_text \"$SURFACE\" 'required property var autoAccents' \\\n    'secure lock surface does not receive per-element automatic contrast colors'"),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one stale contract occurrence, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          bash -n tests/test-quickshell-lockscreen-live-editor.sh
          shellcheck tests/test-quickshell-lockscreen-live-editor.sh
          bash tests/test-quickshell-lockscreen-live-editor.sh
          bash tests/test-quickshell-lockscreen-runtime-polish.sh
          bash tests/test-quickshell-lockscreen-runtime-services.sh
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test-quickshell-lockscreen-live-editor.sh
          git diff --cached --quiet && {
            echo 'No test changes required.'
            exit 0
          }
          git commit -m 'test: align live lockscreen editor contract'
          git push origin HEAD:feature/lockscreen-interactive-effects
