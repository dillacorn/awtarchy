name: TEMP Apply lockscreen weather units

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/tmp-apply-lockscreen-weather-units.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Apply weather unit patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tmp-apply-lockscreen-weather-units.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test-quickshell-lockscreen-live-editor.sh')
          text = path.read_text()
          old = '''require_text "$EDITOR" 'weatherText: "72°F · Clear"' \\
              'editor does not render a representative weather visual'
          '''.replace('          ', '')
          new = '''require_text "$EDITOR" 'root.draftWeatherUnits === "celsius"' \\
              'editor weather preview does not react to Celsius selection'
          require_text "$EDITOR" '"22°C · Clear"' \\
              'editor does not render a representative Celsius weather visual'
          require_text "$EDITOR" '"72°F · Clear"' \\
              'editor does not render a representative Fahrenheit weather visual'
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit(f'live weather preview assertion: expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          bash -n config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_weather.sh
          shellcheck config/hypr/scripts/quickshell_lockscreen_weather.sh
          bash -n tests/test-quickshell-lockscreen-live-editor.sh
          shellcheck tests/test-quickshell-lockscreen-live-editor.sh
          bash tests/test-quickshell-lockscreen-background-save-dispatch.sh
          bash tests/test-quickshell-lockscreen-background-composition.sh
          bash tests/test-quickshell-lockscreen-weather.sh
          bash tests/test-quickshell-lockscreen-weather-units.sh
          bash tests/test-quickshell-lockscreen-editor-tooling.sh
          bash tests/test-quickshell-lockscreen-editor-flick.sh
          bash tests/test-quickshell-lockscreen-live-editor.sh
          bash tests/test-quickshell-lockscreen-editor-config-boundary.sh

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          for source_path in \
            config/hypr/scripts/quickshell_application_state.sh \
            config/hypr/scripts/quickshell_lockscreen_weather.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/LockscreenWeather.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml; do
            digest="$(sha256sum "$source_path" | awk '{print $1}')"
            line="${digest}"$'\t'".${source_path}"
            if ! grep -Fqx -- "$line" "$history"; then
              printf '%s\t%s\n' "$digest" ".${source_path}" >> "$history"
            fi
          done
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/hypr/scripts/quickshell_application_state.sh \
            config/hypr/scripts/quickshell_lockscreen_weather.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/LockscreenWeather.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            tests/test-quickshell-lockscreen-live-editor.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --quiet && {
            echo 'No production changes required.'
            exit 0
          }
          git commit -m 'feat: add lockscreen weather units'
          git push origin HEAD:feature/lockscreen-interactive-effects
