name: Lockscreen Pass 3 Render Development

on:
  push:
    branches: [feature/lockscreen-interactive-effects]

permissions:
  contents: write

jobs:
  apply-render-slice:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Apply Pass 3 render slice
        run: |
          python3 .github/scripts/apply-lockscreen-pass3-render.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test-quickshell-lockscreen-visualizer-transparency.sh')
          text = path.read_text()
          old = '''require_text "$SURFACE" 'auth.submit(root.passwordText)' \\
              'secure password submission path changed'\n'''
          new = '''require_text "$SURFACE" 'const response = password.text;' \\
              'secure password submission no longer copies the in-memory TextInput response'\n          require_text "$SURFACE" 'if (auth.submit(response))' \\
              'secure password submission path changed'\n'''
          if text.count(old) != 1:
              raise SystemExit(f'password contract anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate render slice and security contracts
        run: |
          bash -n tests/test-quickshell-lockscreen-foundation.sh
          shellcheck tests/test-quickshell-lockscreen-foundation.sh
          bash -n tests/test-quickshell-lockscreen-interactive-effects.sh
          shellcheck tests/test-quickshell-lockscreen-interactive-effects.sh
          bash -n tests/test-quickshell-lockscreen-visualizer-transparency.sh
          shellcheck tests/test-quickshell-lockscreen-visualizer-transparency.sh
          bash tests/test-quickshell-lockscreen-foundation.sh
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          bash tests/test-quickshell-lockscreen-runtime-services.sh
          bash tests/test-quickshell-lockscreen-background-composition.sh
          bash tests/test-quickshell-lockscreen-element-system.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          git diff --exit-code origin/main -- config/quickshell/awtarchy-lock/LockAuth.qml
          git diff --check
      - name: Require Pass 3 contract to advance to editor boundary
        run: |
          set +e
          output="$(bash tests/test-quickshell-lockscreen-visualizer-transparency.sh 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          [[ $status -ne 0 ]]
          grep -Fq 'FAIL: editor has no visualizer draft state' <<<"$output"
      - name: Commit verified render slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/quickshell/awtarchy-lock/cava.conf \
            config/quickshell/awtarchy-lock/LockAudioAnalyzer.qml \
            config/quickshell/awtarchy/LockPreviewAudioAnalyzer.qml \
            config/quickshell/awtarchy-lock/shell.qml \
            config/quickshell/awtarchy-lock/LockSurface.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            tests/test-quickshell-lockscreen-foundation.sh \
            tests/test-quickshell-lockscreen-interactive-effects.sh \
            tests/test-quickshell-lockscreen-visualizer-transparency.sh
          git diff --cached --quiet && exit 0
          git commit -m 'Add standalone lockscreen visualizer rendering'
          git push origin HEAD:feature/lockscreen-interactive-effects
