# github.com/dillacorn/awtarchy/tree/main/config/yazi
# ~/.config/yazi/keymap.toml

# Mouse-friendly navigation with keyboard parity.

[mgr]
prepend_keymap = [
  # Movement
  { on = ["<Up>"],    run = "arrow prev", desc = "Previous file" },
  { on = ["<Down>"],  run = "arrow next", desc = "Next file" },
  { on = ["k"],       run = "arrow prev", desc = "Previous file" },
  { on = ["j"],       run = "arrow next", desc = "Next file" },
  { on = ["g", "g"], run = "arrow top", desc = "Top" },
  { on = ["G"],       run = "arrow bot", desc = "Bottom" },

  # Enter/leave
  { on = ["<Right>"], run = "enter",     desc = "Enter directory" },
  { on = ["l"],       run = "enter",     desc = "Enter directory" },
  { on = ["<Enter>"], run = 'lua "AwtarchyYaziSmartEnter()"', desc = "Enter directory or open file" },
  { on = ["q"],       run = 'lua "AwtarchyYaziConfirmQuit(false)"', desc = "Quit with confirmation" },
  { on = ["Q"],       run = 'lua "AwtarchyYaziConfirmQuit(true)"', desc = "Quit without cwd file (confirm)" },
  { on = ["<C-w>"],   run = 'lua "AwtarchyYaziCloseTab()"', desc = "Close tab (confirm if last)" },
  { on = ["<Left>"],  run = "leave",     desc = "Up one dir" },
  { on = ["h"],       run = "leave",     desc = "Up one dir" },
  { on = ["<Backspace>"], run = "leave", desc = "Up one dir" },

  # History
  { on = ["H"],       run = "back",      desc = "Back in history" },
  { on = ["L"],       run = "forward",   desc = "Forward in history" },

  # Selection
  { on = ["<Space>"],   run = "toggle", desc = "Toggle select" },
  { on = ["<C-Space>"], run = "toggle", desc = "Toggle individual selection" },
  { on = ["<S-Up>"],    run = ['lua "AwtarchyYaziEnsureRangeSelect()"', "arrow prev"], desc = "Extend selection up" },
  { on = ["<S-Down>"],  run = ['lua "AwtarchyYaziEnsureRangeSelect()"', "arrow next"], desc = "Extend selection down" },
  { on = ["v"],         run = "visual_mode", desc = "Visual select mode" },
  { on = ["<C-a>"],     run = "toggle_all --state=on", desc = "Select all" },

  # Copy/Cut/Paste
  { on = ["y"],       run = "yank",            desc = "Yank (copy)" },
  { on = ["Y"],       run = "yank --cut",      desc = "Yank (cut)" },
  { on = ["p"],       run = "paste",           desc = "Paste" },
  { on = ["<C-c>"],   run = ['shell -- for path in %s; do printf "file://%s\\r\\n" "$path"; done | wl-copy -t text/uri-list', "yank"], desc = "Copy files + system clipboard" },
  { on = ["<C-x>"],   run = "yank --cut",      desc = "Cut selected files" },
  { on = ["<C-v>"],   run = "paste",           desc = "Paste copied/cut files" },
  { on = ["c", "y"],  run = ['shell -- for path in %s; do printf "file://%s\\r\\n" "$path"; done | wl-copy -t text/uri-list', "yank"], desc = "Copy file(s) to system clipboard" },
  { on = ["c", "z"], run = 'lua "AwtarchyYaziCompressSelection()"', desc = "Compress selection to ZIP" },
  { on = ["e", "h"], run = 'lua "AwtarchyYaziExtractZipHere()"', desc = "Extract ZIP here" },
  { on = ["e", "f"], run = 'lua "AwtarchyYaziExtractZipFolder()"', desc = "Extract ZIP to folder" },

  # File ops
  # Creation/search stay on Yazi defaults: a=create, /=find, n/N=next/previous match.
  { on = ["r"],       run = "rename",               desc = "Rename" },
  { on = ["d", "d"], run = "remove",               desc = "Trash selection" },
  { on = ["t", "e"], run = 'shell --orphan -- "$HOME/.config/hypr/scripts/default_terminal.sh" -- bash', desc = "Open terminal here" },

  # Display
  { on = ["m", "t"], run = 'lua "AwtarchyYaziToggleTimeFormat()"', desc = "Toggle modified time 24h/12h" },

  # Help
  { on = ["?"],       run = "help",           desc = "Help" }
]

[input]
prepend_keymap = [
  { on = ["<Esc>"], run = "close", desc = "Cancel input" }
]

[confirm]
prepend_keymap = [
  { on = ["<Space>"], run = "close --submit", desc = "Confirm" },
  { on = ["Y"],       run = "close --submit", desc = "Confirm" },
  { on = ["N"],       run = "close",          desc = "Cancel" }
]

[help]
append_keymap = [
  { on = ["q"], run = "close", desc = "Close help" }
]
