# Root-owned, non-executable PolicyKit terminal fallback.
# Awtarchy Foot migration candidate.
# Matches the managed Alacritty Wombat profile as closely as Foot permits.
# Appearance equivalence is still awaiting physical Hyprland runtime testing.
font=NotoSansM Nerd Font Mono:size=12
font-bold=NotoSansM Nerd Font Mono:weight=bold:size=12
font-italic=NotoSansM Nerd Font Mono:slant=italic:size=12
font-bold-italic=NotoSansM Nerd Font Mono:weight=bold:slant=italic:size=12
vertical-letter-offset=2px
dpi-aware=no
pad=22x22
initial-window-mode=windowed
title=awtarchy-polkit-agent
bold-text-in-bright=no
selection-target=primary

[csd]
preferred=none

[scrollback]
lines=0
multiplier=1

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.85
background=1f1f1f
foreground=e5e1d8
regular0=000000
regular1=f7786d
regular2=bde97c
regular3=efdfac
regular4=6ebaf8
regular5=ef88ff
regular6=90fdf8
regular7=e5e1d8
bright0=b4b4b4
bright1=f99f92
bright2=e3f7a1
bright3=f2e9bf
bright4=b3d2ff
bright5=e5bdff
bright6=c2fefa
bright7=ffffff
