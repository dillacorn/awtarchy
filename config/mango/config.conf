bind=SUPER+ALT+CTRL,B,spawn_shell,bash ~/.config/hypr/scripts/quickshell_bar_toggle.sh
bind=SUPER+CTRL,B,spawn_shell,bash ~/.config/hypr/scripts/quickshell_bar_flip.sh
bind=SUPER,A,spawn_shell,bash ~/.config/mango/scripts/animations.sh
bind=SUPER+ALT,BackSpace,spawn_shell,bash ~/.config/hypr/scripts/quickshell_quick_settings_toggle.sh
bind=SUPER+ALT,equal,spawn_shell,bash ~/.config/hypr/scripts/hypr-ddc-brightness.sh up 5
bind=SUPER+ALT,minus,spawn_shell,bash ~/.config/hypr/scripts/hypr-ddc-brightness.sh down 5
bind=SUPER+ALT,E,spawn_shell,bash ~/.config/hypr/scripts/quickshell_lockscreen_editor.sh
