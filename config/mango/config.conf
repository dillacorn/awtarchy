# Awtarchy MangoWM trial (upstream version 0.18.5).
# Keep Hyprland installed; no guessed monitor configuration.
env=QUICKSHELL_CONFIG_NAME,awtarchy-mango
cursor_theme=Bibata-Modern-Ice
cursor_size=24
env=XCURSOR_THEME,Bibata-Modern-Ice
env=XCURSOR_SIZE,24
# Preserve Awtarchy's practical Wayland environment and layout.
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=GDK_BACKEND,wayland,x11,*
env=QT_QPA_PLATFORM,wayland;xcb
env=CLUTTER_BACKEND,wayland
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=QT_QPA_PLATFORMTHEME,qt5ct
env=QT6CT_PLATFORM_PLUGIN,qt6ct
env=MOZ_ENABLE_WAYLAND,1
env=GDK_SCALE,1
env=QT_SCALE_FACTOR,1
env=GTK_THEME,Materia-dark
env=GAMESCOPE_WSI,vk_wayland
border_px=1
gap_inner_horizontal=6
gap_inner_vertical=6
gap_outer_horizontal=9
gap_outer_vertical=9
focus_color=0xa0a0a0ff
xkb_rules_layout=us
repeat_rate=35
repeat_delay=250
numlock_on=1
mouse_accel_profile=1
mouse_accel_speed=0
trackpad_natural_scrolling=1
trackpad_click_method=2
trackpad_disable_while_typing=1
tag_num=10
tag_rule=id:*,layout_name:dwindle
# Local output rules override Mango's 60 Hz preferred-mode fallback.
# This file is user-owned and never shipped as a managed default. Negative
# Hyprland coordinates must be normalized before import for XWayland safety.
source_optional=~/.config/mango/monitors-local.conf
sloppy_focus=1
warp_cursor=0
# Keep a dragged tile at its original size instead of Mango's 300x300
# temporary thumbnail. Preserve mouse-driven tiled rearrangement.
drag_tile_to_tile=1
drag_tile_small=0
# Make the landing/drop preview invisible without disabling tiled drag/drop.
# Mango's drop_color accepts RGBA hex; 00 alpha is fully transparent.
drop_color=0x00000000
# Preserve pointer position when resizing a floating window with ALT/SUPER.
drag_warp_cursor=0
allow_tearing=2
sync_obj_enable=1
xwayland_persistence=1
animations=0
layer_animations=0
# Hyprland-style short motion: original Mango defaults (500/400/300ms)
# felt sluggish. Keep workspace transitions instant as on Hyprland.
animation_duration_move=110
animation_duration_open=120
animation_duration_tag=0
animation_duration_close=90
animation_duration_focus=0
animation_curve_move=0.23,1,0.32,1
animation_curve_open=0.23,1,0.32,1
animation_curve_close=0.2,0,0.6,1
zoom_initial_ratio=0.87
blur=0
blur_layer=0
shadows=0
layer_shadows=0
border_radius=0
focused_opacity=1
unfocused_opacity=1
exec_once=bash ~/.config/mango/scripts/session.sh

# Keyboard and mouse parity with config/hypr/hyprland.lua.
# Unsupported Hyprland-only actions are intentionally not remapped to
# dangerous/non-equivalent Mango dispatchers (monitor workspace transfers,
# Hyprmoncfg, zoom, Hyprbars, shader/night-light, workspace_mix, hyprpicker).
# SUPER+SHIFT+S uses interactive area selection instead of exact-window capture.

# common key mode
key_mode=common
bind=SUPER+ALT,N,spawn_shell,bash ~/.config/mango/scripts/keymode.sh toggle noalt
bind=SUPER+ALT,M,spawn_shell,bash ~/.config/mango/scripts/keymode.sh toggle mouse
bind=SUPER+ALT,V,spawn_shell,bash ~/.config/mango/scripts/keymode.sh toggle vm
# Emergency lock shortcut avoids SUPER+CTRL+L (Hyprland window resize).
bind=SUPER+ALT+SHIFT,L,spawn_shell,bash ~/.config/mango/scripts/lock.sh lock
bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioPlay,spawn_shell,bash ~/.config/hypr/scripts/play_pause.sh
bind=NONE,XF86AudioNext,spawn_shell,playerctl next
bind=NONE,XF86AudioPrev,spawn_shell,playerctl previous
bind=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl -e4 -n2 set 5%+
bind=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl -e4 -n2 set 5%-

# default key mode
key_mode=default
bind=ALT,P,spawn_shell,bash ~/.config/mango/scripts/launcher.sh
bind=SUPER,D,spawn_shell,bash ~/.config/mango/scripts/launcher.sh
bind=ALT+SHIFT,Return,spawn_shell,python3 ~/.config/hypr/scripts/default_applications.py launch terminal
bind=SUPER+SHIFT,Return,spawn_shell,python3 ~/.config/hypr/scripts/default_applications.py launch terminal
bind=SUPER,Return,spawn_shell,python3 ~/.config/hypr/scripts/default_applications.py launch terminal
bind=ALT+SHIFT,B,spawn_shell,bash ~/.config/hypr/scripts/launch_handler.sh btop 'foot --app-id btop btop'
bind=SUPER+SHIFT,B,spawn_shell,bash ~/.config/hypr/scripts/launch_handler.sh btop 'foot --app-id btop btop'
bind=SUPER,B,spawn_shell,python3 ~/.config/hypr/scripts/default_applications.py launch browser
# Wayland display GUI replacing Hyprland-only hyprmoncfg.
bind=SUPER+CTRL,M,spawn,wdisplays
bind=SUPER+ALT,A,spawn_shell,bash ~/.config/hypr/scripts/default_applications.sh
bind=ALT+SHIFT,C,spawn_shell,foot --app-id awtarchy-qalc --title Qalc bash ~/.config/hypr/scripts/qalc-terminal.sh
bind=SUPER+SHIFT,C,spawn_shell,foot --app-id awtarchy-qalc --title Qalc bash ~/.config/hypr/scripts/qalc-terminal.sh
bind=ALT+SHIFT,M,spawn_shell,bash ~/.config/hypr/scripts/launch_handler.sh maccel 'foot --app-id maccel maccel'
bind=SUPER+SHIFT,M,spawn_shell,bash ~/.config/hypr/scripts/launch_handler.sh maccel 'foot --app-id maccel maccel'
bind=ALT,V,spawn_shell,bash ~/.config/hypr/scripts/launch_handler.sh wiremix 'foot --app-id Wiremix wiremix'
bind=SUPER,V,spawn_shell,bash ~/.config/hypr/scripts/launch_handler.sh wiremix 'foot --app-id Wiremix wiremix'
bind=SUPER,N,spawn_shell,bash ~/.config/hypr/scripts/quickshell_notifications_toggle.sh
bind=SUPER+ALT,G,spawn_shell,bash ~/.config/hypr/scripts/launch_handler.sh smtty '~/.config/hypr/scripts/default_terminal.sh --class smtty -- smtty'
bind=SUPER+ALT,L,spawn_shell,smtty -S -l
bind=SUPER+ALT,O,spawn_shell,bash ~/.config/hypr/scripts/launch_handler.sh smtty-O '~/.config/hypr/scripts/default_terminal.sh --class smtty-O --hold -- smtty -O'
