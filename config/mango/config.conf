bind=SUPER+ALT,S,spawn_shell,bash ~/.config/mango/scripts/capture.sh window
bind=SUPER+ALT+CTRL,S,spawn_shell,bash ~/.config/hypr/scripts/qr_scan.sh
bind=SUPER+ALT,D,spawn_shell,bash ~/.config/mango/scripts/capture.sh output
bind=SUPER+ALT,G,spawn_shell,bash ~/.config/hypr/scripts/gif_capture.sh
bind=SUPER+ALT,Space,spawn_shell,bash ~/.config/hypr/scripts/quickshell_notification_dismiss.sh
bind=SUPER+ALT+CTRL,V,spawn_shell,bash ~/.config/hypr/scripts/launch_handler.sh wiremix 'foot --app-id Wiremix wiremix'
bind=SUPER+ALT,Q,smartkillclient
bind=SUPER+ALT,F,togglefloating
bind=SUPER+ALT,1,view,1
bind=SUPER+ALT+SHIFT,1,tag,1
bind=SUPER+ALT,2,view,2
bind=SUPER+ALT+SHIFT,2,tag,2
bind=SUPER+ALT,3,view,3
bind=SUPER+ALT+SHIFT,3,tag,3
bind=SUPER+ALT,4,view,4
bind=SUPER+ALT+SHIFT,4,tag,4
bind=SUPER+ALT,5,view,5
bind=SUPER+ALT+SHIFT,5,tag,5
bind=SUPER+ALT,6,view,6
bind=SUPER+ALT+SHIFT,6,tag,6
bind=SUPER+ALT,7,view,7
bind=SUPER+ALT+SHIFT,7,tag,7
bind=SUPER+ALT,8,view,8
bind=SUPER+ALT+SHIFT,8,tag,8
bind=SUPER+ALT,9,view,9
bind=SUPER+ALT+SHIFT,9,tag,9
bind=SUPER+ALT,0,view,10
bind=SUPER+ALT+SHIFT,0,tag,10
mousebind=SUPER+ALT,btn_left,moveresize,curmove
mousebind=SUPER+ALT,btn_right,moveresize,curresize
mousebind=SUPER+ALT,btn_middle,togglefloating

key_mode=default
# Float the shell's own windows before its native Mango positioning backend.
window_rule=is_floating:1,no_border:1,no_animation:1,title:^Awtarchy Application Search$
window_rule=is_floating:1,no_border:1,no_animation:1,title:^Awtarchy Clipboard History$
window_rule=is_floating:1,no_border:1,no_animation:1,title:^Awtarchy Notification Center$
window_rule=is_floating:1,no_border:1,no_animation:1,title:^Awtarchy Quick Settings$
window_rule=is_floating:1,no_border:1,no_animation:1,title:^Awtarchy Network$
window_rule=is_floating:1,no_border:1,no_animation:1,title:^Awtarchy Bluetooth$
window_rule=is_floating:1,no_border:1,no_animation:1,title:^Awtarchy Battery$

# Static fail-closed substitutes for the protected Screen Share Guard groups.
# Mango's dynamic per-app guard control is NOT ported. These rules keep the
# default-protected applications masked during capture regardless of UI state.
window_rule=shield_when_capture:1,app_id:^(Bitwarden|com\.bitwarden\.desktop|KeePassXC|org\.keepassxc\.KeePassXC|1Password|com\.1password\.1password)$
window_rule=shield_when_capture:1,app_id:^(Enpass|org\.gnome\.Secrets|org\.gnome\.seahorse\.Application|OTPClient|otpclient|org\.rasalminen\.OTPClient)$
window_rule=shield_when_capture:1,app_id:^(Mullvad Browser|mullvad-browser|com\.mullvad\.Browser)$
window_rule=shield_when_capture:1,app_id:^(localsend|LocalSend|org\.localsend\.localsend|io\.github\.localsend\.localsend)$
window_rule=shield_when_capture:1,app_id:^(org\.telegram\.desktop|TelegramDesktop|telegram-desktop|telegram|Telegram)$
window_rule=shield_when_capture:1,app_id:^(Element|io\.element\.Element|im\.riot\.Riot|chat\.element\.desktop|SchildiChat|im\.fluffychat\.Fluffychat|Fractal|org\.gnome\.Fractal|nheko)$
window_rule=shield_when_capture:1,app_id:^(discord|com\.discordapp\.Discord|vesktop|dev\.vencord\.Vesktop|Fluxer|fluxer)$
window_rule=shield_when_capture:1,app_id:^com\.github\.IsmaelMartinez\.teams_for_linux$
window_rule=shield_when_capture:1,app_id:^(messages|Messages)$
window_rule=shield_when_capture:1,app_id:^firefox$,title:^Extension:.*Bitwarden Password Manager.*$
window_rule=shield_when_capture:1,app_id:^(brave-browser|chromium|google-chrome|chrome|vivaldi-stable|microsoft-edge)$,title:^Bitwarden Password Manager.*$
window_rule=shield_when_capture:1,app_id:^(brave-browser|chromium|google-chrome|chrome|vivaldi-stable|microsoft-edge)$,title:^.*Telegram.*$

# Float only Awtarchy's transient PolicyKit Foot terminal.
window_rule=is_floating:1,width:900,height:520,no_border:1,no_animation:1,app_id:^awtarchy-polkit-agent$

# Preserve Awtarchy's calculator and v4.1.5 Default Applications geometry.
window_rule=is_floating:1,width:347,height:510,no_border:1,no_animation:1,app_id:^awtarchy-qalc$
window_rule=is_floating:1,width:540,height:460,no_border:1,no_animation:1,app_id:^awtarchy-default-apps$

# Hyprland Lua floating-window parity: app IDs are matched exactly.
# Fractional Mango width/height values are relative to the output size.
# Mango floats windows centered by default, matching Hyprland's center rules.
window_rule=is_floating:1,width:0.55,height:0.70,app_id:^org\.pulseaudio\.pavucontrol$
window_rule=is_floating:1,width:0.55,height:0.70,app_id:^Pulsemixer$
window_rule=is_floating:1,width:0.65,height:0.70,app_id:^Wiremix$
window_rule=is_floating:1,width:0.70,height:0.50,app_id:^hypr_quicksettings$
window_rule=is_floating:1,width:0.50,height:0.50,app_id:^awtarchy-tips-tui$
window_rule=is_floating:1,width:0.90,height:0.96,app_id:^maccel$
window_rule=is_floating:1,width:0.50,height:0.65,app_id:^smtty$
window_rule=is_floating:1,width:0.50,height:0.65,app_id:^smtty-O$
window_rule=is_floating:1,width:0.85,height:0.90,app_id:^wallpicker$
window_rule=is_floating:1,width:0.45,height:0.45,app_id:^net\.davidotek\.pupgui2$
window_rule=is_floating:1,width:0.80,height:0.85,app_id:^btop$
# wdisplays replaces Hyprmoncfg in Mango, preserving floating display GUI.
window_rule=is_floating:1,width:0.85,height:0.90,app_id:^wdisplays$
# Original Hyprland file/chooser dialogs float without tiling.
window_rule=is_floating:1,title:^(Open File|Select a File|Choose wallpaper|Open Folder|Save As|Library|File Upload).*$
# Picture-in-picture remains floating and visible across tags.
window_rule=is_floating:1,is_global:1,width:0.25,height:0.25,offset_x:70,offset_y:65,title:^[Pp]icture.*[Pp]icture.*$
# Steam main window and Friends List remain tiled even when a popup rule matches.
window_rule=is_floating:0,app_id:^(steam|com\.valvesoftware\.Steam)$,title:^(Steam|Friends List)$
