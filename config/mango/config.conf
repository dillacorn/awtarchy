# Awtarchy MangoWM trial (upstream version 0.18.5).
# Keep Hyprland installed; no guessed monitor configuration.
env=QUICKSHELL_CONFIG_NAME,awtarchy-mango
cursor_theme=Bibata-Modern-Ice
cursor_size=24
env=XCURSOR_THEME,Bibata-Modern-Ice
env=XCURSOR_SIZE,24
cursor_size=24
cursor_theme=Bibata-Modern-Ice
# Preserve Awtarchy's practical Wayland environment and layout.
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=GDK_BACKEND,wayland,x11,*
env=QT_QPA_PLATFORM,wayland;xcb
env=CLUTTER_BACKEND,wayland
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=QT_QPA_PLATFORMTHEME,qt5ct
env=QT6CT_PLATFORM_PLUGIN,qt6ct
env=MOZ_ENABLE_WAYLAND,1
env=GDK_SCALE,1
env=QT_SCALE_FACTOR,1
env=XCURSOR_SIZE,24
env=GTK_THEME,Materia-dark
env=GAMESCOPE_WSI,vk_wayland
border_px=1
gap_inner_horizontal=6
gap_inner_vertical=6
gap_outer_horizontal=9
gap_outer_vertical=9
focus_color=0xa0a0a0ff
xkb_rules_layout=us
repeat_rate=35
repeat_delay=250
numlock_on=1
mouse_accel_profile=1
mouse_accel_speed=0
trackpad_natural_scrolling=1
trackpad_click_method=2
trackpad_disable_while_typing=1
tag_num=10
tag_rule=id:*,layout_name:dwindle
sloppy_focus=1
warp_cursor=0
allow_tearing=2
sync_obj_enable=1
xwayland_persistence=1
animations=0
layer_animations=0
blur=0
blur_layer=0
shadows=0
layer_shadows=0
border_radius=0
focused_opacity=1
unfocused_opacity=1
exec_once=bash ~/.config/mango/scripts/session.sh
bind=SUPER,D,spawn_shell,bash ~/.config/mango/scripts/launcher.sh
bind=ALT,P,spawn_shell,bash ~/.config/mango/scripts/launcher.sh
bind=SUPER,Return,spawn_shell,python3 ~/.config/hypr/scripts/default_applications.py launch terminal
bind=SUPER+SHIFT,Return,spawn_shell,python3 ~/.config/hypr/scripts/default_applications.py launch terminal
bind=SUPER,B,spawn_shell,python3 ~/.config/hypr/scripts/default_applications.py launch browser
bind=SUPER,E,spawn_shell,python3 ~/.config/hypr/scripts/default_applications.py launch file-manager
bind=SUPER+SHIFT,E,spawn,foot yazi
bind=SUPER+ALT,A,spawn_shell,bash ~/.config/hypr/scripts/default_applications.sh
bind=SUPER+SHIFT,C,spawn_shell,foot --app-id awtarchy-qalc --title Qalc bash ~/.config/hypr/scripts/qalc-terminal.sh
bind=SUPER+SHIFT,B,spawn,foot btop
bind=SUPER+ALT,G,spawn,foot smtty
bind=SUPER,P,spawn_shell,bash ~/.config/mango/scripts/power.sh
bind=SUPER+SHIFT,X,spawn_shell,bash ~/.config/mango/scripts/capture.sh area
bind=SUPER+SHIFT,F,spawn_shell,bash ~/.config/mango/scripts/capture.sh screen
bind=SUPER,Q,smartkillclient
bind=ALT+SHIFT,Q,smartkillclient
bind=ALT,F4,smartkillclient
bind=SUPER,F,togglefloating
bind=ALT,F,togglefloating
bind=SUPER+CTRL,F,togglefullscreen
bind=ALT+CTRL,F,togglefullscreen
bind=ALT,Tab,switcher,next
bind=ALT+SHIFT,Tab,switcher,prev
bind=SUPER,Y,toggleglobal
bind=SUPER,Space,toggleoverview
bind=SUPER+SHIFT,Space,toggle_special_tag
bind=SUPER+CTRL,Space,tag_special_tag
bind=ALT,bracketleft,viewtoleft
bind=ALT,bracketright,viewtoright
bind=SUPER,bracketleft,viewtoleft
bind=SUPER,bracketright,viewtoright
bind=SUPER+CTRL,L,spawn_shell,bash ~/.config/mango/scripts/lock.sh lock
bind=SUPER+SHIFT,R,reload_config
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-
bind=ALT,Left,focusdir,left
bind=ALT+SHIFT,Left,move_client,left
bind=ALT,Right,focusdir,right
bind=ALT+SHIFT,Right,move_client,right
bind=ALT,Up,focusdir,up
bind=ALT+SHIFT,Up,move_client,up
bind=ALT,Down,focusdir,down
bind=ALT+SHIFT,Down,move_client,down
bind=ALT,H,focusdir,left
bind=ALT+SHIFT,H,move_client,left
bind=ALT,J,focusdir,down
bind=ALT+SHIFT,J,move_client,down
bind=ALT,K,focusdir,up
bind=ALT+SHIFT,K,move_client,up
bind=ALT,L,focusdir,right
bind=ALT+SHIFT,L,move_client,right
bind=ALT,1,view,1
bind=ALT+SHIFT,1,tag,1
bind=ALT,2,view,2
bind=ALT+SHIFT,2,tag,2
bind=ALT,3,view,3
bind=ALT+SHIFT,3,tag,3
bind=ALT,4,view,4
bind=ALT+SHIFT,4,tag,4
bind=ALT,5,view,5
bind=ALT+SHIFT,5,tag,5
bind=ALT,6,view,6
bind=ALT+SHIFT,6,tag,6
bind=ALT,7,view,7
bind=ALT+SHIFT,7,tag,7
bind=ALT,8,view,8
bind=ALT+SHIFT,8,tag,8
bind=ALT,9,view,9
bind=ALT+SHIFT,9,tag,9
bind=SUPER,Left,focusdir,left
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER,Right,focusdir,right
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER,Up,focusdir,up
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER,H,focusdir,left
bind=SUPER+SHIFT,H,move_client,left
bind=SUPER,J,focusdir,down
bind=SUPER+SHIFT,J,move_client,down
bind=SUPER,K,focusdir,up
bind=SUPER+SHIFT,K,move_client,up
bind=SUPER,L,focusdir,right
bind=SUPER+SHIFT,L,move_client,right
bind=SUPER,1,view,1
bind=SUPER+SHIFT,1,tag,1
bind=SUPER,2,view,2
bind=SUPER+SHIFT,2,tag,2
bind=SUPER,3,view,3
bind=SUPER+SHIFT,3,tag,3
bind=SUPER,4,view,4
bind=SUPER+SHIFT,4,tag,4
bind=SUPER,5,view,5
bind=SUPER+SHIFT,5,tag,5
bind=SUPER,6,view,6
bind=SUPER+SHIFT,6,tag,6
bind=SUPER,7,view,7
bind=SUPER+SHIFT,7,tag,7
bind=SUPER,8,view,8
bind=SUPER+SHIFT,8,tag,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,9,tag,9
bind=ALT,0,view,10
bind=ALT+SHIFT,0,tag,10
bind=SUPER,0,view,10
bind=SUPER+SHIFT,0,tag,10

# Float the shell's own windows before its native Mango positioning backend.
window_rule=is_floating:1,no_border:1,no_animation:1,title:^Awtarchy Application Search$
window_rule=is_floating:1,no_border:1,no_animation:1,title:^Awtarchy Clipboard History$
window_rule=is_floating:1,no_border:1,no_animation:1,title:^Awtarchy Notification Center$
window_rule=is_floating:1,no_border:1,no_animation:1,title:^Awtarchy Quick Settings$
window_rule=is_floating:1,no_border:1,no_animation:1,title:^Awtarchy Network$
window_rule=is_floating:1,no_border:1,no_animation:1,title:^Awtarchy Bluetooth$
window_rule=is_floating:1,no_border:1,no_animation:1,title:^Awtarchy Battery$
