# Optional, hardware-specific dual-monitor MangoWM trial profile.
# ViewSonic XG2431 DP-3 above BenQ XL2566X+ DP-1, following Hyprland
# layout with positive coordinates required by Mango's XWayland path.
# Exact EDID modes confirmed using wlr-randr in Mango 0.18.5:
#   ViewSonic 1920x1080@239.761002 Hz
#   BenQ     1920x1080@400.002014 Hz
# Do not use custom:1. No scaling, HDR or VRR changes.
# This file is a template, not installed automatically by the updater.
# Activate only after testing both modes live; see trial README.
monitor_rule=name:^DP-3$,width:1920,height:1080,refresh:239.761002,x:0,y:0,scale:1,vrr:0
monitor_rule=name:^DP-1$,width:1920,height:1080,refresh:400.002014,x:0,y:1080,scale:1,vrr:0,primary:1
