# Optional, user-specific dual 1080p Mango trial monitor profile.
# Install only on the confirmed BenQ XL2566X+ (DP-1) and ViewSonic XG2431
# (DP-3) setup. No negative XWayland coordinates.
#
# Mango requests 240 Hz and 400 Hz, and picks the nearest advertised mode.
# The ViewSonic EDID reports ~239.761 Hz; BenQ EDID reports ~400.002 Hz.
# Preserve 100% scale and VRR off. BenQ is the XWayland gaming primary.
monitor_rule=name:^DP-3$,width:1920,height:1080,refresh:240,x:0,y:0,scale:1,vrr:0
monitor_rule=name:^DP-1$,width:1920,height:1080,refresh:400,x:0,y:1080,scale:1,vrr:0,primary:1
