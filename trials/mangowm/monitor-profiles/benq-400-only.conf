# Optional Mango trial: preserve the already-tested BenQ DP-1 output only.
# Measured via wlr-randr in the user's live Mango 0.18.5 session:
# 1920x1080 400.002014 Hz, x=0,y=0, scale 1, VRR disabled.
# Deliberately do NOT configure DP-3 / ViewSonic: at 60 Hz it continues
# to artifact in Mango while the same display works under Hyprland.
