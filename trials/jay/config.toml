alt-shift-Return = { type = "exec", exec = { shell = "python3 \"$HOME/.config/hypr/scripts/default_applications.py\" launch terminal" } }
alt-v = { type = "exec", exec = ["foot", "--app-id", "Wiremix", "wiremix"] }
logo-a = { type = "exec", exec = ["bash", "-lc", "bash \"$HOME/.config/jay/awtarchy-trial/launcher.sh\""] }
logo-alt-a = { type = "exec", exec = { shell = "bash \"$HOME/.config/jay/awtarchy-trial/default-apps.sh\"" } }
