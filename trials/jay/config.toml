# Isolated JayWM compositor trial; default Jay config is replaced, not inherited.
auto-reload = true
device-config-filter = "all"
show-bar = true
tearing.mode = "variant2"
vrr.mode = "variant1"
idle = { minutes = 10, grace-period = { seconds = 5 } }
on-idle = { type = "exec", exec = { prog = "swaylock", args = ["-f", "-c", "10151c"], privileged = true } }
on-graphics-initialized = { type = "exec", exec = ["bash", "-lc", "bash \"$HOME/.config/jay/awtarchy-trial/session.sh\""] }

[env]
XDG_CURRENT_DESKTOP = "jay"
XDG_SESSION_DESKTOP = "jay"
XDG_SESSION_TYPE = "wayland"
MOZ_ENABLE_WAYLAND = "1"
GDK_BACKEND = "wayland,x11,*"
QT_QPA_PLATFORM = "wayland;xcb"
QT_QPA_PLATFORMTHEME = "qt5ct"
GTK_THEME = "Materia-dark"
XCURSOR_THEME = "Bibata-Modern-Ice"
XCURSOR_SIZE = "24"

[theme]
bar-position = "top"
container-borders = "full-smart"
border-width = 1
show-titles = false

[shortcuts]
logo-Return = { type = "exec", exec = "foot" }
alt-Return = { type = "exec", exec = "foot" }
alt-shift-Return = { type = "exec", exec = ["foot", "yazi"] }
logo-e = { type = "exec", exec = "pcmanfm-qt" }
logo-r = { type = "exec", exec = "fuzzel" }
logo-space = { type = "exec", exec = "fuzzel" }
alt-p = { type = "exec", exec = "fuzzel" }
logo-q = "close"
alt-shift-q = "close"
alt-F4 = "close"
alt-f = "toggle-floating"
logo-f = "toggle-floating"
alt-ctrl-f = "toggle-fullscreen"
logo-ctrl-f = "toggle-fullscreen"
alt-d = "split-horizontal"
alt-v = "split-vertical"
alt-r = "toggle-split"
alt-m = "toggle-mono"
alt-c = "open-control-center"
logo-ctrl-o = "open-control-center"
alt-shift-r = "reload-config-toml"
logo-ctrl-l = { type = "exec", exec = { prog = "swaylock", args = ["-f", "-c", "10151c"], privileged = true } }
logo-ctrl-alt-F12 = "toggle-visualize-compositing"
logo-ctrl-shift-Left = { type = "move-to-output", direction = "left" }
alt-ctrl-shift-Left = { type = "move-to-output", direction = "left" }
logo-ctrl-shift-Right = { type = "move-to-output", direction = "right" }
alt-ctrl-shift-Right = { type = "move-to-output", direction = "right" }
logo-shift-s = { type = "exec", exec = { shell = "bash \"$HOME/.config/jay/awtarchy-trial/capture.sh\" area", privileged = true } }
Print = { type = "exec", exec = { shell = "bash \"$HOME/.config/jay/awtarchy-trial/capture.sh\" output", privileged = true } }
XF86AudioRaiseVolume = { type = "exec", exec = ["wpctl", "set-volume", "-l", "1.0", "@DEFAULT_AUDIO_SINK@", "5%+"] }
XF86AudioLowerVolume = { type = "exec", exec = ["wpctl", "set-volume", "@DEFAULT_AUDIO_SINK@", "5%-"] }
XF86AudioMute = { type = "exec", exec = ["wpctl", "set-mute", "@DEFAULT_AUDIO_SINK@", "toggle"] }
alt-h = "focus-left"
alt-shift-h = "move-left"
