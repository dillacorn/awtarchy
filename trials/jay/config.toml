# ----------------------------------------------------------------------------
# Persisted monitor modes, positions, refresh rates and scale
# This block is managed by monitor-profile.py; do not move the markers.
# The first test should import the ACTIVE Hyprland 400Hz + secondary layout.
# ----------------------------------------------------------------------------
# AWTARCHY-JAY-OUTPUTS-BEGIN
# AWTARCHY-JAY-OUTPUTS-END

# Restricted privilege tags for the isolated Jay Quickshell process.
# Jay denies workspace and foreign-toplevel management by default.
[[clients]]
match.tag = "awtarchy-jay-shell"
capabilities = ["layer-shell", "foreign-toplevel-list", "foreign-toplevel-manager", "workspace-manager", "screencopy"]

# Clipboard observers need data-control on Jay. Do not grant it to all apps.
[[clients]]
match.any = [{ comm = "wl-copy" }, { comm = "wl-paste" }]
match.sandboxed = false
capabilities = ["data-control"]

# Previous Mango issue: Default Applications must launch floating at 540x460,
# not tile or silently call Hyprland IPC in the Jay session.
[[windows]]
match.app-id = "awtarchy-default-apps"
initial-tile-state = "floating"
initial-floating-size = { width = 540, height = 460 }
initial-floating-position = { x = 200, y = 120 }

[[windows]]
match.app-id = "awtarchy-qalc"
initial-tile-state = "floating"
initial-floating-size = { width = 640, height = 520 }

# btop in Foot uses --app-id btop from ALT/SUPER+SHIFT+B. Equivalent to
# Hyprland 80% x 85% floating size on the current 1920x1080 trial monitors.
# Jay 1.15 supports fixed initial floating sizes, not monitor percentages.
[[windows]]
match.app-id = "btop"
initial-tile-state = "floating"
initial-floating-size = { width = 1536, height = 918 }

# Quickshell's individual floating utility surfaces open on their mapped
# output. Jay centers them by default; dynamic bar-relative positioning still
# needs a verified Jay-native implementation.
[[windows]]
match.title = "Awtarchy Application Search"
initial-tile-state = "floating"
initial-floating-size = { width = 420, height = 582 }

[[windows]]
match.title = "Awtarchy Clipboard History"
initial-tile-state = "floating"
initial-floating-size = { width = 880, height = 760 }

[[windows]]
match.title = "Awtarchy Notification Center"
initial-tile-state = "floating"
initial-floating-size = { width = 520, height = 760 }

[[windows]]
match.title = "Awtarchy Quick Settings"
initial-tile-state = "floating"
initial-floating-size = { width = 860, height = 850 }

[[windows]]
match.title = "Awtarchy Network"
initial-tile-state = "floating"
initial-floating-size = { width = 520, height = 600 }

[[windows]]
match.title = "Awtarchy Bluetooth"
initial-tile-state = "floating"
initial-floating-size = { width = 500, height = 600 }

[[windows]]
match.title = "Awtarchy Battery"
initial-tile-state = "floating"
initial-floating-size = { width = 560, height = 560 }

