# Awtarchy Jay session (experimental). Editing this file affects Jay only.
#
# Most common changes:
#   - Display refresh/position/scale: see AWTARCHY-JAY-OUTPUTS below.
#   - Keybindings: [shortcuts] and [modes.*.shortcuts].
#   - Floating utility windows: [[windows]] near the bottom.
#   - Gaming: tearing, VRR and direct scanout near the top.
#
# Avoid editing the marked display block by hand if you intend to use the
# Awtarchy monitor profile tool. The profile writer backs up every edit.
# Jay replaces its default config with this file (does not merge defaults).

# ----------------------------------------------------------------------------
# Compositor / gaming / input defaults
# ----------------------------------------------------------------------------
auto-reload = true
device-config-filter = "all"
gfx-api = "Vulkan"
direct-scanout = true
explicit-sync = true
workspace-display-order = "sorted"
show-bar = false
show-titles = false   # Jay compositor titles, not application-side decorations.
use-hardware-cursor = false  # Trial workaround for missing AMD hardware pointer.
cursor-size = 24
window-management-key = "Super_L"
tearing.mode = "variant2"  # Allow tearing with one fullscreen game.
vrr.mode = "variant1"      # VRR with fullscreen application(s), if supported.

# ----------------------------------------------------------------------------
# Idle security / session startup
# ----------------------------------------------------------------------------
idle = { minutes = 10, grace-period = { seconds = 5 } }
on-idle = { type = "exec", exec = { prog = "swaylock", args = ["-f", "-c", "10151c"], privileged = true } }
on-graphics-initialized = { type = "exec", exec = ["bash", "-lc", "bash \"$HOME/.config/jay/awtarchy-trial/session.sh\""] }

# ----------------------------------------------------------------------------
# Desktop environment (Jay session only)
# ----------------------------------------------------------------------------
[env]
XDG_CURRENT_DESKTOP = "jay"
XDG_SESSION_DESKTOP = "jay"
XDG_SESSION_TYPE = "wayland"
MOZ_ENABLE_WAYLAND = "1"
GDK_BACKEND = "wayland,x11,*"
QT_QPA_PLATFORM = "wayland;xcb"
QT_QPA_PLATFORMTHEME = "qt5ct"
GTK_THEME = "Materia-dark"
XCURSOR_THEME = "Bibata-Modern-Ice"
XCURSOR_SIZE = "24"

# ----------------------------------------------------------------------------
# Window appearance
# ----------------------------------------------------------------------------
[theme]
bar-position = "top"
container-borders = "full-smart"
border-width = 1

# ----------------------------------------------------------------------------
# Keyboard shortcuts
# Shortcuts use Jay's documented alt/ctrl/logo/shift modifiers.
# ALT or SUPER + 1..0 switches the GLOBAL workspace, not a per-output tag.
# ALT/SUPER + SHIFT + 1..0 moves the focused window to that workspace.
# ALT+SHIFT+R reloads after editing (auto-reload also enabled).
