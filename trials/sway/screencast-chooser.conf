# Sway-only xdg-desktop-portal-wlr: Quickshell source picker.
# dmenu protocol provides the exact source choices on stdin. The helper
# returns only a selected source on stdout, or no output on cancel/failure.
# Capture and permission decisions remain in the portal / PipeWire.
[screencast]
chooser_type=dmenu
chooser_cmd=/bin/sh -c 'python3 "${XDG_CONFIG_HOME:-$HOME/.config}/sway/awtarchy-trial/portal-chooser.py"'
