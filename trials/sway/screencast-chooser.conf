# Sway-only xdg-desktop-portal-wlr screen source selector.
# Force Awtarchy's already-installed Fuzzel dmenu instead of the portal's
# environment-dependent default order (slurp/wmenu/wofi/rofi/...).
# Keep actual capture, authorization and PipeWire with the portal backend.
[screencast]
chooser_type=dmenu
chooser_cmd=fuzzel --dmenu
